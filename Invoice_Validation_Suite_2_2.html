<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Invoice Validation Suite</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    color-scheme:light;
    --s-bg:#eef1f6; --s-panel:#ffffff; --s-ink:#0f172a; --s-muted:#5b6472;
    --s-line:#d8dee9; --s-brand:#475569; --s-brand-ink:#1e293b; --s-brand-soft:#eef1f5;
    --s-ok:#047857;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;background:var(--s-bg);color:var(--s-ink);accent-color:#475569;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .suite-header{background:linear-gradient(180deg,var(--s-brand-ink),var(--s-brand));color:#fff;padding:12px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .suite-header .brand{font-size:17px;font-weight:700;letter-spacing:.2px}
  .suite-header .tagline{font-size:12.5px;opacity:.9}
  .excel-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:var(--s-panel);border-bottom:1px solid var(--s-line)}
  .excel-bar .lead{font-weight:700;font-size:13px;margin-right:2px}
  .excel-bar .lead .dot{color:var(--s-brand)}
  .excel-bar button{background:var(--s-brand);color:#fff;border:0;padding:8px 13px;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer}
  .excel-bar button.ghost{background:transparent;color:var(--s-brand);border:1px solid var(--s-brand)}
  .excel-bar button.sm{padding:6px 10px;font-size:12px}
  .excel-bar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--s-muted);cursor:pointer;user-select:none}
  .excel-bar .grow{flex:1}
  .excel-bar .name{font-size:12px;color:var(--s-muted)}
  .excel-bar .status{flex-basis:100%;font-size:12px;color:var(--s-muted);margin-top:2px}
  .suite-tabs{display:flex;gap:6px;padding:10px 16px 0;background:var(--s-bg);flex-wrap:wrap}
  .suite-tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--s-panel);border:1px solid var(--s-line);border-bottom:none;
    color:var(--s-ink);padding:8px 16px;border-radius:10px 10px 0 0;cursor:pointer;min-width:150px}
  .suite-tabs button .t-name{font-weight:700;font-size:13px}
  .suite-tabs button .t-sub{font-size:11px;color:var(--s-muted)}
  .suite-tabs button.active{background:var(--s-brand);border-color:var(--s-brand)}
  .suite-tabs button.active .t-name,.suite-tabs button.active .t-sub{color:#fff}
  .frames{position:relative;flex:1;background:var(--s-panel);border-top:1px solid var(--s-line)}
  .appframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
  .appframe.active{display:block}
</style>
</head>
<body>
<header class="suite-header">
  <div class="brand">Invoice Validation Suite</div>
  <div class="tagline">Guidehouse · Waystar · Ternium · Meduit — four validators, one shared Excel workbook</div>
</header>

<div class="excel-bar" id="excelBar">
  <span class="lead"><span class="dot">●</span> Shared Excel workbook</span>
  <button id="shellSyncLink">Link Excel workbook</button>
  <button id="shellSyncNow" class="ghost">Sync all now</button>
  <button id="shellLoadRules" class="ghost">Load rules from workbook</button>
  <button id="shellSyncUnlink" class="ghost sm">Unlink</button>
  <label><input type="checkbox" id="shellSyncAuto"> Auto-sync after each change</label>
  <span class="grow"></span>
  <span class="name" id="shellSyncName"></span>
  <div class="status" id="shellSyncStatus"></div>
</div>

<nav class="suite-tabs" id="suiteTabs">
    <button data-app="guidehouse" class="active"><span class="t-name">Guidehouse</span><span class="t-sub">Supplemental staffing rate validation</span></button>
    <button data-app="waystar"><span class="t-name">Waystar</span><span class="t-sub">Invoice reconciliation & cost savings</span></button>
    <button data-app="ternium"><span class="t-name">Ternium</span><span class="t-sub">RCM fee-rate validation (OCR)</span></button>
    <button data-app="meduit"><span class="t-name">Meduit</span><span class="t-sub">Postage & package rate audit</span></button>
</nav>

<div class="frames" id="frames"></div>

<template class="app-src" data-app="guidehouse">
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Rate Validation Tool</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --brand:#334155; --brand-ink:#1e293b; --brand-soft:#eef1f5;
    --ok:#047857; --ok-soft:#ecfdf5; --warn:#b45309; --warn-soft:#fffbeb;
    --err:#b91c1c; --err-soft:#fef2f2; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--brand)}
  header{background:linear-gradient(180deg,var(--brand-ink),var(--brand));color:#fff;padding:22px 20px}
  header .wrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:20px;letter-spacing:.2px}
  header p{margin:4px 0 0;opacity:.9;font-size:13px}
  .badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:999px;font-size:12px}
  main{max-width:1200px;margin:0 auto;padding:20px}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
  nav.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
  nav.tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  section.tab{display:none}
  section.tab.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  .card h2{margin:0 0 4px;font-size:16px}
  .card h2+.sub{color:var(--muted);margin:0 0 14px;font-size:13px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg)}
  .drop:hover,.drop.drag{border-color:var(--brand);background:var(--brand-soft)}
  .drop b{color:var(--brand)}
  button.btn{background:var(--brand);color:#fff;border:0;padding:10px 16px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
  button.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
  button.btn.sm{padding:6px 11px;font-size:12px}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  button.btn.danger{background:var(--err)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:6px 0 2px}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
  .kpi .n{font-size:24px;font-weight:700;line-height:1}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:5px;text-transform:uppercase;letter-spacing:.4px}
  .kpi.err .n{color:var(--err)} .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--ok)}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
  thead th{background:var(--bg);position:sticky;top:0;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);z-index:1}
  tbody tr:hover{background:var(--brand-soft)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .pill.err{background:var(--err-soft);color:var(--err)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .filterbar .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .filterbar .seg button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer;color:var(--ink);font-size:12px;font-weight:600}
  .filterbar .seg button:last-child{border-right:0}
  .filterbar .seg button.active{background:var(--brand);color:#fff}
  input.cell{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);padding:5px 6px;border-radius:6px;font:inherit;font-size:13px}
  input.cell:focus{outline:none;border-color:var(--brand);background:var(--panel)}
  .ref-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .muted{color:var(--muted)}
  .log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:150px;overflow:auto;white-space:pre-wrap;margin-top:12px;display:none}
  .log.show{display:block}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .grow{flex:1}
  code.k{background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:12px}
  details{margin-top:8px}
  summary{cursor:pointer;font-weight:600;color:var(--brand)}
  .footcell{font-weight:700}
  label.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
  .empty{padding:26px;text-align:center;color:var(--muted)}
  .del{color:var(--err);cursor:pointer;border:0;background:none;font-size:16px;line-height:1;padding:2px 6px}
  input,select,textarea{accent-color:#475569}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1>Invoice Rate Validation Tool</h1>
      <p>OCR / extract invoice line items → validate against the rate master &amp; crosswalk → export errors</p>
    </div>
    <span class="badge">Runs 100% in your browser · nothing is uploaded</span>
  </div>
</header>

<main>
  <nav class="tabs">
    <button data-tab="validate" class="active">1 · Validate</button>
    <button data-tab="errors">2 · Errors <span id="errCountTab"></span></button>
    <button data-tab="extracted">3 · Extracted Lines</button>
    <button data-tab="rules">4 · Reference Rules</button>
  </nav>

  <!-- VALIDATE ------------------------------------------------------------->
  <section class="tab active" id="tab-validate">
    <div class="card">
      <h2>Load an invoice</h2>
      <p class="sub">Drop a PDF invoice. Pages with a text layer are read directly; scanned pages fall back to OCR.</p>
      <div class="drop" id="drop">
        <div style="font-size:15px;margin-bottom:4px">📄 <b>Choose a PDF</b> or drag it here</div>
        <div class="muted" style="font-size:12px">Guidehouse-style supplemental staffing invoices</div>
        <input type="file" id="file" accept="application/pdf" hidden>
      </div>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="forceOcr"> Force OCR on every page (use for scanned / image-only PDFs — slower)</label>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="runBtn" disabled>Extract &amp; Validate</button>
        <button class="btn ghost" id="sampleBtn">Load sample invoice</button>
        <span class="grow"></span>
        <span class="muted" id="fileName"></span>
      </div>
      <div class="log" id="log"></div>
    </div>

    <div class="card" id="summaryCard" style="display:none">
      <h2>Validation summary</h2>
      <p class="sub" id="summarySub"></p>
      <div class="kpis">
        <div class="kpi"><div class="n" id="kLines">0</div><div class="l">Line items</div></div>
        <div class="kpi err"><div class="n" id="kErr">0</div><div class="l">Errors</div></div>
        <div class="kpi warn"><div class="n" id="kWarn">0</div><div class="l">Warnings / review</div></div>
        <div class="kpi ok"><div class="n" id="kOk">0</div><div class="l">Clean lines</div></div>
      </div>
      <div class="tablewrap" style="margin-top:14px">
        <table>
          <thead><tr><th>Check</th><th>Invoice</th><th class="num">Expected</th><th>Result</th></tr></thead>
          <tbody id="totalsBody"></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="gotoErrors">Review errors →</button>
        <button class="btn ghost" id="exportErr">⬇ Export errors CSV</button>
      </div>
    </div>
  </section>

  <!-- ERRORS --------------------------------------------------------------->
  <section class="tab" id="tab-errors">
    <div class="card">
      <div class="toolbar">
        <div>
          <h2 style="margin:0">Findings</h2>
          <p class="sub" style="margin:2px 0 0">Every rule violation, unmapped code, and manual-review flag.</p>
        </div>
        <span class="grow"></span>
        <button class="btn ghost sm" id="exportErr2">⬇ Export errors CSV</button>
      </div>
      <div class="filterbar">
        <div class="seg" id="sev">
          <button data-sev="all" class="active">All</button>
          <button data-sev="ERROR">Errors</button>
          <button data-sev="WARNING">Warnings</button>
        </div>
        <input id="search" class="cell" style="max-width:260px;border:1px solid var(--line)" placeholder="Filter by code or text…">
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th>Severity</th><th>Line</th><th>Invoice code</th><th>Check</th>
            <th>Field</th><th class="num">Expected</th><th class="num">Actual</th><th>Detail</th>
          </tr></thead>
          <tbody id="errBody"><tr><td colspan="8" class="empty">Run a validation to see findings.</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- EXTRACTED ------------------------------------------------------------>
  <section class="tab" id="tab-extracted">
    <div class="card">
      <div class="toolbar">
        <div><h2 style="margin:0">Extracted line items</h2>
        <p class="sub" style="margin:2px 0 0">What the parser read from the invoice, with the rule it resolved to.</p></div>
        <span class="grow"></span>
        <button class="btn ghost sm" id="exportLines">⬇ Export lines CSV</button>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th>#</th><th>Raw name</th><th>Code</th><th>Rate ID</th>
            <th class="num">Qty</th><th class="num">Inv. rate</th><th class="num">Exp. rate</th>
            <th class="num">Extended</th><th class="num">Recalc</th><th>Status</th>
          </tr></thead>
          <tbody id="linesBody"><tr><td colspan="10" class="empty">No data yet.</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- RULES ---------------------------------------------------------------->
  <section class="tab" id="tab-rules">
<div class="card">
      <h2>📊 Shared Excel workbook <span class="muted" style="font-weight:400;font-size:13px">(rules + validation log for your team)</span></h2>
      <p class="sub">These rate tables and every validation you run are written into one shared <code class="k">.xlsx</code> so your supervisor can open it and see what the team is working on. Link the workbook once — in Chrome/Edge it updates in place, other browsers download an updated copy.</p>
      <div class="row" style="margin-top:6px">
        <button class="btn" id="xsyncLinkBtn">Link Excel workbook</button>
        <button class="btn ghost sm" id="xsyncNowBtn">Sync now</button>
        <button class="btn ghost sm" id="xsyncUnlinkBtn">Unlink</button>
        <label class="chk" style="margin-left:4px"><input type="checkbox" id="xsyncAuto"> Auto-sync after each validation</label>
        <span class="grow"></span>
        <span class="muted" id="xsyncName"></span>
      </div>
      <div class="muted" id="xsyncStatus" style="margin-top:10px;font-size:12px"></div>
    </div>
    <div class="card">
      <h2>Table 1 — Rate Master <span class="muted" style="font-weight:400;font-size:13px">(source of truth for pricing)</span></h2>
      <p class="sub">Edit any cell. Rows drive the rate check. Use <code class="k">NA</code> where a shore rate doesn't exist. Saved to this browser.</p>
      <div class="tablewrap">
        <table id="rmTable">
          <thead><tr>
            <th>rate_id</th><th>category</th><th>specialty</th>
            <th class="num">onshore_rate</th><th class="num">offshore_rate</th>
            <th class="num">onshore_prod_hr</th><th class="num">offshore_prod_hr</th><th>uom</th><th></th>
          </tr></thead>
          <tbody id="rmBody"></tbody>
        </table>
      </div>
      <div class="ref-actions">
        <button class="btn sm" id="rmAdd">+ Add rate row</button>
        <button class="btn ghost sm" id="rmReset">Reset to defaults</button>
      </div>
    </div>

    <div class="card">
      <h2>Table 2 — Invoice Code Crosswalk <span class="muted" style="font-weight:400;font-size:13px">(invoice code → rate_id)</span></h2>
      <p class="sub">The parser strips the prefix before the month (e.g. <code class="k">SLP-PCP-Pr</code>) and looks it up here.
        <code class="k">expected_rate_source</code> picks which Rate Master column applies (<code class="k">offshore_rate</code>, <code class="k">onshore_rate</code>, or <code class="k">contract_exhibit</code>).</p>
      <div class="tablewrap">
        <table id="cwTable">
          <thead><tr>
            <th>invoice_code</th><th>description</th><th>rate_id</th>
            <th>expected_rate_source</th><th>notes</th><th></th>
          </tr></thead>
          <tbody id="cwBody"></tbody>
        </table>
      </div>
      <div class="ref-actions">
        <button class="btn sm" id="cwAdd">+ Add crosswalk row</button>
        <button class="btn ghost sm" id="cwReset">Reset to defaults</button>
      </div>
      <details>
        <summary>How off-schedule items are handled</summary>
        <p class="hint">Any crosswalk row whose <code class="k">rate_id</code> is <code class="k">OFF_SCHEDULE</code> (or whose
        <code class="k">expected_rate_source</code> is <code class="k">contract_exhibit</code>) is never auto-approved. It is always flagged
        for manual review and requires a contract citation, even when the billed rate looks correct.</p>
      </details>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

/* ---------------------------------------------------------------------------
   HELPERS
--------------------------------------------------------------------------- */
function load(key, def){ try{ const v=JSON.parse(localStorage.getItem(key)); return Array.isArray(v)&&v.length?v:JSON.parse(JSON.stringify(def)); }catch(e){ return JSON.parse(JSON.stringify(def)); } }
function save(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function $(s,el=document){ return el.querySelector(s); }
function $$(s,el=document){ return [...el.querySelectorAll(s)]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return n==null||isNaN(n)?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(n){ return n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* Robust amount parser: handles $, and BOTH "." and "," used as thousands sep,
   with the last 1–2 trailing digits treated as the decimal. */
function parseAmount(s){
  if(s==null) return NaN;
  s=String(s).replace(/[^0-9.,]/g,'');
  if(!s) return NaN;
  const lastSep=Math.max(s.lastIndexOf('.'),s.lastIndexOf(','));
  if(lastSep<0) return parseFloat(s);
  const after=s.slice(lastSep+1);
  if(after.length===1||after.length===2){
    const intpart=s.slice(0,lastSep).replace(/[.,]/g,'');
    return parseFloat((intpart||'0')+'.'+after);
  }
  return parseFloat(s.replace(/[.,]/g,''));
}

function logLine(msg){ const el=$('#log'); el.classList.add('show'); el.textContent+= msg+'\n'; el.scrollTop=el.scrollHeight; }

/* Pull the crosswalk key (code) out of a raw invoice line name */
function extractCode(name){
  let s=String(name||'').trim();
  s=s.replace(/\(.*?\)/g,' ').trim();                                   // drop (MCALL ED) etc.
  s=s.replace(new RegExp('-?\\s*(?:'+MONTHS+')\\.?\\s*\\d{2,4}\\s*$','i'),'').trim(); // drop "- May 2026"
  s=s.replace(new RegExp('-?\\s*(?:'+MONTHS+')\\s*$','i'),'').trim();    // trailing bare month
  s=s.replace(/[-–\s]+$/,'').trim();
  return s;
}
function lookupCrosswalk(code){
  const norm=code.trim().toUpperCase();
  let cw=crosswalk.find(c=>(c.invoice_code||'').trim().toUpperCase()===norm);
  if(cw) return cw;
  cw=crosswalk.find(c=>(c.invoice_code||'').trim().toUpperCase().replace(/\s*\(.*\)\s*/,'')===norm);
  return cw||null;
}
function lookupRate(rate_id){ return rateMaster.find(r=>(r.rate_id||'').trim().toUpperCase()===String(rate_id).trim().toUpperCase())||null; }

/* ---------------------------------------------------------------------------
   PDF / OCR EXTRACTION
--------------------------------------------------------------------------- */
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function extractFromPdf(file, forceOcr){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  logLine(`PDF loaded · ${pdf.numPages} page(s)`);
  let allRows=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    let rows=[];
    if(!forceOcr){ rows=await textRows(page); }
    if(forceOcr || rows.join('').replace(/\s/g,'').length<20){
      logLine(`Page ${p}: ${forceOcr?'OCR forced':'no text layer'} → running OCR…`);
      rows=await ocrRows(page,p);
    }else{
      logLine(`Page ${p}: read ${rows.length} text rows`);
    }
    allRows=allRows.concat(rows);
  }
  return allRows;
}

/* Reconstruct visual rows from the PDF text layer by clustering on Y */
async function textRows(page){
  const tc=await page.getTextContent();
  const items=tc.items.filter(i=>i.str && i.str.trim()!=='').map(i=>({x:i.transform[4],y:i.transform[5],s:i.str}));
  items.sort((a,b)=> b.y-a.y || a.x-b.x);
  const rows=[]; let cur=null;
  for(const it of items){
    if(!cur || Math.abs(cur.y-it.y)>4){ cur={y:it.y,parts:[]}; rows.push(cur); }
    cur.parts.push(it);
  }
  return rows.map(r=>r.parts.sort((a,b)=>a.x-b.x).map(p=>p.s).join(' ').replace(/\s+/g,' ').trim());
}

/* OCR a page → text lines */
async function ocrRows(page,pnum){
  const scale=2.2, vp=page.getViewport({scale});
  const canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height;
  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  const {data}=await Tesseract.recognize(canvas,'eng',{logger:m=>{ if(m.status==='recognizing text') logLine(`  OCR page ${pnum}: ${Math.round(m.progress*100)}%`); }});
  return data.text.split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
}

/* Turn reconstructed rows into structured line items + capture invoice total */
const LINE_RE=/^(.+?)\s+([\d.,]+)\s*(?:hours?|hrs?|units?)?\s+\$?\s*([\d.,]+)\s+\$?\s*([\d.,]+)\s*$/i;
const TOTAL_RE=/(amount\s+due|total\s+professional\s+fees)[^0-9$]*\$?\s*([\d.,]+)/i;

function parseRows(rows){
  const out=[]; let total=null;
  for(const raw of rows){
    const tm=raw.match(TOTAL_RE);
    if(tm){ const t=parseAmount(tm[2]); if(!isNaN(t)) total=t; continue; }
    if(/^(level|category|name|per\s+piece|invoice|guidehouse|bill to|purchase order|customer|payment|due date|project|contract|form id|page|st\.?\s+luke|re:|dear|sincerely|enclosed)/i.test(raw)) continue;
    const m=raw.match(LINE_RE);
    if(!m) continue;
    const name=m[1].trim();
    // must look like a billable line: a code-ish token or a "review" line
    if(!/[A-Za-z]{2,}[-–][A-Za-z0-9]|review|hospitalist/i.test(name)) continue;
    const qty=parseAmount(m[2]), rate=parseAmount(m[3]), ext=parseAmount(m[4]);
    if([qty,rate,ext].some(isNaN)) continue;
    out.push({name,qty,rate,ext});
  }
  return {lines:out,total};
}

/* ---------------------------------------------------------------------------
   VALIDATION ENGINE
--------------------------------------------------------------------------- */
function validate(rawLines, total){
  findings=[]; lines=[]; invoiceTotal=total;
  const TOL=0.005;
  rawLines.forEach((L,i)=>{
    const lineNo=i+1;
    const code=extractCode(L.name);
    const cw=lookupCrosswalk(code);
    const rec={ idx:lineNo, name:L.name, code, rate_id: cw?cw.rate_id:null,
                qty:L.qty, rate:L.rate, ext:L.ext, expRate:null, recalc:null, status:'ok' };

    function add(sev,check,field,expected,actual,detail){
      findings.push({lineNo,code,sev,check,field,expected,actual,detail});
      if(sev==='ERROR') rec.status='error';
      else if(rec.status!=='error') rec.status='warn';
    }

    // 1. Unknown code
    if(!cw){
      add('ERROR','Unmapped code','invoice_code','(in crosswalk)',code||L.name,'No crosswalk entry — cannot determine the correct rate. Add a mapping in Reference Rules.');
      rec.recalc=round2(L.qty*L.rate);
      lines.push(rec); return;
    }

    // 2. Off-schedule → always manual review
    const isOff = String(cw.rate_id).toUpperCase()==='OFF_SCHEDULE' || String(cw.expected_rate_source).toLowerCase()==='contract_exhibit';
    if(isOff){
      add('WARNING','Off-schedule item','rate','contract exhibit',money(L.rate),
          'Not in the rate master — requires a contract citation and manual approval. '+(cw.notes||''));
      rec.recalc=round2(L.qty*L.rate);
      // still check the line math
      if(Math.abs(rec.recalc-L.ext)>TOL)
        add('ERROR','Line math','extended',money(rec.recalc),money(L.ext),`Qty ${num(L.qty)} × rate ${money(L.rate)} = ${money(rec.recalc)}, invoice shows ${money(L.ext)}.`);
      lines.push(rec); return;
    }

    // 3. Resolve expected rate from the master via expected_rate_source
    const rm=lookupRate(cw.rate_id);
    if(!rm){
      add('ERROR','Rate lookup','rate_id',cw.rate_id,'(missing)',`Crosswalk points to rate_id ${cw.rate_id}, which is not in the Rate Master.`);
    } else {
      const src=(cw.expected_rate_source||'offshore_rate');
      const rawExp=rm[src];
      if(rawExp===undefined){
        add('ERROR','Rate source','expected_rate_source',src,'(no such column)',`Rate Master has no column "${src}".`);
      } else if(String(rawExp).trim().toUpperCase()==='NA'){
        add('WARNING','Rate source','rate',`${src} = NA`,money(L.rate),`Rate Master lists ${src} as NA for ${cw.rate_id} — no schedule rate to validate against.`);
      } else {
        const exp=parseAmount(rawExp); rec.expRate=exp;
        if(isNaN(exp)){
          add('WARNING','Rate source','rate',rawExp,money(L.rate),'Expected rate is not numeric in the Rate Master.');
        } else if(Math.abs(exp-L.rate)>TOL){
          add('ERROR','Rate mismatch','rate',money(exp),money(L.rate),`${code} → ${cw.rate_id} ${src} is ${money(exp)}, invoice billed ${money(L.rate)}.`);
        }
      }
    }

    // 4. Line math: qty × billed rate = extended
    rec.recalc=round2(L.qty*L.rate);
    if(Math.abs(rec.recalc-L.ext)>TOL){
      add('ERROR','Line math','extended',money(rec.recalc),money(L.ext),`Qty ${num(L.qty)} × rate ${money(L.rate)} = ${money(rec.recalc)}, invoice shows ${money(L.ext)}.`);
    }

    // 5. "Verify mapping" advisory notes
    if(/verify mapping/i.test(cw.notes||'')){
      add('WARNING','Mapping review','rate_id',cw.rate_id,cw.rate_id,cw.notes);
    }

    lines.push(rec);
  });

  // 6. Invoice total vs sum of lines
  const sum=round2(lines.reduce((a,l)=>a+(isNaN(l.ext)?0:l.ext),0));
  if(invoiceTotal!=null && !isNaN(invoiceTotal)){
    if(Math.abs(sum-invoiceTotal)>0.01){
      findings.push({lineNo:'—',code:'(total)',sev:'ERROR',check:'Invoice total',field:'total',
        expected:money(sum),actual:money(invoiceTotal),
        detail:`Sum of the ${lines.length} line extended amounts is ${money(sum)}, invoice total is ${money(invoiceTotal)}.`});
    }
  }
  return {sum};
}
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }

/* ---------------------------------------------------------------------------
   RENDERING
--------------------------------------------------------------------------- */
function runPipeline(rawLines,total){
  const {sum}=validate(rawLines,total);
  const errN=findings.filter(f=>f.sev==='ERROR').length;
  const warnN=findings.filter(f=>f.sev==='WARNING').length;
  const okN=lines.filter(l=>l.status==='ok').length;

  $('#summaryCard').style.display='block';
  $('#kLines').textContent=lines.length;
  $('#kErr').textContent=errN;
  $('#kWarn').textContent=warnN;
  $('#kOk').textContent=okN;
  $('#summarySub').textContent = errN? `${errN} error${errN>1?'s':''} need attention before this invoice can be approved.`
    : (warnN? `No hard errors, but ${warnN} item${warnN>1?'s':''} require manual review.` : 'All lines passed every rule. ✔');

  const tb=$('#totalsBody'); tb.innerHTML='';
  const totalOk = total!=null && Math.abs(sum-total)<=0.01;
  tb.innerHTML=`
    <tr><td>Sum of line extended amounts</td><td>${money(total)}</td><td class="num">${money(sum)}</td>
      <td>${total==null?'<span class="pill warn">no total found</span>':(totalOk?'<span class="pill ok">match</span>':'<span class="pill err">mismatch</span>')}</td></tr>
    <tr><td>Line items extracted</td><td>${lines.length}</td><td class="num">—</td><td><span class="pill ok">parsed</span></td></tr>`;

  $('#errCountTab').textContent = errN? `(${errN})` : '';
  renderErrors(); renderLines();
  $('#exportErr').disabled = $('#exportErr2').disabled = findings.length===0;
}

let errFilter='all', errSearch='';
function renderErrors(){
  const body=$('#errBody');
  let rows=findings.filter(f=> errFilter==='all'||f.sev===errFilter);
  if(errSearch){ const q=errSearch.toLowerCase(); rows=rows.filter(f=>(f.code+' '+f.check+' '+f.detail).toLowerCase().includes(q)); }
  if(!findings.length){ body.innerHTML='<tr><td colspan="8" class="empty">Run a validation to see findings.</td></tr>'; return; }
  if(!rows.length){ body.innerHTML='<tr><td colspan="8" class="empty">No findings match this filter. 🎉</td></tr>'; return; }
  body.innerHTML=rows.map(f=>`
    <tr>
      <td><span class="pill ${f.sev==='ERROR'?'err':'warn'}">${f.sev}</span></td>
      <td class="num">${f.lineNo}</td>
      <td><code class="k">${esc(f.code)}</code></td>
      <td>${esc(f.check)}</td>
      <td>${esc(f.field)}</td>
      <td class="num">${esc(f.expected)}</td>
      <td class="num">${esc(f.actual)}</td>
      <td style="min-width:280px">${esc(f.detail)}</td>
    </tr>`).join('');
}

function renderLines(){
  const body=$('#linesBody');
  if(!lines.length){ body.innerHTML='<tr><td colspan="10" class="empty">No data yet.</td></tr>'; return; }
  body.innerHTML=lines.map(l=>{
    const pill = l.status==='error'?'<span class="pill err">error</span>':l.status==='warn'?'<span class="pill warn">review</span>':'<span class="pill ok">ok</span>';
    const recBad = l.recalc!=null && !isNaN(l.ext) && Math.abs(l.recalc-l.ext)>0.005;
    return `<tr>
      <td class="num">${l.idx}</td>
      <td>${esc(l.name)}</td>
      <td><code class="k">${esc(l.code)}</code></td>
      <td>${esc(l.rate_id||'—')}</td>
      <td class="num">${num(l.qty)}</td>
      <td class="num">${money(l.rate)}</td>
      <td class="num">${l.expRate==null?'—':money(l.expRate)}</td>
      <td class="num">${money(l.ext)}</td>
      <td class="num" ${recBad?'style="color:var(--err);font-weight:700"':''}>${money(l.recalc)}</td>
      <td>${pill}</td>
    </tr>`;
  }).join('');
}

function toCsv(rows){
  return rows.map(r=>r.map(c=>{ const s=String(c==null?'':c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\r\n');
}
function download(name,text){
  const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportErrors(){
  const header=['severity','line','invoice_code','check','field','expected','actual','detail'];
  const rows=[header,...findings.map(f=>[f.sev,f.lineNo,f.code,f.check,f.field,f.expected,f.actual,f.detail])];
  download('invoice_validation_errors.csv',toCsv(rows));
}
function exportLines(){
  const header=['line','raw_name','code','rate_id','qty','invoice_rate','expected_rate','extended','recalculated','status'];
  const rows=[header,...lines.map(l=>[l.idx,l.name,l.code,l.rate_id||'',l.qty,l.rate,l.expRate==null?'':l.expRate,l.ext,l.recalc,l.status])];
  download('invoice_extracted_lines.csv',toCsv(rows));
}

function renderRefTable(bodyId,data,cols,onChange){
  const body=$('#'+bodyId); body.innerHTML='';
  data.forEach((row,ri)=>{
    const tr=document.createElement('tr');
    cols.forEach(col=>{
      const td=document.createElement('td');
      const inp=document.createElement('input'); inp.className='cell'; inp.value=row[col]??'';
      inp.addEventListener('input',()=>{ row[col]=inp.value; onChange(); });
      td.appendChild(inp); tr.appendChild(td);
    });
    const td=document.createElement('td');
    const del=document.createElement('button'); del.className='del'; del.title='Delete row'; del.textContent='✕';
    del.addEventListener('click',()=>{ data.splice(ri,1); onChange(); renderRefTable(bodyId,data,cols,onChange); });
    td.appendChild(del); tr.appendChild(td);
    body.appendChild(tr);
  });
}

/* ===== Excel bridge — delegates all workbook I/O to the combined-suite shell =====
   The shell (parent window) owns ONE shared .xlsx handle. This shim exposes the
   same ExcelSync interface the app already expects, but forwards link/sync to the
   parent and registers this app's log rows + rule sheets with the shell. */
const ExcelSync = (function(){
  function P(){ try{ return (window.parent && window.parent!==window && window.parent.RMSExcel) ? window.parent.RMSExcel : null; }catch(e){ return null; } }
  function el(id){ return document.getElementById(id); }
  function setStatus(msg){ var e=el('xsyncStatus'); if(e) e.textContent=msg; }
  function setName(txt){ var e=el('xsyncName'); if(e) e.textContent=txt; }
  function setAutoBox(v){ var e=el('xsyncAuto'); if(e) e.checked=!!v; }
  function setLinkLabel(txt){ var e=el('xsyncLinkBtn'); if(e) e.textContent=txt; }

  var API = {
    rulesProvider: null,   /* function(){ return [{name, aoa, cols}] } */
    rulesImporter: null,   /* function(sheetsByName){ ...; return changed } */
    _cfg: null,
    init: function(config){
      API._cfg = Object.assign({toolName:'Tool'}, config||{});
      var lb=el('xsyncLinkBtn');   if(lb) lb.addEventListener('click', function(){ var q=P(); if(q) q.link(); });
      var sb=el('xsyncNowBtn');    if(sb) sb.addEventListener('click', function(){ var q=P(); if(q) q.syncAll(); });
      var ub=el('xsyncUnlinkBtn'); if(ub) ub.addEventListener('click', function(){ var q=P(); if(q) q.unlink(); });
      var au=el('xsyncAuto');      if(au) au.addEventListener('change', function(){ var q=P(); if(q) q.setAuto(au.checked); });
      var p=P();
      if(p){
        p.register({
          toolName: API._cfg.toolName,
          getRows: API._cfg.getRows || function(){ return []; },
          getRulesSheets: function(){ return API.rulesProvider ? (API.rulesProvider()||[]) : []; },
          importRules: function(sheets){ return API.rulesImporter ? API.rulesImporter(sheets) : false; },
          ui: { status:setStatus, name:setName, auto:setAutoBox, linkLabel:setLinkLabel }
        });
      } else {
        setStatus('Open the combined suite file to enable shared-Excel sync.');
      }
    },
    autoSync: function(){ var q=P(); if(q) q.autoSync(); },
    sync:     function(){ var q=P(); if(q) q.syncAll(); },
    link:     function(){ var q=P(); if(q) q.link(); },
    unlink:   function(){ var q=P(); if(q) q.unlink(); },
    /* helpers shared by the per-app rule importers */
    findSheet: function(sheets, name){
      if(!sheets) return null;
      var nn=String(name).trim().toLowerCase();
      var keys=Object.keys(sheets);
      for(var i=0;i<keys.length;i++){ if(String(keys[i]).trim().toLowerCase()===nn) return sheets[keys[i]]; }
      return null;
    },
    rowsToObjs: function(aoa, cols){
      var out=[];
      if(!aoa || aoa.length<2) return out;
      for(var r=1;r<aoa.length;r++){
        var row=aoa[r]||[];
        if(row.every(function(c){ return c==null || String(c).trim()===''; })) continue;
        var o={};
        for(var c=0;c<cols.length;c++){ var v=row[c]; o[cols[c]] = (v==null?'':v); }
        out.push(o);
      }
      return out;
    }
  };
  return API;
})();
/* ===== Excel: input log + rules wiring (Guidehouse) ===== */
(function(){
  function ghStamp(){ var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  var GH_RUNS_KEY='rms.guidehouse.runs';
  var guidehouseRuns=[]; try{ guidehouseRuns=JSON.parse(localStorage.getItem(GH_RUNS_KEY)||'[]')||[]; }catch(e){ guidehouseRuns=[]; }
  function saveRuns(){ try{ localStorage.setItem(GH_RUNS_KEY, JSON.stringify(guidehouseRuns)); }catch(e){} }

  function recordGHRun(){
    try{
      var src=(document.getElementById('fileName')&&document.getElementById('fileName').textContent)||'invoice';
      var errN=findings.filter(function(f){return f.sev==='ERROR';}).length;
      var warnN=findings.filter(function(f){return f.sev==='WARNING';}).length;
      var status=errN?'FAIL':(warnN?'REVIEW':'PASS');
      var amt=lines.reduce(function(a,l){ return a+(isNaN(l.ext)?0:l.ext); },0);
      var issues=[]; if(errN)issues.push(errN+' error'+(errN>1?'s':'')); if(warnN)issues.push(warnN+' review');
      if(invoiceTotal!=null) issues.push('total '+money(invoiceTotal));
      var rec={ source:src, invno:'', date:'', amount:round2(amt), status:status,
                issues:issues.join('; ')||'all lines clean', uploaded:ghStamp() };
      guidehouseRuns=guidehouseRuns.filter(function(r){ return r.source!==src; });
      guidehouseRuns.push(rec);
      if(guidehouseRuns.length>500) guidehouseRuns=guidehouseRuns.slice(-500);
      saveRuns();
      ExcelSync.autoSync();
    }catch(e){ /* logging is best-effort */ }
  }
  /* wrap the pipeline so every validation run is logged */
  if(typeof runPipeline==='function'){
    var __rp=runPipeline;
    runPipeline=function(rawLines,total){ __rp(rawLines,total); recordGHRun(); };
  }

  ExcelSync.init({
    toolName:'Guidehouse',
    getRows:function(){ return guidehouseRuns.map(function(r){ return {
      'Tool':'Guidehouse',
      'File / Source':r.source||'',
      'Invoice #':r.invno||'',
      'Date':r.date||'',
      'Amount':r.amount,
      'Status':r.status,
      'Issues / Notes':r.issues||'',
      'Uploaded':r.uploaded||''
    }; }); }
  });

  ExcelSync.rulesProvider=function(){
    var rm=[RM_COLS].concat(rateMaster.map(function(r){ return RM_COLS.map(function(c){ return r[c]==null?'':r[c]; }); }));
    var cw=[CW_COLS].concat(crosswalk.map(function(r){ return CW_COLS.map(function(c){ return r[c]==null?'':r[c]; }); }));
    return [
      { name:'Guidehouse Rate Master', aoa:rm, cols:[{wch:10},{wch:18},{wch:26},{wch:14},{wch:14},{wch:16},{wch:16},{wch:10}] },
      { name:'Guidehouse Crosswalk', aoa:cw, cols:[{wch:24},{wch:40},{wch:12},{wch:20},{wch:44}] }
    ];
  };
  ExcelSync.rulesImporter=function(sheets){
    var changed=false;
    var rm=ExcelSync.findSheet(sheets,'Guidehouse Rate Master');
    if(rm && rm.length>1){ rateMaster=ExcelSync.rowsToObjs(rm,RM_COLS); save('rms.rateMaster',rateMaster); changed=true; }
    var cw=ExcelSync.findSheet(sheets,'Guidehouse Crosswalk');
    if(cw && cw.length>1){ crosswalk=ExcelSync.rowsToObjs(cw,CW_COLS); save('rms.crosswalk',crosswalk); changed=true; }
    if(changed){ if(typeof renderRateMaster==='function') renderRateMaster(); if(typeof renderCrosswalk==='function') renderCrosswalk(); }
    return changed;
  };
})();
</script>
</body>
</html>

</template>

          <thead><tr><th style="width:46%">Description</th><th class="num">Qty</th><th class="num">Unit Price</th><th class="num">Total</th><th></th></tr></thead>
          <tbody id="liBody"></tbody>
        </table>
        <button class="btn sec sm" id="addLineBtn" style="margin-top:8px">+ Add line</button>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px">
        <button class="btn" id="saveInvoiceBtn">Save invoice</button>
        <button class="btn sec" id="clearFormBtn">Clear</button>
      </div>
      <details class="rawpaste">
        <summary>Import / Export JSON (backup)</summary>
        <textarea id="jsonBox" style="width:100%;height:140px;font-family:ui-monospace,monospace;font-size:12px"></textarea>
        <div style="margin-top:8px;display:flex;gap:10px">
          <button class="btn sec sm" id="importJsonBtn">Import JSON</button>
          <button class="btn sec sm" id="dumpJsonBtn">Load current data</button>
        </div>
      </details>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Waystar Invoice Reconciliation — single-file app
   ============================================================ */
const LS_INV='waystar_invoices_v3', LS_RATES='waystar_rates_v3';
const TOL=0.02;          // $ tolerance for math checks
const RATE_TOL=0.0005;   // unit-price match tolerance

/* ---------- DEFAULT RATE TABLE (correct unit prices + match aliases) ----------
   price = the unit price the invoice "Price" column SHOULD show.
   Credit / "included" lines carry a negative price. ---------- */
const DEFAULT_PRICES=[
 {id:'PAPER_CLAIM',  label:'Paper Claims – Per Claim',                    group:'Paper Claims', type:'per_claim', price:0.719,
   match:'paper claim peak fee|paper professional claims peak filed previous month|paper institutional claims peak filed previous month|professional claims primary paper claim|professional claims non-primary paper claim|institutional claims primary paper claim|institutional claims non-primary paper claim'},
 {id:'PAPER_EOB',    label:'Paper Claims – EOB / Additional Page',        group:'Paper Claims', type:'per_page', price:0.319,
   match:'paper eob page peak fee|professional claims primary paper eob|professional claims non-primary paper eob|institutional claims primary paper eob|institutional claims non-primary paper eob|institutional eob primary|institutional eob non-primary|additional page'},
 {id:'CLM_MGMT',     label:'Monthly Professional Claims Peak Management Fee', group:'Core', type:'subscription', price:36000,
   match:'professional claims peak management|professional claims management'},
 {id:'ELIG',         label:'Monthly Eligibility System Access Fee',       group:'Core', type:'subscription', price:24000, match:'eligibility'},
 {id:'CLM_STATUS',   label:'Claims Monitoring Monthly Subscription Fee',  group:'Core', type:'subscription', price:24000, match:'claims monitoring|claim status'},
 {id:'COV_DET_SUB',  label:'Coverage Detection Subscription Fee',         group:'Core', type:'subscription', price:19000, match:'coverage detection subscription'},
 {id:'COV_DET_TXN',  label:'Coverage Detection Transaction Fee',          group:'Core', type:'per_txn', price:0.485, match:'coverage detection transaction'},
 {id:'COV_DET_INCL', label:'Coverage Detection Included Transactions',    group:'Core', type:'credit', price:-0.485, match:'coverage detection included'},
 {id:'ATTACH_SUB',   label:'Claims Attachments Monthly Subscription Fee', group:'Attachments', type:'subscription', price:350.55, match:'claims attachments monthly subscription|claims attachment monthly subscription|claims attachments subscription'},
 {id:'ATTACH_TXN',   label:'Claims Attachment Fee per Electronic Attachment', group:'Attachments', type:'per_txn', price:0.351, match:'fee per electronic claim attachment|claims attachment fee per electronic|claims attachment - fee per electronic|claims attachment'},
 {id:'ATTACH_INCL',  label:'Claims Attachments Included Transactions',    group:'Attachments', type:'credit', price:-0.351, match:'claims attachments included transactions|claims attachment included transactions'},
 {id:'ATTACH_PAPER_1ST', label:'Claims Attachments Paper – First Page Overage', group:'Attachments', type:'per_page', price:0.98, match:'overage (paper 1st page)|paper 1st page'},
 {id:'ATTACH_PAPER_ADD', label:'Claims Attachments Paper – Additional Page Overage', group:'Attachments', type:'per_page', price:0.39, match:'overage (paper >1 page)|paper >1 page'},
 {id:'FISS_SUB',     label:'Medicare FISS Emulator Subscription Fee',     group:'Medicare', type:'flat', price:500, match:'medicare fiss emulator subscription|fiss emulator subscription'},
 {id:'FISS_LICENSE', label:'Medicare FISS Emulator User Licenses',        group:'Medicare', type:'per_unit', price:50, match:'medicare fiss emulator user licenses|fiss emulator user licenses'},
 {id:'FISS_INCL',    label:'Medicare FISS Emulator Included User Licenses', group:'Medicare', type:'credit', price:-50, match:'medicare fiss emulator included user licenses|fiss emulator included|included user licenses'},
 {id:'MEDICARE_BUNDLE', label:'Medicare Enterprise Bundle',              group:'Medicare', type:'flat', price:14500, match:'medicare enterprise bundle'},
 {id:'REMIT_EXCESS', label:'Remittance Volume in Excess of Claims',       group:'Business Rule', type:'business_rule', price:0, match:'remittance volume in excess|remittance volume'},
];

/* ---------- Cost-savings comparison (current vs previous vendor) ----------
   pattern 'overage' : cost = monthlyFee + max(0, vol-tier)*overage
   pattern 'gross_credit' : cost = monthlyFee + vol*overage - min(vol,tier)*overage
   volumeFrom = price-id whose invoice qty is the transaction-volume driver (null = subscription-only). ---------- */
const DEFAULT_SAVINGS=[
 {id:'ELIG', label:'Eligibility', volumeFrom:null, pattern:'overage',
   current:{monthlyFee:24000,tier:480000,overage:0.06}, previous:{monthlyFee:40340.68,tier:400000,overage:0.107002651779484}},
 {id:'CLM_MGMT', label:'Claims Management', volumeFrom:null, pattern:'overage',
   current:{monthlyFee:36000,tier:720000,overage:0.06}, previous:{monthlyFee:44378.12,tier:450000,overage:0.10}},
 {id:'CLM_STATUS', label:'Claim Status / Claims Monitoring', volumeFrom:null, pattern:'overage',
   current:{monthlyFee:24000,tier:400000,overage:0.06}, previous:{monthlyFee:18000,tier:450000,overage:0.10}},
 {id:'COV_DET', label:'Coverage Detection', volumeFrom:'COV_DET_TXN', pattern:'gross_credit',
   current:{monthlyFee:19000,tier:40000,overage:0.485}, previous:{monthlyFee:10234.08,tier:8000,overage:1.3}},
 {id:'CLM_ATTACH', label:'Claims Attachments Electronic', volumeFrom:'ATTACH_TXN', pattern:'overage',
   current:{monthlyFee:350.55,tier:1000,overage:0.351}, previous:{monthlyFee:255,tier:1500,overage:0.17}},
];
const SAV_PRICE_IDS={ELIG:['ELIG'],CLM_MGMT:['CLM_MGMT'],CLM_STATUS:['CLM_STATUS'],
  COV_DET:['COV_DET_SUB','COV_DET_TXN','COV_DET_INCL'],CLM_ATTACH:['ATTACH_SUB','ATTACH_TXN','ATTACH_INCL']};

/* ---------- State ---------- */
let invoices=load(LS_INV,[])||[];
let rates=load(LS_RATES,null)||{};
function load(k,f){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;} }
function save(){ localStorage.setItem(LS_INV,JSON.stringify(invoices)); localStorage.setItem(LS_RATES,JSON.stringify(rates)); }
function getPrices(){ return rates.prices||DEFAULT_PRICES; }
function getSavings(){ return rates.savings||DEFAULT_SAVINGS; }
function priceById(id){ return getPrices().find(p=>p.id===id)||null; }

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const num=v=>{ if(v==null||v==='')return 0; let s=String(v).trim(); const neg=/^\(.*\)$/.test(s); const n=parseFloat(s.replace(/[$,()%]/g,'')); return isNaN(n)?0:(neg?-n:n); };
const money=n=>(n==null||n===''||isNaN(n))?'—':(n<0?'-$':'$')+Math.abs(Number(n)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const rateFmt=n=>{ if(n==null||n==='')return '—'; const a=Math.abs(n); const d=(a>0&&a<1)?4:2; return (n<0?'-$':'$')+a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:d}); };
const numFmt=n=>(n==null||n==='')?'—':Number(n).toLocaleString('en-US');
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function normMatch(s){ return String(s||'').replace(/^\s*\d{1,2}\/\d{1,2}\/\d{2,4}\s*-?\s*/,'').replace(/[^a-z0-9]+/gi,' ').replace(/\s+/g,' ').trim().toLowerCase(); }
function aliasList(p){ const a=(p.match||'').split('|').map(normMatch).filter(Boolean); const d=normMatch(p.label); if(d)a.push(d); return a; }
/* longest alias match wins (exact > endsWith > contains) */
function matchService(desc){
  const n=normMatch(desc); if(!n) return null; let best=null,score=0;
  for(const p of getPrices()) for(const k of aliasList(p)){
    let s=0; if(n===k)s=1000+k.length; else if(n.endsWith(k))s=500+k.length; else if(n.includes(k))s=k.length;
    if(s>score){score=s;best=p;}
  }
  return best;
}

/* ============================================================ VALIDATION
   per-line expected credit = (chargedUnit - correctUnit) * qty ============ */
function validate(inv){
  const res={status:'pass',lines:[],chargedTotal:0,correctTotal:0,totalCredit:0,reasons:[]};
  if(!inv.lineItems||!inv.lineItems.length){ res.status='pending'; res.reasons.push('No line items'); return res; }
  let anyFail=false,anyReview=false;
  inv.lineItems.forEach(it=>{
    const svc=matchService(it.description);
    const qty=num(it.qty), chargedUnit=num(it.price), charged=num(it.total);
    const L={desc:it.description,qty,chargedUnit,charged,serviceId:svc?svc.id:null,
             correctUnit:null,correctAmt:null,credit:0,status:'pass',errors:[]};

    if(svc && svc.type==='business_rule'){
      L.status='fail'; L.credit=charged;
      L.errors.push(`Flagged by business rule (Remittance Volume in Excess of Claims) — full $${money(charged).slice(1)} creditable; manual review`);
    } else if(!svc){
      L.status='review'; L.credit=charged;
      L.errors.push('No matching service in rate table — correct rate unavailable; manual review');
    } else {
      L.correctUnit=svc.price; L.correctAmt=r2(qty*svc.price);
      if(chargedUnit!==0 && Math.abs(chargedUnit-svc.price)>RATE_TOL){
        const diff=r2((chargedUnit-svc.price)*qty); L.credit=diff; L.status='fail';
        L.errors.push(`Rate mismatch: charged ${rateFmt(chargedUnit)}/unit vs correct ${rateFmt(svc.price)}/unit → ${diff>=0?'overcharge':'under-charge'} ${money(Math.abs(diff))}`);
      }
      if(qty!==0 && chargedUnit!==0 && charged!==0){
        const calc=r2(qty*chargedUnit);
        if(Math.abs(calc-charged)>TOL) { L.status='fail'; L.errors.push(`Math error: ${numFmt(qty)} × ${rateFmt(chargedUnit)} = ${money(calc)} ≠ billed ${money(charged)}`); }
      }
    }
    if(L.status==='fail')anyFail=true; if(L.status==='review')anyReview=true;
    res.chargedTotal+=charged; res.correctTotal+=(L.correctAmt==null?charged:L.correctAmt); res.totalCredit+=L.credit;
    res.lines.push(L);
  });
  res.chargedTotal=r2(res.chargedTotal); res.correctTotal=r2(res.correctTotal); res.totalCredit=r2(res.totalCredit);
  res.status=anyFail?'fail':(anyReview?'review':'pass');
  const nf=res.lines.filter(l=>l.status==='fail').length, nr=res.lines.filter(l=>l.status==='review').length;
  if(nf) res.reasons.push(`${nf} line${nf>1?'s':''} failed rate validation`);
  if(nr) res.reasons.push(`${nr} line${nr>1?'s':''} need review (uncontracted)`);
  if(Math.abs(res.totalCredit)>0.01) res.reasons.push(`Expected credit ${money(res.totalCredit)}`);
  return res;
}
function resultOf(inv){ if(!inv._res) inv._res=validate(inv); return inv._res; }
function invalidate(){ invoices.forEach(i=>delete i._res); }

/* ============================================================ COST SAVINGS */
function svcVolume(res, volumeFromId){
  if(!volumeFromId) return 0;
  return res.lines.filter(l=>l.serviceId===volumeFromId && l.qty>0).reduce((m,l)=>Math.max(m,l.qty),0);
}
function currentNetCost(res, savId){
  const ids=SAV_PRICE_IDS[savId]||[];
  return r2(res.lines.filter(l=>ids.includes(l.serviceId)).reduce((s,l)=>s+l.charged,0));
}
function prevExpected(sav, vol){
  const p=sav.previous;
  if(sav.pattern==='gross_credit') return r2(p.monthlyFee + vol*p.overage - Math.min(vol,p.tier)*p.overage);
  return r2(p.monthlyFee + Math.max(0,vol-p.tier)*p.overage);
}
function calcSavings(inv){
  const res=resultOf(inv), rows=[];
  getSavings().forEach(sav=>{
    const ids=SAV_PRICE_IDS[sav.id]||[];
    if(!res.lines.some(l=>ids.includes(l.serviceId))) return;
    const vol=svcVolume(res,sav.volumeFrom), curr=currentNetCost(res,sav.id), prev=prevExpected(sav,vol);
    rows.push({id:sav.id,label:sav.label,vol,hadOverage:vol>0,currCost:curr,prevCost:prev,savings:r2(prev-curr),
      prevMonthly:sav.previous.monthlyFee,prevTier:sav.previous.tier,prevOverage:sav.previous.overage,pattern:sav.pattern});
  });
  return rows;
}

/* ============================================================ FISCAL YEAR (Oct 1 – Sep 30) */
function fyOf(d){ if(!d)return null; const dt=new Date(d); const y=dt.getMonth()>=9?dt.getFullYear():dt.getFullYear()-1; return y; }
function fyLabel(y){ return `FY${y}-${String(y+1).slice(2)}`; }

/* ============================================================ RENDER */
let expanded={};
function render(){ invalidate(); renderStats(); renderFYBar(); renderInvoiceList(); populateSavSelect(); renderDashboard(); save(); }

function renderDashboard(){
  if(!$('#dashTiles')) return;
  let pass=0,fail=0,review=0,pend=0,credit=0,total=0;
  invoices.forEach(inv=>{ const r=resultOf(inv); credit+=r.totalCredit; total+=num(inv.amount);
    if(r.status==='pass')pass++; else if(r.status==='fail')fail++; else if(r.status==='review')review++; else pend++; });
  $('#dashTiles').innerHTML=`
    <div class="scard"><div class="l">Invoices uploaded</div><div class="v">${invoices.length}</div></div>
    <div class="scard green"><div class="l">Passing</div><div class="v">${pass}</div></div>
    <div class="scard red"><div class="l">Failing</div><div class="v">${fail}</div></div>
    <div class="scard amber"><div class="l">Needs review</div><div class="v">${review+pend}</div></div>
    <div class="scard"><div class="l">Total billed</div><div class="v">${money(total)}</div></div>
    <div class="scard amber"><div class="l">Expected credits</div><div class="v">${money(credit)}</div></div>`;
  const list=[...invoices].sort((a,b)=>String(b.uploadedAt||'').localeCompare(String(a.uploadedAt||'')) || (new Date(b.date||0)-new Date(a.date||0)));
  $('#dashActivity').innerHTML=list.map(inv=>{ const r=resultOf(inv);
    return `<tr>
      <td>${esc(inv.uploadedAt||'—')}</td>
      <td><b>${esc(inv.invno)}</b>${inv.sourceFile?`<div class="sub" style="color:var(--muted);font-size:11px">${esc(inv.sourceFile)}</div>`:''}</td>
      <td>${esc(inv.vendor)}</td>
      <td class="num">${money(num(inv.amount))}</td>
      <td><span class="pill ${r.status}">${r.status.toUpperCase()}</span></td>
      <td>${esc(r.reasons.join('; ')||'—')}</td></tr>`;
  }).join('');
  $('#dashEmpty').style.display=invoices.length?'none':'block';
}

function renderStats(){
  let pass=0,fail=0,review=0,pend=0,credit=0;
  invoices.forEach(inv=>{ const r=resultOf(inv); credit+=r.totalCredit;
    if(r.status==='pass')pass++; else if(r.status==='fail')fail++; else if(r.status==='review')review++; else pend++; });
  $('#stats').innerHTML=`
    <div class="stat"><div class="n">${invoices.length}</div><div class="l">Invoices</div></div>
    <div class="stat pass"><div class="n">${pass}</div><div class="l">Pass</div></div>
    <div class="stat fail"><div class="n">${fail}</div><div class="l">Fail</div></div>
    <div class="stat review"><div class="n">${review}</div><div class="l">Review</div></div>
    <div class="stat credit"><div class="n">${money(credit)}</div><div class="l">Credits</div></div>`;
}

function renderFYBar(){
  const sel=$('#fyFilter'); const fys=[...new Set(invoices.map(i=>fyOf(i.date)).filter(v=>v!=null))].sort((a,b)=>b-a);
  const cur=sel.value;
  sel.innerHTML='<option value="ALL">All fiscal years</option>'+fys.map(y=>`<option value="${y}">${fyLabel(y)}</option>`).join('');
  if(cur && [...sel.options].some(o=>o.value===cur)) sel.value=cur; else sel.value=fys.length?String(fys[0]):'ALL';
  const fy=sel.value==='ALL'?null:+sel.value;
  const list=fy==null?invoices:invoices.filter(i=>fyOf(i.date)===fy);
  const total=list.reduce((s,i)=>s+num(i.amount),0);
  const credit=list.reduce((s,i)=>s+resultOf(i).totalCredit,0);
  const passed=list.filter(i=>resultOf(i).status==='pass').length;
  $('#fyBar').innerHTML=`
    <div><span>Fiscal Year (Oct 1 – Sep 30)</span><b>${fy==null?'All':fyLabel(fy)}</b></div>
    <div><span>FY-to-date total cost</span><b>${money(total)}</b></div>
    <div><span>Invoices</span><b>${list.length}</b></div>
    <div><span>Pass rate</span><b>${list.length?Math.round(passed/list.length*100)+'%':'—'}</b></div>
    <div><span>Expected credits</span><b style="color:var(--review)">${money(credit)}</b></div>`;
}

function renderInvoiceList(){
  const q=($('#search').value||'').toLowerCase(), fs=$('#filterStatus').value;
  const fy=$('#fyFilter').value==='ALL'?null:+$('#fyFilter').value;
  const body=$('#invoiceBody'); body.innerHTML=''; let shown=0;
  [...invoices].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).forEach(inv=>{
    const r=resultOf(inv);
    if(fs && r.status!==fs) return;
    if(fy!=null && fyOf(inv.date)!==fy) return;
    if(q && !((inv.vendor+' '+inv.invno).toLowerCase().includes(q))) return;
    shown++;
    const reason=r.reasons.length?`<span class="reason ${r.status==='review'?'review':''}">${esc(r.reasons.join('; '))}</span>`:'<span style="color:var(--pass)">—</span>';
    const tr=document.createElement('tr');
    tr.className='main-row'+(expanded[inv.id]?' expanded':'');
    tr.innerHTML=`
      <td><span class="caret">▶</span></td>
      <td>${esc(inv.vendor)}</td>
      <td><b>${esc(inv.invno)}</b></td>
      <td>${esc(inv.date||'—')}</td>
      <td class="num">${money(num(inv.amount))}</td>
      <td><span class="pill ${r.status}">${r.status.toUpperCase()}</span></td>
      <td class="num ${r.totalCredit>0.005?'delta-pos':''}">${r.totalCredit?money(r.totalCredit):'—'}</td>
      <td>${reason}</td>
      <td><button class="x" title="Remove">✕</button></td>`;
    tr.addEventListener('click',e=>{ if(e.target.closest('.x'))return; expanded[inv.id]=!expanded[inv.id]; renderInvoiceList(); });
    tr.querySelector('.x').addEventListener('click',e=>{ e.stopPropagation();
      if(confirm('Remove invoice '+inv.invno+'?')){ invoices=invoices.filter(x=>x.id!==inv.id); render(); ExcelSync.autoSync(); toast('Removed '+inv.invno); } });
    body.appendChild(tr);
    if(expanded[inv.id]){ const dr=document.createElement('tr'); dr.innerHTML=`<td colspan="9" class="detail">${detailHtml(inv,r)}</td>`; body.appendChild(dr);
      const nb=dr.querySelector('.notes-box'); if(nb) nb.addEventListener('change',()=>{ inv.notes=nb.value; save(); });
      const xb=dr.querySelector('[data-exp]'); if(xb) xb.addEventListener('click',()=>exportInvoiceXlsx(inv)); }
  });
  $('#emptyList').style.display=shown?'none':'block';
}

function detailHtml(inv,r){
  const rows=r.lines.map(l=>{
    const cls=l.status==='fail'?'li-fail':(l.status==='review'?'li-review':'');
    const dcls=l.credit>0.005?'delta-pos':(l.credit<-0.005?'delta-neg':'');
    return `<tr class="${cls}">
      <td>${esc(l.desc)}</td>
      <td class="num">${numFmt(l.qty)}</td>
      <td class="num">${rateFmt(l.chargedUnit)}</td>
      <td class="num">${l.correctUnit==null?'—':rateFmt(l.correctUnit)}</td>
      <td class="num">${money(l.charged)}</td>
      <td class="num">${l.correctAmt==null?'—':money(l.correctAmt)}</td>
      <td class="num ${dcls}">${l.credit?((l.credit>0?'+':'')+money(l.credit)):'—'}</td>
      <td><span class="pill ${l.status}">${l.status.toUpperCase()}</span>${l.errors.length?'<div class="reason" style="margin-top:4px">'+l.errors.map(esc).join('<br>')+'</div>':''}</td>
    </tr>`;
  }).join('');
  return `<div class="inner">
    <div class="meta-grid">
      <div><span>Vendor</span><b>${esc(inv.vendor)}</b></div>
      <div><span>Invoice #</span><b>${esc(inv.invno)}</b></div>
      <div><span>Invoice Date</span><b>${esc(inv.date||'—')}</b></div>
      <div><span>Fiscal Year</span><b>${inv.date?fyLabel(fyOf(inv.date)):'—'}</b></div>
      <div><span>Invoice Amount</span><b>${money(num(inv.amount))}</b></div>
      <div><span>Result</span><b><span class="pill ${r.status}">${r.status.toUpperCase()}</span></b></div>
    </div>
    <div class="summary-bar">
      <div><span>Charged subtotal</span><b>${money(r.chargedTotal)}</b></div>
      <div><span>Calculated correct</span><b>${money(r.correctTotal)}</b></div>
      <div><span>Expected credit</span><b class="${r.totalCredit>0.005?'delta-pos':''}">${money(r.totalCredit)}</b></div>
      <div><span>Line items</span><b>${r.lines.length}</b></div>
    </div>
    <h4>Line items — charged vs. correct rate</h4>
    <table class="li">
      <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Charged Rate</th><th class="num">Correct Rate</th><th class="num">Charged Amt</th><th class="num">Correct Amt</th><th class="num">Expected Credit</th><th>Line Result</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;align-items:flex-end">
      <div style="flex:1;min-width:240px"><h4 style="margin-bottom:2px">Notes</h4><textarea class="notes-box" placeholder="Manual notes for this invoice…">${esc(inv.notes||'')}</textarea></div>
      <button class="btn green sm" data-exp="1">⬇ Export this invoice (xlsx)</button>
    </div>
  </div>`;
}

/* ============================================================ COST SAVINGS VIEW */
function populateSavSelect(){
  const sel=$('#savSelect'); if(!sel) return; const cur=sel.value;
  sel.innerHTML='<option value="">— Select an invoice for monthly detail —</option>'+
    [...invoices].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).map(i=>`<option value="${i.id}">${i.date||'—'} · ${esc(i.vendor)} · #${esc(i.invno)}</option>`).join('');
