      <span class="spacer"></span>
      <button class="btn" id="dash-clear">Clear history</button>
    </div>

    <div class="table-scroll">
      <table class="data">
        <thead>
          <tr>
            <th>Validated</th><th>File</th><th>Invoice #</th>
            <th class="num">Collected</th><th class="num">Fees billed</th>
            <th class="num">Fees expected</th><th class="num">Variance</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="dashActivity"></tbody>
      </table>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =====================================================================
   Ternium Invoice Validator
   The Ternium invoice PDF is a scan (no text layer). The transactional
   detail is a table in which each row is self-contained:

       DATE   $ COLLECTIONS   $ FEE   RATE%

   and the table ends with a totals row (the two money columns, no date and
   no rate). Rather than classify pages by header and zip separate column
   groups, we scan EVERY page for that row shape — so it does not matter
   whether a page carries a header or is a header-less continuation, and it
   is robust to the wide table being split across pages.

   Validation for this layout:
     1. Line math   — fee must equal round(collections × the line's rate).
     2. Rate audit  — flag any line whose rate ≠ the standard contract rate
                      (entered, or auto-detected as the most common rate).
     3. Cross-foot  — sum of collections / fees must tie to the totals row
                      and to the invoice-page total.
   Transaction-ID pages, if present, are zipped by row index only when their
   count matches the detail rows exactly (used for display).
   ===================================================================== */

const $ = id => document.getElementById(id);
const fmtUSD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const money = v => v == null ? '–' : fmtUSD.format(v);
const round2 = v => Math.round(v * 100) / 100;

const DATE_RE = /^\d{1,2}\/\d{1,2}\/\d{2,4}$/;

/* ---------- validation history (per this file's path) ---------- */
const LS_HIST = 'ternium_history_v1:' + ((typeof location !== 'undefined' && location.pathname) ? location.pathname : 'default');
let history = loadHistory();
function loadHistory(){ try{ const v = localStorage.getItem(LS_HIST); return v ? JSON.parse(v) : []; }catch(e){ return []; } }
function saveHistory(){ try{ localStorage.setItem(LS_HIST, JSON.stringify(history)); }catch(e){} }
function nowStamp(){ const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function statusChip(s){ const c = {PASS:'ok', FAIL:'bad', REVIEW:'warn'}[s] || 'warn'; return `<span class="chip ${c}">${s}</span>`; }

let state = null;
function freshState() {
  return {
    fileName: '', pages: [],
    txn: [], fees: [], tids: [], disch: [],
    totalsRow: null,
    invoice: { number: null, date: null, total: null },
    warnings: [], log: []
  };
}

/* ---------- token helpers ---------- */

function parseMoney(raw) {
  let t = raw.trim().replace(/^\$/, '');
  if (t === '-' || t === '–' || t === '—') return 0;
  if (/^\d{1,3}(,\d{3})*\.\d{2}$/.test(t) || /^\d+\.\d{2}$/.test(t)) {
    return round2(parseFloat(t.replace(/,/g, '')));
  }
  return null;
}

function parsePct(raw) {
  const m = raw.trim().match(/^(\d{1,2}(?:[.,]\d{1,2})?)%$/);
  return m ? parseFloat(m[1].replace(',', '.')) : null;
}

function parseDateMDY(s) {
  const m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) return null;
  let y = +m[3]; if (y < 100) y += 2000;
  const d = new Date(y, +m[1] - 1, +m[2]);
  return isNaN(d) ? null : d;
}

function fmtRate(v) { return v == null ? '–' : (Math.round(v * 100) / 100) + '%'; }

// Pull the money-valued tokens out of a row. A token OCR'd without its
// decimal point ("8,113.69" -> "811369") is recovered by re-inserting it
// before the last two digits and flagged so the fee math can validate it.
function collectMoneys(toks) {
  const out = [];
  for (const t of toks) {
    const v = parseMoney(t.text);
    if (v != null) { out.push({ v, recovered: false }); continue; }
    const digits = t.text.replace(/^\$/, '').replace(/,/g, '');
    if (/^\d{4,9}$/.test(digits)) out.push({ v: round2(parseInt(digits, 10) / 100), recovered: true });
  }
  return out;
}

// The rate is the trailing percent on the row; tolerate a dropped "%".
function readRate(toks) {
  for (let i = toks.length - 1; i >= 0; i--) {
    const p = parsePct(toks[i].text);
    if (p != null) return p;
  }
  const last = toks[toks.length - 1];
  if (last) {
    const m = last.text.match(/^(\d{1,2}(?:\.\d{1,2})?)$/);
    if (m) { const v = parseFloat(m[1]); if (v > 0 && v <= 100) return v; }
  }
  return null;
}

/* ---------- OCR words -> rows ---------- */

function wordsFromOcr(data) {
  const out = [];
  const push = w => { if (w && w.text && w.text.trim()) out.push({ text: w.text.trim(), bbox: w.bbox }); };
  if (Array.isArray(data.words) && data.words.length) { data.words.forEach(push); return out; }
  for (const b of data.blocks || [])
    for (const p of b.paragraphs || [])
      for (const l of p.lines || [])
        (l.words || []).forEach(push);
  return out;
}

// Cluster words into visual rows by vertical center, then sort each row by x.
function buildRows(words) {
  const ws = words.slice().sort((a, b) => (a.bbox.y0 + a.bbox.y1) - (b.bbox.y0 + b.bbox.y1));
  const rows = [];
  for (const w of ws) {
    const cy = (w.bbox.y0 + w.bbox.y1) / 2;
    const h = Math.max(6, w.bbox.y1 - w.bbox.y0);
    const last = rows[rows.length - 1];
    if (!last || Math.abs(cy - last.cy) > Math.max(9, h * 0.7)) {
      rows.push({ cy, words: [w] });
    } else {
      last.cy = (last.cy * last.words.length + cy) / (last.words.length + 1);
      last.words.push(w);
    }
  }
  rows.forEach(r => r.words.sort((a, b) => a.bbox.x0 - b.bbox.x0));
  return rows;
}

// Merge a lone "%" onto the preceding numeric token; drop empty tokens.
function rowTokens(row) {
  const toks = [];
  for (const w of row.words) {
    const t = w.text.trim();
    if (!t) continue;
    const prev = toks[toks.length - 1];
    if (t === '%' && prev && /\d$/.test(prev.text)) { prev.text += '%'; continue; }
    toks.push({ text: t, x0: w.bbox.x0, x1: w.bbox.x1 });
  }
  return toks;
}

/* ---------- detail-row extraction ---------- */

// True for a column-header row (words like DATE / COLLECTIONS / RATE) that
// carries no actual date value, so it must not be read as a transaction.
function looksLikeHeader(joined, toks) {
  return /\b(DATE|COLLECTION|FEE|RATE|CHARGES|BALANCE|PLACEMENT|INVOICE|AMOUNT|STATUS|CLIENT|PATIENT|ACCOUNT|ACCT|FIRST|LAST|IPLAN|DISCHARGE|MASTER|TRANSACTION)\b/i.test(joined)
    && !toks.some(t => DATE_RE.test(t.text));
}

// Scan one page for transaction rows (DATE $COLLECTIONS $FEE RATE%) and the
// trailing totals row. Runs on every page regardless of any header.
function parseDetailPage(pg) {
  for (const row of pg.rows) {
    const toks = rowTokens(row);
    if (!toks.length) continue;
    const joined = toks.map(t => t.text).join(' ');
    if (looksLikeHeader(joined, toks)) continue;

    const dateTok = toks.find(t => DATE_RE.test(t.text));
    const rate = readRate(toks);
    const moneys = collectMoneys(toks);

    // Totals row: two solid money columns, no date, no rate.
    if (!dateTok && rate == null && moneys.length >= 2) {
      const m = moneys.slice(-2);
      if (!m[0].recovered && !m[1].recovered && m[0].v > 100 && m[1].v > 100) {
        state.totalsRow = { collections: m[0].v, fee: m[1].v };
        state.log.push(`p${pg.num}: totals row -> collections ${money(m[0].v)}, fees ${money(m[1].v)}`);
      }
      continue;
    }

    // A transaction row needs a date and at least two money columns.
    if (!dateTok || moneys.length < 2) continue;

    // Pick the (collections, fee) pair that best satisfies fee = collections
    // × rate. This stays correct even if the row also carries extra money
    // columns (e.g. Total Charges / Balance). Fall back to the last two.
    let coll = null, fee = null, recovered = false;
    if (rate != null) {
      let best = null, bestErr = Infinity;
      for (let a = 0; a < moneys.length; a++)
        for (let c = a + 1; c < moneys.length; c++) {
          const err = Math.abs(moneys[c].v - moneys[a].v * rate / 100);
          if (err < bestErr) { bestErr = err; best = [a, c]; }
        }
      if (best && bestErr <= Math.max(0.02, moneys[best[1]].v * 0.005)) {
        coll = moneys[best[0]].v; fee = moneys[best[1]].v;
        recovered = moneys[best[0]].recovered || moneys[best[1]].recovered;
      }
    }
    if (coll == null) {
      const m2 = moneys.slice(-2);
      coll = m2[0].v; fee = m2[1].v; recovered = m2.some(x => x.recovered);
    }

    const rec = { page: pg.num, date: dateTok.text, collections: coll, fee, rate, recovered, parseIssue: rate == null };
    state.txn.push(rec);
    if (rate == null) state.warnings.push(`Page ${pg.num}: fee rate unreadable on line "${joined}"`);
    else if (recovered) state.warnings.push(`Page ${pg.num}: decimal point restored by OCR on line "${joined}" (validated against the fee math)`);
  }
}

// Transaction-ID pages list one ID per row; captured for display only.
function parseTidPage(pg) {
  for (const row of pg.rows) {
    const toks = rowTokens(row);
    if (toks.some(t => /TRANSACTION/i.test(t.text))) continue;
    if (toks.length === 1 && /^\d{3,8}$/.test(toks[0].text)) state.tids.push(toks[0].text);
  }
}

function parseInvoicePage(pg) {
  const txt = pg.rows.map(r => r.words.map(w => w.text).join(' ')).join('\n');
  let m = txt.match(/invoice no\D{0,4}(\d+)/i);
  if (m) state.invoice.number = m[1];
  m = txt.match(/invoice date\D{0,4}(\d{1,2}\/\d{1,2}\/\d{2,4})/i);
  if (m) state.invoice.date = m[1];
  let max = null;
  for (const r of pg.rows) for (const t of rowTokens(r)) {
    const v = parseMoney(t.text);
    if (v != null && (max == null || v > max)) max = v;
  }
  state.invoice.total = max;
  state.log.push(`p${pg.num}: invoice summary -> no. ${state.invoice.number ?? '?'}, date ${state.invoice.date ?? '?'}, total ${money(max)}`);
}

/* ---------- standard rate ---------- */

// The most frequently billed rate across the parsed lines.
function modalRate() {
  const counts = new Map();
  for (const t of state.txn) if (t.rate != null) counts.set(t.rate, (counts.get(t.rate) || 0) + 1);
  let best = null, bestN = -1;
  for (const [rate, nn] of counts) if (nn > bestN) { bestN = nn; best = rate; }
  return best;
}
function getStandardRate() {
  const auto = $('auto-rate') && $('auto-rate').checked;
  if (auto && state && state.txn.length) {
    const m = modalRate();
    if (m != null) return m;
  }
  const v = parseFloat($('std-rate').value);
  return isNaN(v) ? 0 : v;
}

/* ---------- engines ---------- */

let ocrWorkerPromise = null;
const progressRef = { page: 0, total: 1 };

async function setupPdfWorker() {
  const url = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  try {
    const src = await (await fetch(url)).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  } catch (e) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = url; // pdf.js falls back to a main-thread worker if this fails
  }
}

function getOcrWorker() {
  if (!ocrWorkerPromise) {
    ocrWorkerPromise = (async () => {
      const worker = await Tesseract.createWorker('eng', 1, {
        workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
        corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0',
        langPath: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int',
        logger: m => {
          if (m.status === 'recognizing text' && typeof m.progress === 'number') {
            setBar((progressRef.page - 1 + m.progress) / progressRef.total);
          }
        }
      });
      await worker.setParameters({ tessedit_pageseg_mode: '6' });
      return worker;
    })();
    ocrWorkerPromise.catch(() => { ocrWorkerPromise = null; });
  }
  return ocrWorkerPromise;
}

/* ---------- UI helpers ---------- */

function setStatus(t) { $('status-line').textContent = t; }
function setBar(f) { $('bar').style.width = Math.min(100, Math.max(0, f * 100)).toFixed(1) + '%'; }
function fatal(msg) {
  $('fatal').hidden = false;
  $('fatal').textContent = msg;
  setStatus('Failed.');
}

/* ---------- main pipeline ---------- */

async function processFile(file) {
  state = freshState();
  state.fileName = file.name;
  $('results').hidden = true;
  $('progress').hidden = false;
  $('fatal').hidden = true;
  $('page-log').textContent = '';
  setBar(0);

  try {
    if (typeof pdfjsLib === 'undefined' || typeof Tesseract === 'undefined') {
      throw new Error('Could not load the PDF/OCR libraries. This tool needs internet access on first use (CDN scripts). Check your connection and reload the page.');
    }
    setStatus('Loading PDF…');
    await setupPdfWorker();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

    setStatus('Loading OCR engine (first run downloads ~15 MB)…');
    const worker = await getOcrWorker();

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    progressRef.total = pdf.numPages;

    for (let p = 1; p <= pdf.numPages; p++) {
      progressRef.page = p;
      setStatus(`OCR page ${p} of ${pdf.numPages}…`);
      const page = await pdf.getPage(p);
      const v1 = page.getViewport({ scale: 1 });
      const scale = Math.min(4.5, Math.max(2, 2400 / v1.width));
      const vp = page.getViewport({ scale });
      canvas.width = Math.ceil(vp.width);
      canvas.height = Math.ceil(vp.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;

      const { data } = await worker.recognize(canvas, {}, { blocks: true, text: true });
      const words = wordsFromOcr(data);
      const rows = buildRows(words);
      const txt = rows.map(r => r.words.map(w => w.text).join(' ')).join('\n').toUpperCase();
      state.pages.push({ num: p, rows, txt });
      setBar(p / pdf.numPages);
    }

    setStatus('Analyzing…');
    analyze();
    renderResults();
    recordHistory();
    $('progress').hidden = true;
    $('results').hidden = false;
    $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    console.error(err);
    fatal('Error: ' + (err && err.message ? err.message : String(err)));
  }
}

function analyze() {
  for (const pg of state.pages) {
    const txt = pg.txt;
    const before = state.txn.length;
    parseDetailPage(pg);                       // date $ $ % rows + totals, on every page
    const got = state.txn.length - before;
    const isInvoice = /BILL TO|INVOICE DETAILS|INVOICE NO|DUE DATE/.test(txt);
    const isTid = /TRANSACTION ID|TRANSACTIONID/.test(txt);
    if (isInvoice) parseInvoicePage(pg);
    if (isTid && !got) parseTidPage(pg);        // ID column pages carry no detail rows
    pg.type = got ? `detail (${got} rows)` : isInvoice ? 'invoice' : isTid ? 'txn-ids' : 'other';
    state.log.push(`p${pg.num}: ${pg.type}`);
  }
  state.log.push(`parsed: ${state.txn.length} transactions` +
    `, ${state.tids.length} transaction IDs` +
    (state.totalsRow ? ', totals row found' : ', no totals row'));
}

/* ---------- results ---------- */

let lastComputed = [];

function computeRows() {
  const std = getStandardRate();
  const n = state.txn.length;
  const tidsAligned = state.tids.length === n && n > 0;

  const out = [];
  for (let i = 0; i < n; i++) {
    const t = state.txn[i];
    const rate = t.rate;
    const mathExpected = (t.collections != null && rate != null) ? round2(t.collections * rate / 100) : null;
    const stdFee = (t.collections != null && std != null) ? round2(t.collections * std / 100) : null;
    const premium = (t.fee != null && stdFee != null) ? round2(t.fee - stdFee) : null;

    let status = 'ok', note = '';
    if (t.parseIssue || rate == null || t.fee == null || t.collections == null) {
      status = 'unreadable';
      note = 'row not fully readable — verify manually';
    } else if (Math.abs(t.fee - mathExpected) > 0.02) {
      status = 'math';
      const impliedColl = rate ? round2(t.fee / (rate / 100)) : null;
      note = `fee ≠ collections × ${fmtRate(rate)} (math says ${money(mathExpected)}); billed fee implies collections of ${money(impliedColl)} — likely an OCR digit misread, verify this line in the PDF`;
    } else if (Math.abs(rate - std) > 0.005) {
      status = 'rate';
      note = `billed at ${fmtRate(rate)} vs standard ${fmtRate(std)} — ${premium >= 0 ? money(premium) + ' above' : money(-premium) + ' below'} the standard-rate fee; verify this rate is authorized`;
    } else if (t.recovered) {
      note = 'decimal point restored by OCR — validated by the fee math';
    }

    out.push({
      idx: i + 1,
      tid: tidsAligned ? state.tids[i] : null,
      date: t.date,
      collections: t.collections,
      stated: rate,          // rate billed on the line
      standard: std,
      invoiceAmt: t.fee,     // fee billed
      expAmt: stdFee,        // fee at the standard rate
      mathExpected,
      delta: premium,        // billed fee − standard-rate fee
      status, note
    });
  }
  return { rows: out, tidsAligned, standardRate: std };
}

function renderResults() {
  if (!state || !state.txn.length) {
    $('banner').className = 'banner warn';
    $('banner').innerHTML = '<span class="big">No transactional detail found.</span> This does not look like a Ternium collections invoice with a “DATE / COLLECTIONS / FEE / RATE” detail table. See the parse log below.';
    $('results').hidden = false;
    $('log-pre').textContent = (state ? state.log.concat(state.warnings) : []).join('\n') || '(empty)';
    return;
  }

  const { rows, tidsAligned, standardRate } = computeRows();
  lastComputed = rows;

  const sum = (arr, f) => arr.reduce((a, r) => a + (f(r) ?? 0), 0);
  const totalCollected = round2(sum(rows, r => r.collections));
  const totalBilled = round2(sum(rows, r => r.invoiceAmt));
  const rowsWithStd = rows.filter(r => r.expAmt != null && r.invoiceAmt != null);
  const totalStd = round2(sum(rowsWithStd, r => r.expAmt));
  const premium = round2(sum(rowsWithStd, r => r.invoiceAmt) - totalStd);

  const mathErrors = rows.filter(r => r.status === 'math');
  const rateFlags = rows.filter(r => r.status === 'rate');
  const unreadable = rows.filter(r => r.status === 'unreadable');
  const readable = rows.length - unreadable.length;

  // Banner
  const b = $('banner');
  if (mathErrors.length) {
    b.className = 'banner bad';
    b.innerHTML = `<span class="big">✕ ${mathErrors.length} line${mathErrors.length === 1 ? '' : 's'} where fee ≠ collections × rate.</span> These are arithmetic / OCR mismatches — verify the highlighted rows against the PDF.${rateFlags.length ? ` Also ${rateFlags.length} line(s) billed off the standard ${fmtRate(standardRate)} rate.` : ''}${unreadable.length ? ` ${unreadable.length} row(s) unreadable.` : ''}`;
  } else if (rateFlags.length) {
    b.className = 'banner warn';
    const dir = premium > 0 ? `<b>${money(premium)}</b> above` : premium < 0 ? `<b>${money(-premium)}</b> below` : 'even with';
    b.innerHTML = `<span class="big">! ${rateFlags.length} line${rateFlags.length === 1 ? '' : 's'} billed at a non-standard rate.</span> Every line's math checks out, but these are billed off the standard ${fmtRate(standardRate)} rate — ${dir} the standard-rate fee overall. Verify they were authorized.${unreadable.length ? ` ${unreadable.length} row(s) unreadable.` : ''}`;
  } else {
    b.className = 'banner ok';
    b.innerHTML = `<span class="big">✓ All ${readable} readable line(s) validate.</span> Every fee equals collections × its printed rate, all at the standard ${fmtRate(standardRate)} rate.${unreadable.length ? ` ${unreadable.length} row(s) could not be fully read — verify those manually.` : ''}`;
  }

  // Tiles
  $('t-collected').textContent = money(totalCollected);
  $('t-collected-sub').textContent = `${rows.length} transactions` + (state.totalsRow ? ` · totals row: ${money(state.totalsRow.collections)}` : '');
  $('t-billed').textContent = money(totalBilled);
  $('t-billed-sub').textContent = state.invoice.total != null ? `invoice page total: ${money(state.invoice.total)}` : (state.totalsRow ? `totals row: ${money(state.totalsRow.fee)}` : '');
  $('t-expected').textContent = money(totalStd);
  const varEl = $('t-expected-sub');
  if (premium > 0.005) varEl.innerHTML = `at ${fmtRate(standardRate)} · <span class="delta-bad">+${money(premium)} over standard</span>`;
  else if (premium < -0.005) varEl.innerHTML = `at ${fmtRate(standardRate)} · <span class="delta-good">${money(premium)} under standard</span>`;
  else varEl.textContent = `at ${fmtRate(standardRate)} · matches billed`;
  $('t-errors').textContent = String(mathErrors.length + rateFlags.length);
  $('t-errors-sub').textContent = mathErrors.length
    ? `${mathErrors.length} math · ${rateFlags.length} off-rate`
    : (rateFlags.length ? `${rateFlags.length} off-rate line(s)` : 'all lines clean');

  // Reconciliation
  const recon = [];
  const check = (ok, what, detail) => recon.push(
    `<li><span class="mark ${ok === true ? 'ok' : ok === false ? 'bad' : 'warn'}">${ok === true ? '✓' : ok === false ? '✕' : '!'}</span><span><b>${what}</b> <span class="what">${detail}</span></span></li>`
  );

  check(mathErrors.length === 0, 'Line math',
    mathErrors.length === 0
      ? 'every readable line: fee = collections × its printed rate'
      : `${mathErrors.length} line(s) where fee ≠ collections × rate`);

  check(rateFlags.length === 0 ? true : null, 'Rate audit',
    rateFlags.length === 0
      ? `all lines billed at the standard ${fmtRate(standardRate)} rate`
      : `${rateFlags.length} line(s) off the standard ${fmtRate(standardRate)} rate (net ${premium >= 0 ? '+' : ''}${money(premium)})`);

  if (state.totalsRow) {
    const collOk = Math.abs(totalCollected - state.totalsRow.collections) <= 0.02;
    const feeOk = Math.abs(totalBilled - state.totalsRow.fee) <= 0.02;
    check(collOk, 'Collections cross-foot', `sum of rows ${money(totalCollected)} vs totals row ${money(state.totalsRow.collections)}`);
    check(feeOk, 'Fee cross-foot', `sum of rows ${money(totalBilled)} vs totals row ${money(state.totalsRow.fee)}`);
  } else {
    check(null, 'Totals row', 'not found — cross-foot check skipped');
  }
  if (state.invoice.total != null) {
    check(Math.abs(totalBilled - state.invoice.total) <= 0.02,
      'Invoice total', `page-1 total ${money(state.invoice.total)} vs detail fee sum ${money(totalBilled)}`);
  }
  if (state.tids.length) {
    check(tidsAligned ? true : null, 'Transaction IDs',
      `${state.tids.length} IDs${tidsAligned ? ' — aligned with the ' + rows.length + ' rows' : ' (count ≠ ' + rows.length + ' rows — IDs not shown)'}`);
  }
  if (state.invoice.number) recon.push(`<li><span class="mark ok">·</span><span><b>Invoice</b> <span class="what">no. ${state.invoice.number}${state.invoice.date ? ' · dated ' + state.invoice.date : ''} · file: ${escHtml(state.fileName)}</span></span></li>`);
  $('recon').innerHTML = recon.join('');

  renderTable();
  $('log-pre').textContent = state.log.concat(state.warnings.map(w => 'WARN: ' + w)).join('\n') || '(empty)';
}

const CHIP = {
  ok:        '<span class="chip ok">✓ OK</span>',
  math:      '<span class="chip math">✕ Math error</span>',
  rate:      '<span class="chip warn">! Off-rate</span>',
  unreadable:'<span class="chip warn">! Unreadable</span>'
};

function renderTable() {
  const issuesOnly = $('issues-only').checked;
  const html = [];
  for (const r of lastComputed) {
    if (issuesOnly && r.status === 'ok') continue;
    const cls = r.status === 'math' ? 'row-bad' : (r.status === 'ok' ? '' : 'row-warn');
    const deltaTxt = r.delta == null ? '–'
      : (Math.abs(r.delta) <= 0.005 ? '$0.00'
        : `<span class="${r.delta > 0 ? 'delta-bad' : 'delta-good'}">${r.delta > 0 ? '+' : ''}${fmtUSD.format(r.delta)}</span>`);
    html.push(`<tr class="${cls}">
      <td class="num">${r.idx}</td>
      <td>${r.tid ?? '–'}</td>
      <td>${r.date ?? '–'}</td>
      <td class="num">${money(r.collections)}</td>
      <td class="num">${fmtRate(r.stated)}</td>
      <td class="num">${money(r.invoiceAmt)}</td>
      <td class="num">${money(r.expAmt)}</td>
      <td class="num">${deltaTxt}</td>
      <td title="${(r.note || '').replace(/"/g, '&quot;')}">${CHIP[r.status]}${r.note ? ' <span style="color:var(--muted)">ⓘ</span>' : ''}</td>
    </tr>`);
  }
  $('tbody').innerHTML = html.join('') ||
    '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:18px">No rows to show</td></tr>';
}

/* ---------- CSV ---------- */

function downloadCsv() {
  const head = ['#','transaction_id','date','collections','rate_billed_pct','fee_billed','fee_at_standard','delta_vs_standard','status','note'];
  const esc = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [head.join(',')];
  for (const r of lastComputed) {
    lines.push([r.idx, r.tid, r.date, r.collections, r.stated, r.invoiceAmt, r.expAmt, r.delta, r.status, r.note].map(esc).join(','));
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.fileName.replace(/\.pdf$/i, '') || 'invoice') + '_validation.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- dashboard & history ---------- */

function recordHistory(){
  if (!state || !state.txn || !state.txn.length || !lastComputed.length) return;
  const sum = f => lastComputed.reduce((a, r) => a + (f(r) ?? 0), 0);
  const collected = round2(sum(r => r.collections));
  const billed = round2(sum(r => r.invoiceAmt));
  const withExp = lastComputed.filter(r => r.expAmt != null && r.invoiceAmt != null);
  const expected = round2(withExp.reduce((a, r) => a + r.expAmt, 0));
  const variance = round2(withExp.reduce((a, r) => a + r.invoiceAmt, 0) - expected);
  const mathErrors = lastComputed.filter(r => r.status === 'math').length;
  const rateFlags = lastComputed.filter(r => r.status === 'rate').length;
  const unreadable = lastComputed.filter(r => r.status === 'unreadable').length;
  const status = mathErrors ? 'FAIL' : ((rateFlags || unreadable) ? 'REVIEW' : 'PASS');
  const notes = [];
  if (mathErrors) notes.push(mathErrors + ' math');
  if (rateFlags) notes.push(rateFlags + ' off-rate');
  if (unreadable) notes.push(unreadable + ' unreadable');
  if (Math.abs(variance) > 0.005) notes.push((variance > 0 ? '+' : '') + money(variance) + (variance > 0 ? ' over' : ' under'));
  const rec = {
    when: nowStamp(), file: state.fileName || '',
    invoice: (state.invoice && state.invoice.number) || '',
    date: (state.invoice && state.invoice.date) || '',
    collected, billed, expected, variance, status,
    notes: notes.join('; ') || 'clean'
  };
  history.unshift(rec);
  if (history.length > 500) history.length = 500;
  saveHistory();
  renderDashboard();
  ExcelSync.autoSync();
}

function renderDashboard(){
  if (!$('dashTiles')) return;
  const n = history.length;
  const pass = history.filter(h => h.status === 'PASS').length;
  const fail = history.filter(h => h.status === 'FAIL').length;
  const review = history.filter(h => h.status === 'REVIEW').length;
  const collected = round2(history.reduce((a, h) => a + (h.collected || 0), 0));
  const variance = round2(history.reduce((a, h) => a + (h.variance || 0), 0));
  $('dashTiles').innerHTML = `
    <div class="tile hero"><div class="label">Invoices validated</div><div class="value">${n}</div></div>
    <div class="tile"><div class="label">Passing</div><div class="value" style="color:var(--good-text)">${pass}</div></div>
    <div class="tile"><div class="label">Failing</div><div class="value" style="color:var(--critical)">${fail}</div></div>
    <div class="tile"><div class="label">Needs review</div><div class="value" style="color:var(--warning)">${review}</div></div>
    <div class="tile"><div class="label">Total collected (logged)</div><div class="value">${money(collected)}</div></div>
    <div class="tile"><div class="label">Net fee variance</div><div class="value" style="color:${variance > 0.005 ? 'var(--critical)' : 'var(--good-text)'}">${money(variance)}</div></div>`;
  const rows = history.map(h => `<tr>
    <td>${escHtml(h.when || '—')}</td>
    <td>${escHtml(h.file || '—')}</td>
    <td>${escHtml(h.invoice || '—')}</td>
    <td class="num">${money(h.collected)}</td>
    <td class="num">${money(h.billed)}</td>
    <td class="num">${money(h.expected)}</td>
    <td class="num">${h.variance ? money(h.variance) : '$0.00'}</td>
    <td>${statusChip(h.status)}</td></tr>`).join('');
  $('dashActivity').innerHTML = rows ||
    '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:18px">No invoices validated yet — drop a PDF on the Validator tab.</td></tr>';
}

function switchView(v){
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
  if (v === 'dashboard') renderDashboard();
}

/* ---------- wiring ---------- */

document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
$('dash-clear').addEventListener('click', () => {
  if (confirm('Clear the local validation history on this machine? (This does not change any Excel file.)')) {
    history = []; saveHistory(); renderDashboard(); ExcelSync.autoSync();
  }
});

const drop = $('drop');
const fileInput = $('file-input');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('hover');
  const f = [...e.dataTransfer.files].find(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (f) processFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) processFile(fileInput.files[0]); fileInput.value = ''; });

$('issues-only').addEventListener('change', renderTable);
$('btn-csv').addEventListener('click', downloadCsv);
$('btn-again').addEventListener('click', () => { $('results').hidden = true; fileInput.click(); });
['std-rate','auto-rate'].forEach(id =>
  $(id).addEventListener('change', () => { if (state && state.txn.length) renderResults(); }));

/* ============================================================ EXCEL SYNC
   Link a shared .xlsx (File System Access API) and mirror the validation
   history into an "Upload Log" sheet so a supervisor can open the workbook
   and see which files came in and their status. Writes in place on
   Chrome/Edge; downloads an updated copy everywhere else. Rows from other
   validator tools sharing the same workbook are preserved. */
/* ===== Excel bridge — delegates all workbook I/O to the combined-suite shell =====
   The shell (parent window) owns ONE shared .xlsx handle. This shim exposes the
   same ExcelSync interface the app already expects, but forwards link/sync to the
   parent and registers this app's log rows + rule sheets with the shell. */
const ExcelSync = (function(){
  function P(){ try{ return (window.parent && window.parent!==window && window.parent.RMSExcel) ? window.parent.RMSExcel : null; }catch(e){ return null; } }
  function el(id){ return document.getElementById(id); }
  function setStatus(msg){ var e=el('xsyncStatus'); if(e) e.textContent=msg; }
  function setName(txt){ var e=el('xsyncName'); if(e) e.textContent=txt; }
  function setAutoBox(v){ var e=el('xsyncAuto'); if(e) e.checked=!!v; }
  function setLinkLabel(txt){ var e=el('xsyncLinkBtn'); if(e) e.textContent=txt; }

  var API = {
    rulesProvider: null,   /* function(){ return [{name, aoa, cols}] } */
    rulesImporter: null,   /* function(sheetsByName){ ...; return changed } */
    _cfg: null,
    init: function(config){
      API._cfg = Object.assign({toolName:'Tool'}, config||{});
      var lb=el('xsyncLinkBtn');   if(lb) lb.addEventListener('click', function(){ var q=P(); if(q) q.link(); });
      var sb=el('xsyncNowBtn');    if(sb) sb.addEventListener('click', function(){ var q=P(); if(q) q.syncAll(); });
      var ub=el('xsyncUnlinkBtn'); if(ub) ub.addEventListener('click', function(){ var q=P(); if(q) q.unlink(); });
      var au=el('xsyncAuto');      if(au) au.addEventListener('change', function(){ var q=P(); if(q) q.setAuto(au.checked); });
      var p=P();
      if(p){
        p.register({
          toolName: API._cfg.toolName,
          getRows: API._cfg.getRows || function(){ return []; },
          getRulesSheets: function(){ return API.rulesProvider ? (API.rulesProvider()||[]) : []; },
          importRules: function(sheets){ return API.rulesImporter ? API.rulesImporter(sheets) : false; },
          ui: { status:setStatus, name:setName, auto:setAutoBox, linkLabel:setLinkLabel }
        });
      } else {
        setStatus('Open the combined suite file to enable shared-Excel sync.');
      }
    },
    autoSync: function(){ var q=P(); if(q) q.autoSync(); },
    sync:     function(){ var q=P(); if(q) q.syncAll(); },
    link:     function(){ var q=P(); if(q) q.link(); },
    unlink:   function(){ var q=P(); if(q) q.unlink(); },
    /* helpers shared by the per-app rule importers */
    findSheet: function(sheets, name){
      if(!sheets) return null;
      var nn=String(name).trim().toLowerCase();
      var keys=Object.keys(sheets);
      for(var i=0;i<keys.length;i++){ if(String(keys[i]).trim().toLowerCase()===nn) return sheets[keys[i]]; }
      return null;
    },
    rowsToObjs: function(aoa, cols){
      var out=[];
      if(!aoa || aoa.length<2) return out;
      for(var r=1;r<aoa.length;r++){
        var row=aoa[r]||[];
        if(row.every(function(c){ return c==null || String(c).trim()===''; })) continue;
        var o={};
        for(var c=0;c<cols.length;c++){ var v=row[c]; o[cols[c]] = (v==null?'':v); }
        out.push(o);
      }
      return out;
    }
  };
  return API;
})();

ExcelSync.init({
  toolName: 'Ternium Validator',
  defaultFileName: 'Invoice_Tracking_Log.xlsx',
  getRows: function(){ return (history || []).map(function(h){ return {
    'Tool': 'Ternium Validator',
    'File / Source': h.file || '',
    'Invoice #': h.invoice || '',
    'Date': h.date || '',
    'Amount': h.collected,
    'Status': h.status,
    'Issues / Notes': h.notes || '',
    'Uploaded': h.when || ''
  }; }); }
});
renderDashboard();

/* ===== Rules <-> Excel wiring (Ternium fee schedule) ===== */
(function(){
  ExcelSync.rulesProvider = function(){
    var el=$('std-rate'), au=$('auto-rate');
    var aoa=[['Setting','Value'],
             ['Standard contract rate %', el?Number(el.value):null],
             ['Auto-detect standard rate', au?(au.checked?'Yes':'No'):'']];
    return [ { name:'Ternium Fee Schedule', aoa:aoa, cols:[{wch:26},{wch:12}] } ];
  };
  ExcelSync.rulesImporter = function(sheets){
    var fs=ExcelSync.findSheet(sheets,'Ternium Fee Schedule');
    if(!fs || fs.length<2) return false;
    var changed=false;
    for(var i=1;i<fs.length;i++){
      var row=fs[i]; if(!row) continue;
      var key=String(row[0]||'').toLowerCase();
      if(key.indexOf('standard contract rate')>=0){
        var v=Number(row[1]), el=$('std-rate');
        if(el && !isNaN(v)){ el.value=v; changed=true; }
      } else if(key.indexOf('auto-detect')>=0){
        var au=$('auto-rate');
        if(au){ var s=String(row[1]||'').trim().toLowerCase(); au.checked=(s==='yes'||s==='true'||s==='1'); changed=true; }
      }
    }
    if(changed && typeof state!=='undefined' && state && state.txn && state.txn.length && typeof renderResults==='function') renderResults();
    return changed;
  };
})();
</script>
</body>
</html>

</template>

<template class="app-src" data-app="meduit">
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meduit Invoice Audit &amp; Rate Validation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#ffffff; --ink:#1e293b; --muted:#64748b;
    --line:#e2e8f0; --brand:#475569; --brand-d:#334155;
    --pass:#16a34a; --pass-bg:#dcfce7; --fail:#dc2626; --fail-bg:#fee2e2;
    --review:#d97706; --review-bg:#fef3c7; --pend:#64748b; --pend-bg:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#f1f5f9;color:var(--ink);font-size:14px}
  header{background:var(--bg);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header .logo{font-size:20px;font-weight:700;letter-spacing:.3px}
  header .logo span{color:#cbd5e1}
  header .sub{color:#94a3b8;font-size:12px}
  .spacer{flex:1}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 12px;text-align:center;min-width:78px}
  .stat .n{font-size:18px;font-weight:700;line-height:1}
  .stat .l{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
  .stat.pass .n{color:#4ade80}.stat.fail .n{color:#f87171}.stat.review .n{color:#fbbf24}

  nav{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:4px;position:sticky;top:0;z-index:20}
  nav button{background:none;border:none;padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);
              cursor:pointer;border-bottom:3px solid transparent}
  nav button.active{color:var(--brand);border-bottom-color:var(--brand)}
  nav button:hover{color:var(--ink)}

  main{padding:24px;max-width:1280px;margin:0 auto}
  .view{display:none}.view.active{display:block}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .grow{flex:1}
  input[type=text],input[type=number],input[type=date],select,textarea{
    border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(71,85,105,.18)}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:7px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--brand-d)}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sec:hover{background:#f8fafc}
  .btn.danger{background:#fff;color:var(--fail);border:1px solid #fecaca}
  .btn.danger:hover{background:var(--fail-bg)}
  .btn.sm{padding:5px 9px;font-size:12px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  tbody tr.main-row:hover{background:#f8fafc;cursor:pointer}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .pill.pass{background:var(--pass-bg);color:var(--pass)}
  .pill.fail{background:var(--fail-bg);color:var(--fail)}
  .pill.review{background:var(--review-bg);color:var(--review)}
  .pill.pending{background:var(--pend-bg);color:var(--pend)}
  .pill.dup{background:#ede9fe;color:#7c3aed;margin-left:6px}
  .reason{color:var(--fail);font-size:12px}
  .reason.review{color:var(--review)}
  .x{color:var(--fail);font-weight:700;cursor:pointer;border:1px solid #fecaca;border-radius:6px;padding:2px 8px;background:#fff;font-size:13px}
  .x:hover{background:var(--fail-bg)}
  .caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
  tr.expanded .caret{transform:rotate(90deg)}

  .detail{background:#f8fafc;padding:0}
  .detail .inner{padding:18px 22px}
  .detail h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;margin-bottom:16px}
  .meta-grid div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .meta-grid div b{font-size:13px}
  table.li th,table.li td{padding:7px 10px;font-size:12px}
  tr.li-fail{background:var(--fail-bg)}
  tr.li-review{background:var(--review-bg)}
  .delta-pos{color:var(--fail);font-weight:700}
  .delta-neg{color:var(--pass);font-weight:700}
  .summary-bar{display:flex;gap:24px;flex-wrap:wrap;margin:6px 0 16px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:8px}
  .summary-bar div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
  .summary-bar div b{font-size:16px}

  .empty{padding:48px;text-align:center;color:var(--muted)}
  .batch{margin-bottom:20px}
  .batch .bh{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#f1f5f9;border:1px solid var(--line);border-radius:10px 10px 0 0}
  .batch .bh h3{margin:0;font-size:15px}
  .batch .bh .tot{margin-left:auto;display:flex;gap:18px}
  .batch .bh .tot span{font-size:12px;color:var(--muted)}
  .batch .bh .tot b{font-size:14px}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
  .li-editor table{margin-top:8px}
  .li-editor input{width:100%}
  .note{font-size:12px;color:var(--muted);background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;margin-bottom:14px}
  .matrix-help{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;
         padding:12px 20px;border-radius:8px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  details.rawpaste{margin-top:8px}
  details.rawpaste summary{cursor:pointer;font-size:13px;color:var(--brand);font-weight:600}
  .drop{border:2px dashed var(--brand);border-radius:10px;padding:20px;text-align:center;color:var(--brand);background:#eef1f5;cursor:pointer;margin:6px 0}
  .drop:hover,.drop.over{background:#e2e6ec}
  .scards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .scard{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-left:4px solid var(--brand)}
  .scard .l{font-size:11px;color:var(--muted);text-transform:uppercase}
  .scard .v{font-size:20px;font-weight:700;margin-top:4px}
  .scard.green{border-left-color:var(--pass)}.scard.green .v{color:var(--pass)}
  .scard.red{border-left-color:var(--fail)}.scard.red .v{color:var(--fail)}
  .scard.amber{border-left-color:var(--review)}.scard.amber .v{color:var(--review)}
  input,select,textarea{accent-color:#475569}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">med<span>uit</span> &nbsp;Invoice Audit</div>
    <div class="sub">Rate &amp; package validation against the Meduit Rate Matrix</div>
  </div>
  <div class="spacer"></div>
  <div class="hdr-sync" style="display:flex;align-items:center;gap:8px;margin-right:14px">
    <button class="btn" id="headerSyncBtn" title="Re-open your saved folder and OCR any new invoice files">🔄 Sync</button>
    <span id="headerSyncName" class="sub" style="color:var(--muted);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
  </div>
  <div class="stats" id="stats"></div>
</header>

<nav>
  <button data-view="invoices" class="active">Invoice List</button>
  <button data-view="batches">Batches</button>
  <button data-view="add">Add / Import</button>
  <button data-view="matrix">Rate Matrix</button>
  <button data-view="dashboard">Dashboard</button>
</nav>

<main>
  <!-- ================= DASHBOARD ================= -->
  <section class="view" id="view-dashboard">
    <div class="scards" id="dashTiles"></div>

    <div class="card" style="padding:18px;margin-bottom:16px">
      <h3 style="margin-top:0">📊 Sync to Excel <span class="sub" style="color:var(--muted);font-weight:400">— so your supervisor can see uploads &amp; status</span></h3>
      <p class="sub" style="color:var(--muted);margin-top:0">Link a shared Excel workbook once. Every upload writes/updates a row in an <b>Upload Log</b> sheet so your supervisor can open the file and see which invoices came in and how they validated. In Chrome/Edge the file is updated <b>in place</b>; other browsers download an updated copy to drop into your shared folder. All three validators can safely share one workbook.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn" id="xsyncLinkBtn">Link Excel workbook</button>
        <button class="btn sec" id="xsyncNowBtn">Sync now</button>
        <button class="btn sec sm" id="xsyncUnlinkBtn">Unlink</button>
        <label class="sub" style="display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer"><input type="checkbox" id="xsyncAuto"> Auto-sync after each upload</label>
        <div class="grow"></div>
        <span id="xsyncName" class="sub" style="color:var(--muted)"></span>
      </div>
      <div id="xsyncStatus" class="sub" style="color:var(--muted);margin-top:10px"></div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Uploaded</th><th>Invoice #</th><th>Service Type</th><th class="num">Amount</th><th>Status</th><th>Issues / Reasons</th></tr></thead>
        <tbody id="dashActivity"></tbody>
      </table>
      <div class="empty" id="dashEmpty" style="display:none">No invoices yet. Use <b>Add / Import</b> to upload invoices — they'll appear here and sync to Excel.</div>
    </div>
  </section>

  <!-- ================= INVOICE LIST ================= -->
  <section class="view active" id="view-invoices">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search vendor, invoice #, service type…" style="min-width:280px">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="fail">Fail only</option>
        <option value="pass">Pass only</option>
        <option value="review">Review only</option>
        <option value="pending">Pending data</option>
        <option value="dup">Duplicates</option>
      </select>
      <div class="grow"></div>
      <button class="btn sec sm" id="removeDupsBtn">Remove all duplicates</button>
      <button class="btn sec" id="exportListBtn">Export list (CSV)</button>
    </div>
    <div class="card">
      <table id="invoiceTable">
        <thead>
          <tr>
            <th style="width:28px"></th>
            <th>Vendor</th>
            <th>Invoice #</th>
            <th>Service Type</th>
            <th class="num">Invoice Amount</th>
            <th>Result</th>
            <th>Fail Reason(s)</th>
            <th style="width:40px"></th>
          </tr>
        </thead>
        <tbody id="invoiceBody"></tbody>
      </table>
      <div class="empty" id="emptyList" style="display:none">No invoices loaded yet. Use <b>Add / Import</b> to load invoices.</div>
    </div>
  </section>

  <!-- ================= BATCHES ================= -->
  <section class="view" id="view-batches">
    <div class="toolbar">
      <div class="sub" style="color:var(--muted)">Invoices grouped by <b>service month</b> (derived from line-item dates). Export a batch with full line-item error detail (charged vs. calculated correct rate).</div>
      <div class="grow"></div>
      <button class="btn sec" id="exportAllBatchesBtn">Export all batches (CSV)</button>
    </div>
    <div id="batchContainer"></div>
  </section>

  <!-- ================= ADD / IMPORT ================= -->
  <section class="view" id="view-add">
    <div class="note">Data is saved in your browser (localStorage) so the historic list persists across reloads.</div>

    <div class="card" style="padding:18px;margin-bottom:16px">
      <h3 style="margin-top:0">Upload invoice PDFs</h3>
      <p class="sub" style="color:var(--muted);margin-top:0">Select one or more Meduit invoice PDFs or images. Text-based PDFs are read directly; <b>scanned/image-only PDFs and image files are read via OCR</b> (slower, needs internet — verify the numbers in the expanded row). Each file reports a status/error code below.</p>
      <div class="drop" id="pdfDrop">📄 Drop invoice PDFs/images here, or click to choose &nbsp;<span class="sub" style="color:#334155">(most reliable — bypasses cloud-placeholder folder sync)</span></div>
      <input type="file" id="pdfInput" accept="application/pdf,image/*" multiple style="display:none">
      <span id="pdfStatus" class="sub" style="color:var(--muted);margin-left:8px"></span>

      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <h3 style="margin:0 0 6px">Sync a folder (auto-OCR)</h3>
        <p class="sub" style="color:var(--muted);margin-top:0">Pick a folder once; clicking <b>Sync</b> re-opens that saved folder and OCRs any <b>new</b> invoice files in it (PDF / JPG / PNG…). Already-processed files are skipped. Chrome &amp; Edge only.</p>
        <button class="btn" id="syncFolderBtn">🔄 Sync folder</button>
        <button class="btn sec sm" id="chooseFolderBtn">Choose folder…</button>
        <button class="btn sec sm" id="forgetSyncBtn" title="Re-process every file in the folder on the next sync">Reset sync history</button>
        <span id="syncFolderName" class="sub" style="color:var(--muted);margin-left:8px"></span>
        <div id="syncStatus" class="sub" style="color:var(--muted);margin-top:8px"></div>
      </div>

      <div id="pdfDiag" style="display:none;margin-top:14px"></div>
    </div>

    <div class="card" style="padding:18px">
      <h3 style="margin-top:0">Add invoice</h3>
      <div class="form-grid">
        <label>Vendor<input type="text" id="f_vendor" value="Meduit Health Services"></label>
        <label>Invoice #<input type="text" id="f_invno" placeholder="13751"></label>
        <label>Invoice date<input type="date" id="f_invdate"></label>
        <label>Due date<input type="date" id="f_duedate"></label>
        <label>Customer ID<input type="text" id="f_custid" value="SLHS06"></label>
        <label>Customer PO<input type="text" id="f_po" placeholder="SC 10419"></label>
        <label>Service type
          <select id="f_service">
            <option value="">(auto-detect from lines)</option>
          </select>
        </label>
        <label>Sales tax<input type="number" step="0.01" id="f_tax" value="0"></label>
      </div>

      <div class="li-editor">
        <h4 style="margin:18px 0 0;color:var(--muted)">Line items</h4>
        <table>
          <thead><tr><th style="width:45%">Description</th><th class="num">Quantity</th><th class="num">Unit Price (charged)</th><th class="num">Amount (charged)</th><th></th></tr></thead>
          <tbody id="liBody"></tbody>
        </table>
        <button class="btn sec sm" id="addLineBtn" style="margin-top:8px">+ Add line</button>
      </div>

      <div style="margin-top:18px;display:flex;gap:10px">
        <button class="btn" id="saveInvoiceBtn">Save invoice</button>
        <button class="btn sec" id="clearFormBtn">Clear</button>
      </div>

      <details class="rawpaste">
        <summary>Import / Export JSON (bulk)</summary>
        <p class="sub" style="color:var(--muted)">Paste an array of invoice objects, or copy current data to back it up.</p>
        <textarea id="jsonBox" style="width:100%;height:160px;font-family:ui-monospace,monospace;font-size:12px"></textarea>
        <div style="margin-top:8px;display:flex;gap:10px">
          <button class="btn sec sm" id="importJsonBtn">Import JSON</button>
          <button class="btn sec sm" id="dumpJsonBtn">Load current data into box</button>
        </div>
      </details>
    </div>
  </section>

  <!-- ================= RATE MATRIX ================= -->
  <section class="view" id="view-matrix">
    <div class="matrix-help">
      <b>Rate Master</b> — the source of truth from Attachment A of the BSA Supplemental Agreement (St. Luke's Health System × Meduit / RMP), effective 9/26/2022.
      This table is fully editable and persists in your browser; <b>expected amount = quantity × Contract Rate</b>. Each billed line is mapped to a <code>Rate_ID</code> via the
      <b>Match aliases</b> column (pipe-separated; the SKU description is always matched too). Leading dates/month prefixes on invoice lines are stripped before matching.
      <br>Engine applies the contract's own rules: <b>R001</b> rate variance &gt;5% · <b>R002</b> uncontracted line · <b>R004</b> math error · <b>R005</b> postage vs $0.491/pc · <b>R011</b> effective-date · <b>R012</b> inactive rate.
    </div>
    <div class="toolbar">
      <input type="text" id="matrixSearch" placeholder="Search Rate_ID, category, description, alias…" style="min-width:300px">
      <button class="btn sec sm" id="addRateBtn">+ Add SKU</button>
      <div class="grow"></div>
      <button class="btn sec sm" id="resetMatrixBtn">Reset to contract defaults</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Rate_ID</th><th>Category</th><th>Description</th><th>UoM</th><th class="num">Contract Rate</th><th>Match aliases (invoice wording)</th><th>Effective</th><th>Active</th><th></th></tr></thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>

    <h3 style="margin:26px 0 8px">Validation Rules</h3>
    <div class="card">
      <table>
        <thead><tr><th>Rule</th><th>Name</th><th>Logic</th><th>Severity</th><th>Action</th></tr></thead>
        <tbody id="vrBody"></tbody>
      </table>
    </div>

    <h3 style="margin:26px 0 8px">Package Composition <span class="sub" style="color:var(--muted);font-weight:400">— component build-up of each mailing package (pre-postage; add $0.491/pc postage)</span></h3>
    <div class="card">
      <table>
        <thead><tr><th>Package</th><th>Rate_ID</th><th>Component</th><th class="num">Component Rate</th><th class="num">Package Total</th></tr></thead>
        <tbody id="pcBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Meduit Invoice Audit — single-file app
   ============================================================ */
/* Every local file shares the same file:// origin, so all copies of this page share one
   localStorage. Namespacing the keys by this file's own path lets each copy keep its own
   invoices and rate matrix instead of clobbering the others. */
const MED_NS = (typeof location !== 'undefined' && location.pathname) ? location.pathname : 'default';
const LS_INV = 'meduit_invoices_v2:' + MED_NS;
const LS_MTX = 'meduit_matrix_v2:' + MED_NS;   // v2: full Rate_Master schema
const RATE_VARIANCE_PCT = 0.05;      // R001: >5% rate variance is a Critical exception
const POSTAGE_BASELINE  = 0.491;     // R005: USPS presort first-class baseline

/* ---------- Default rate matrix = Meduit Rate Master (Attachment A, BSA Supplemental Agreement, eff. 9/26/2022).
   Editable in the Rate Matrix tab. `match` = pipe-separated invoice-line aliases used to map a billed line to this SKU. ---------- */
const DEFAULT_MATRIX = [
  {id:"PKG-A-EXPRESSO", cat:"Package A", sub:"Print + Mail", desc:"Expresso File Processing", uom:"Per Piece", rate:0.015, tmin:80000, tmax:100000, eff:"2022-09-26", active:"Yes", match:"", notes:"Component of Package A total $0.1115 (pre-postage)"},
  {id:"PKG-A-ENV-DBL", cat:"Package A", sub:"Print + Mail", desc:"#10 Double Window envelope + imaging + folding/inserting + presort/mailing", uom:"Per Piece", rate:0.065, tmin:80000, tmax:100000, eff:"2022-09-26", active:"Yes", match:"", notes:"Component of Package A total $0.1115 (pre-postage)"},
  {id:"PKG-A-REMIT9", cat:"Package A", sub:"Print + Mail", desc:"#9 remit envelope", uom:"Per Piece", rate:0.019, tmin:80000, tmax:100000, eff:"2022-09-26", active:"Yes", match:"", notes:"Component of Package A total $0.1115 (pre-postage)"},
  {id:"PKG-A-DUPLEX1", cat:"Package A", sub:"Print + Mail", desc:"Duplex 1st page", uom:"Per Piece", rate:0.0125, tmin:80000, tmax:100000, eff:"2022-09-26", active:"Yes", match:"", notes:"Component of Package A total $0.1115 (pre-postage)"},
  {id:"PKG-A-POSTAGE", cat:"Package A", sub:"Postage", desc:"Postage \u2014 Presort First-Class", uom:"Per Piece", rate:0.491, tmin:80000, tmax:100000, eff:"2022-07-10", active:"Yes", match:"mailed - domestic|mailed - foreign|mailed domestic|mailed foreign|mailed|postage", notes:"USPS rate; subject to change via USPS notice"},
  {id:"PKG-B-EXPRESSO", cat:"Package B", sub:"Print + Mail", desc:"Expresso File Processing", uom:"Per Piece", rate:0.015, tmin:80000, tmax:100000, eff:"2022-09-26", active:"Yes", match:"", notes:"Component of Package B total $0.0925 (pre-postage)"},
  {id:"PKG-B-ENV-DBL", cat:"Package B", sub:"Print + Mail", desc:"#10 DBL envelope + imaging + folding/inserting + presort/mailing", uom:"Per Piece", rate:0.065, tmin:80000, tmax:100000, eff:"2022-09-26", active:"Yes", match:"base package fees|base package fee", notes:"Component of Package B total $0.0925 (pre-postage)"},
  {id:"PKG-B-DUPLEX1", cat:"Package B", sub:"Print + Mail", desc:"Duplex 1st page", uom:"Per Piece", rate:0.0125, tmin:80000, tmax:100000, eff:"2022-09-26", active:"Yes", match:"", notes:"Component of Package B total $0.0925 (pre-postage)"},
  {id:"PKG-B-POSTAGE", cat:"Package B", sub:"Postage", desc:"Postage \u2014 Presort First-Class", uom:"Per Piece", rate:0.491, tmin:80000, tmax:100000, eff:"2022-07-10", active:"Yes", match:"", notes:"USPS rate; subject to change via USPS notice"},
  {id:"PKG-C-EXPRESSO", cat:"Package C", sub:"Print + Mail", desc:"Expresso File Processing (Includes NCOA, CASS/DPV)", uom:"Per Piece", rate:0.035, tmin:80000, tmax:100000, eff:"2022-09-26", active:"Yes", match:"expresso processing fees|expresso file processing fees|processing fees", notes:"SLHS supplies #10 and #9 envelopes"},

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
const money = n => (n==null||isNaN(n))?'—':'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const rateFmt = n => n==null?'—':Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:5});
const r2 = n => Math.round((Number(n)+Number.EPSILON)*100)/100;
const centsOff = (a,b) => Math.round(Math.abs(Number(a)-Number(b))*100);  // whole-cent difference (absorbs float noise)
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function nowStamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

/* Normalize a line description for matrix matching */
function normDesc(d){
  return String(d||'')
    .replace(/^\s*\d{1,2}\/\d{1,2}\/\d{2,4}\s*-?\s*/,'')                 // 5/1/2026 -
    .replace(/^\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{4}\s*-\s*/i,'') // May 2026 -
    .trim().toLowerCase();
}
// Punctuation-insensitive form so "Mailed - Domestic" and "Mailed Domestic" match the same alias.
const normMatch = s => normDesc(s).replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
function aliasList(r){
  const a=(r.match||'').split('|').map(s=>normMatch(s)).filter(Boolean);
  const d=normMatch(r.desc); if(d) a.push(d);   // also match on SKU description
  return a;
}
// Map a billed line description to the best Rate_Master SKU (exact > ends-with > contains; longer key wins).
function findRule(desc){
  const n=normMatch(desc); let best=null, bestScore=0;
  for(const r of matrix){
    for(const k of aliasList(r)){
      let s=0;
      if(n===k) s=1000+k.length;
      else if(n.endsWith(k)) s=500+k.length;
      else if(n.includes(k)) s=k.length;
      if(s>bestScore){ bestScore=s; best=r; }
    }
  }
  return best;
}
const isPostage = r => /postage/i.test((r.cat||'')+' '+(r.sub||'')+' '+(r.desc||''));

/* ---------- Validation engine — applies Rate_Master + Validation_Rules (R001/R002/R004/R005/R011/R012) ---------- */
function validate(inv){
  const res = { status:'pass', lines:[], chargedTotal:0, correctTotal:0, totalDelta:0, reasons:[], serviceTypes:new Set() };
  if(inv.pending || !inv.lines || inv.lines.length===0){
    res.status='pending'; res.reasons.push('Awaiting invoice data');
    return res;
  }
  let anyFail=false, anyReview=false;
  for(const li of inv.lines){
    const rule = findRule(li.desc);
    const charged = Number(li.amount);
    const qty = Number(li.qty);
    const chargedUnit = Number(li.unit);
    let lr = { desc:li.desc, qty, chargedUnit, charged, rateId:rule?rule.id:null, qtyInferred:!!li.qtyInferred,
               correctUnit:null, correctAmount:null, delta:0, status:'pass', errors:[] };

    // R004 — math error: qty × unit must equal billed amount within $0.01 tolerance
    const arith = r2(qty*chargedUnit);
    if(centsOff(arith,charged) > 1){
      lr.status='fail'; lr.errors.push(`R004 Math error: ${qty.toLocaleString()} × ${rateFmt(chargedUnit)} = ${money(arith)} ≠ billed ${money(charged)}`);
    }

    if(!rule){
      // R002 — no matching Rate_ID: correct rate is unknown → REVIEW (yellow), not a hard fail
      lr.status = lr.status==='fail' ? 'fail' : 'review';
      lr.errors.push('R002 No matching contract rate (uncontracted) — correct rate unavailable; verify against contract');
      res.serviceTypes.add('Uncontracted');
    } else {
      res.serviceTypes.add(rule.cat);
      if(rule.active && String(rule.active).toLowerCase()!=='yes'){
        // R012 — inactive rate used (Critical)
        lr.status='fail'; lr.errors.push(`R012 Inactive rate ${rule.id} billed — rate retired`);
      }
      if(Number(rule.rate)>0){
        lr.correctUnit = Number(rule.rate);
        lr.correctAmount = r2(qty*Number(rule.rate));
        const v=Math.abs(chargedUnit-rule.rate)/rule.rate;
        // RED when the charged rate differs from the contract rate (R001 rate variance)
        if(v>RATE_VARIANCE_PCT){
          lr.status='fail';
          lr.errors.push(`R001 Rate mismatch ${(v*100).toFixed(1)}%: charged ${rateFmt(chargedUnit)} vs correct ${rateFmt(rule.rate)} (${rule.id})`);
          if(isPostage(rule)) lr.errors.push(`R005 Postage billed as lump sum — confirm piece count × $${POSTAGE_BASELINE.toFixed(3)}/pc`);
        } else if(centsOff(charged,lr.correctAmount) > 1){
          lr.status='fail';
          lr.errors.push(`R004 Amount vs contract: charged ${money(charged)} vs correct ${money(lr.correctAmount)}`);
        }
        // R011 — service date before effective date
        if(rule.eff && inv.invdate && inv.invdate < rule.eff){
          lr.status='fail'; lr.errors.push(`R011 Service ${inv.invdate} before effective ${rule.eff} (${rule.id})`);
        }
      } else {
        // matched a SKU but no rate entered → correct rate unknown → REVIEW (yellow)
        lr.status = lr.status==='fail' ? 'fail' : 'review';
        lr.errors.push(`Matrix rate not set for ${rule.id} — correct rate unavailable`);
      }
    }
    lr.delta = r2(charged - (lr.correctAmount==null?charged:lr.correctAmount));
    if(lr.status==='fail') anyFail=true;
    if(lr.status==='review') anyReview=true;
    res.chargedTotal += charged;
    res.correctTotal += (lr.correctAmount==null?charged:lr.correctAmount);
    res.lines.push(lr);
  }
  res.chargedTotal = r2(res.chargedTotal);
  res.correctTotal = r2(res.correctTotal);
  res.totalDelta   = r2(res.chargedTotal - res.correctTotal);
  res.status = anyFail ? 'fail' : (anyReview ? 'review' : 'pass');

  // reason summary
  if(anyFail){
    const n = res.lines.filter(l=>l.status==='fail').length;
    res.reasons.push(`${n} line${n>1?'s':''} failed contract validation`);
    if(Math.abs(res.totalDelta)>0.01) res.reasons.push(`Net variance ${(res.totalDelta>0?'+':'')+money(res.totalDelta)}`);
  } else if(anyReview){
    const n = res.lines.filter(l=>l.status==='review').length;
    res.reasons.push(`${n} line${n>1?'s':''} with no matching contract rate (review)`);
  }
  if(inv.partial) res.reasons.push('Multi-page invoice — partial lines loaded');
  return res;
}

function serviceTypeOf(inv,res){
  if(inv.service) return inv.service;
  const set=[...(res.serviceTypes||[])];
  if(set.length===0) return inv.pending?'—':'Uncontracted';
  if(set.length===1) return set[0];
  return 'Mixed ('+set.length+')';
}

/* ---------- Duplicate detection ---------- */
function dupFlags(){
  const seen={}, flags={};
  invoices.forEach((inv,i)=>{
    const key=(inv.vendor||'').toLowerCase()+'|'+(inv.invno||'').toLowerCase();
    if(seen[key]!==undefined){ flags[i]=true; } else { seen[key]=i; }
  });
  return flags;
}

function renderDashboard(){
  if(!$('#dashTiles')) return;
  let pass=0,fail=0,review=0,pend=0,charged=0,variance=0;
  invoices.forEach(inv=>{ const r=validate(inv);
    if(r.status==='pass')pass++; else if(r.status==='fail')fail++; else if(r.status==='review')review++; else pend++;
    if(!inv.pending){ charged+=r.chargedTotal; variance+=r.totalDelta; } });
  $('#dashTiles').innerHTML=`
    <div class="scard"><div class="l">Invoices uploaded</div><div class="v">${invoices.length}</div></div>
    <div class="scard green"><div class="l">Passing</div><div class="v">${pass}</div></div>
    <div class="scard red"><div class="l">Failing</div><div class="v">${fail}</div></div>
    <div class="scard amber"><div class="l">Needs review</div><div class="v">${review+pend}</div></div>
    <div class="scard"><div class="l">Total charged</div><div class="v">${money(r2(charged))}</div></div>
    <div class="scard ${variance>0.005?'red':''}"><div class="l">Net variance</div><div class="v">${money(r2(variance))}</div></div>`;
  const list=invoices.map((inv,i)=>({inv,i})).sort((a,b)=>String(b.inv.uploadedAt||'').localeCompare(String(a.inv.uploadedAt||'')) || (b.i-a.i));
  $('#dashActivity').innerHTML=list.map(({inv})=>{ const r=validate(inv);
    return `<tr>
      <td>${esc(inv.uploadedAt||'—')}</td>
      <td><b>${esc(inv.invno)}</b>${inv.sourceFile?`<div class="sub" style="color:var(--muted);font-size:11px">${esc(inv.sourceFile)}</div>`:''}</td>
      <td>${esc(serviceTypeOf(inv,r))}</td>
      <td class="num">${inv.pending?'—':money(r.chargedTotal)}</td>
      <td><span class="pill ${r.status}">${r.status.toUpperCase()}</span></td>
      <td>${esc(r.reasons.join('; ')||'—')}</td></tr>`;
  }).join('');
  $('#dashEmpty').style.display=invoices.length?'none':'block';
}

    if(expanded[inv.id]){

      dr.innerHTML=`<td colspan="8" class="detail">${detailHtml(inv,res)}</td>`;
      body.appendChild(dr);
    }
  });
  $('#emptyList').style.display = shown? 'none':'block';
}

function detailHtml(inv,res){

  }

    return `<tr class="${cls}">

      <td><span class="pill ${l.status}">${l.status.toUpperCase()}</span>${l.errors.length?'<div class="reason" style="margin-top:4px">'+l.errors.map(esc).join('<br>')+'</div>':''}</td>
    </tr>`;
  }).join('');

  return `<div class="inner">
    <div class="meta-grid">
      <div><span>Vendor</span><b>${esc(inv.vendor)}</b></div>
      <div><span>Invoice #</span><b>${esc(inv.invno)}</b></div>
      <div><span>Invoice Date</span><b>${esc(inv.invdate||'—')}</b></div>
      <div><span>Due Date</span><b>${esc(inv.duedate||'—')}</b></div>
      <div><span>Customer ID</span><b>${esc(inv.custid||'—')}</b></div>
      <div><span>Customer PO</span><b>${esc(inv.po||'—')}</b></div>
      <div><span>Result</span><b><span class="pill ${res.status}">${res.status.toUpperCase()}</span></b></div>
    </div>
    <div class="summary-bar">
      <div><span>Charged subtotal</span><b>${money(res.chargedTotal)}</b></div>
      <div><span>Calculated correct</span><b>${money(res.correctTotal)}</b></div>
      <div><span>Variance</span><b class="${res.totalDelta>0.005?'delta-pos':(res.totalDelta<-0.005?'delta-neg':'')}">${res.totalDelta===0?'$0.00':(res.totalDelta>0?'+':'')+money(res.totalDelta)}</b></div>
      <div><span>Line items</span><b>${res.lines.length}</b></div>
    </div>

      <tbody>${liRows}</tbody>

}

/* ---------- Batches (grouped by invoice month) ---------- */
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
// Batch grouping uses the SERVICE month derived from line items, not the invoice date.
function monthKey(inv){
  const counts={};
  (inv.lines||[]).forEach(l=>{
    const s=String(l.desc||''); let m=null;
    const dm=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);          // 5/1/2026
    if(dm){ let y=dm[3]; if(y.length===2)y='20'+y; m=y+'-'+String(+dm[1]).padStart(2,'0'); }
    else { const mm=s.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{4})/i); // May 2026 -
      if(mm) m=mm[2]+'-'+String(MON[mm[1].toLowerCase().slice(0,3)]).padStart(2,'0'); }
    if(m) counts[m]=(counts[m]||0)+1;
  });
  const keys=Object.keys(counts);
  if(keys.length){ keys.sort((a,b)=>counts[b]-counts[a]); return keys[0]; } // dominant service month
  if(inv.invdate) return inv.invdate.slice(0,7);                              // fallback: invoice date
  return 'Undated';
}
function monthLabel(k){
  if(k==='Undated') return 'Undated';
  const [y,m]=k.split('-'); const names=['','January','February','March','April','May','June','July','August','September','October','November','December'];
  return names[+m]+' '+y;
}
function renderBatches(){
  const cont=$('#batchContainer'); cont.innerHTML='';
  const groups={};
  invoices.forEach((inv,i)=>{ const k=monthKey(inv); (groups[k]=groups[k]||[]).push({inv,i}); });
  const keys=Object.keys(groups).sort().reverse();
  if(keys.length===0){ cont.innerHTML='<div class="card"><div class="empty">No invoices.</div></div>'; return; }
  keys.forEach(k=>{
    const items=groups[k];
    let charged=0, correct=0, fails=0;
    items.forEach(({inv})=>{ const r=validate(inv); if(!inv.pending){charged+=r.chargedTotal; correct+=r.correctTotal;} if(r.status==='fail')fails++; });
    const div=document.createElement('div'); div.className='batch';
    const rows=items.map(({inv})=>{
      const r=validate(inv);
      return `<tr>
        <td><b>${esc(inv.invno)}</b></td>
        <td>${esc(serviceTypeOf(inv,r))}</td>
        <td class="num">${inv.pending?'—':money(r.chargedTotal)}</td>
        <td class="num">${inv.pending?'—':money(r.correctTotal)}</td>
        <td class="num ${r.totalDelta>0.005?'delta-pos':''}">${inv.pending?'—':(r.totalDelta===0?'$0.00':(r.totalDelta>0?'+':'')+money(r.totalDelta))}</td>
        <td><span class="pill ${r.status}">${r.status.toUpperCase()}</span></td>
      </tr>`;
    }).join('');
    div.innerHTML=`
      <div class="bh">
        <h3>${monthLabel(k)}</h3>
        <span class="pill ${fails?'fail':'pass'}">${fails?fails+' failing':'all clear'}</span>
        <div class="tot">
          <div><span>Charged</span><b>${money(charged)}</b></div>
          <div><span>Correct</span><b>${money(correct)}</b></div>
          <div><span>Variance</span><b class="${(charged-correct)>0.005?'delta-pos':''}">${money(r2(charged-correct))}</b></div>
          <button class="btn sec sm" data-batch="${k}" style="margin-left:8px">Export batch</button>
        </div>
      </div>
      <div class="card" style="border-radius:0 0 10px 10px">
        <table>
          <thead><tr><th>Invoice #</th><th>Service Type</th><th class="num">Charged</th><th class="num">Correct</th><th class="num">Variance</th><th>Result</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    cont.appendChild(div);
    div.querySelector('[data-batch]').addEventListener('click',()=>exportBatch(k));
  });
}

/* ---------- CSV export ---------- */
function csvCell(v){ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function download(name, text){
  const blob=new Blob([text],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}
function exportList(){
  const rows=[['Vendor','Invoice #','Service Type','Invoice Amount','Result','Fail Reasons','Duplicate']];
  const flags=dupFlags();
  invoices.forEach((inv,i)=>{ const r=validate(inv);
    rows.push([inv.vendor, inv.invno, serviceTypeOf(inv,r), inv.pending?'':r.chargedTotal.toFixed(2), r.status.toUpperCase(), r.reasons.join('; '), flags[i]?'YES':'']);
  });
  download('invoice_list.csv', rows.map(r=>r.map(csvCell).join(',')).join('\n'));
  toast('Exported invoice list');
}
function batchCsvRows(k){
  const rows=[];
  invoices.filter(inv=>monthKey(inv)===k).forEach(inv=>{
    const r=validate(inv);
    if(inv.pending){ rows.push([inv.invno,'(pending)','','','','','','','PENDING','']); return; }
    r.lines.forEach(l=>{
      rows.push([inv.invno, serviceTypeOf(inv,r), l.desc, l.qty,
        l.chargedUnit, l.correctUnit==null?'':l.correctUnit, l.charged.toFixed(2),
        l.correctAmount==null?'':l.correctAmount.toFixed(2), l.delta.toFixed(2),
        l.status.toUpperCase(), l.errors.join(' | ')]);
    });
  });
  return rows;
}
function exportBatch(k){
  const header=['Invoice #','Service Type','Line Description','Qty','Charged Rate','Correct Rate','Charged Amount','Correct Amount','Variance','Line Result','Error Detail'];
  const rows=[header, ...batchCsvRows(k)];
  download('batch_'+k+'.csv', rows.map(r=>r.map(csvCell).join(',')).join('\n'));
  toast('Exported '+monthLabel(k)+' batch');
}
function exportAllBatches(){
  const header=['Invoice Month','Invoice #','Service Type','Line Description','Qty','Charged Rate','Correct Rate','Charged Amount','Correct Amount','Variance','Line Result','Error Detail'];
  const rows=[header];
  [...new Set(invoices.map(monthKey))].sort().reverse().forEach(k=>{
    batchCsvRows(k).forEach(r=>rows.push([monthLabel(k),...r]));
  });
