}

/* ---------- PDF ingestion (pdf.js, runs in the browser) ---------- */
function monthNameToISO(s){
  const m=s.match(/([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s*(\d{4})/);
  if(!m) return '';
  const mo=MON[m[1].toLowerCase().slice(0,3)]; if(!mo) return '';
  return `${m[3]}-${String(mo).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;
}
function mdyToISO(s){
  const m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m) return '';
  let y=m[3]; if(y.length===2) y='20'+y;
  return `${y}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;
}

/* ---- OCR helpers (Tesseract.js) ---- */
// OCR a canvas and rebuild visual rows from word bounding boxes (so sparse single rows aren't lost,
// and column order is reconstructed spatially rather than relying on Tesseract's line segmentation).
async function ocrLines(canvas, psm, onProg){
  if(!window.Tesseract) throw new Error('Tesseract.js not loaded');
  const opts={ logger:m=>{ if(m.status==='recognizing text'&&onProg) onProg(m.progress); } };
  if(psm) opts.tessedit_pageseg_mode=String(psm);   // e.g. 11 = sparse text
  const {data}=await Tesseract.recognize(canvas, 'eng', opts);
  let lines;
  const words=(data.words||[]).filter(w=>w&&w.text&&w.text.trim()&&w.bbox);
  if(words.length){
    // Cluster words into rows by adaptive vertical tolerance (~0.6× median text height) so a row's
    // words stay together despite OCR y-jitter — prevents one row splitting into desc-only + numbers-only fragments.
    const ws=words.map(w=>({x:w.bbox.x0, yc:(w.bbox.y0+w.bbox.y1)/2, h:Math.max(1,w.bbox.y1-w.bbox.y0), s:w.text})).sort((a,b)=>a.yc-b.yc);
    const hs=ws.map(w=>w.h).sort((a,b)=>a-b); const medH=hs.length?hs[Math.floor(hs.length/2)]:12;
    const tol=Math.max(6, medH*0.6);
    const rows=[];
    for(const w of ws){
      const last=rows[rows.length-1];
      if(last && Math.abs(w.yc-last.yc)<=tol){ last.items.push(w); last.yc=(last.yc*last.items.length + w.yc)/(last.items.length+1); }
      else rows.push({yc:w.yc, items:[w]});
    }
    lines=rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  } else lines=textToLines(data.text||'');
  return { lines, chars:(data.text||'').replace(/\s/g,'').length };
}
async function pdfPageToCanvas(page, scale){
  const viewport=page.getViewport({scale:scale||3});
  const canvas=document.createElement('canvas');
  canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
  await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
  return canvas;
}
function imageFileToCanvas(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0); URL.revokeObjectURL(url); res(c); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('could not decode image')); };
    img.src=url;
  });
}
function textToLines(text){ return text.split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean); }

/* Pull invoice fields + line items out of an array of text lines (works for both text-layer and OCR output). */
function extractInvoice(lines, file){
  const full=lines.join('\n');
  const get=re=>{ const m=full.match(re); return m?m[1].trim():''; };
  const invno  = get(/Invoice Number:?\s*([0-9]+)/i);
  const invdate= monthNameToISO(get(/Invoice Date:?\s*([A-Za-z]{3,9}\.?\s+\d{1,2},?\s*\d{4})/i));
  const duedate= mdyToISO(get(/Due Date[\s\S]{0,80}?(\d{1,2}\/\d{1,2}\/\d{2,4})/i));
  const custid = get(/Customer ID[\s\S]{0,90}?\b([A-Z]{2,}\d{2,})\b/i) || get(/\b(SLHS\d+)\b/i);
  const po     = get(/\b(SC\s?\d{3,})\b/i);

  const SKIP=/^(Subtotal|Sales Tax|Total Invoice Amount|Payment\/Credit Applied)\b/i;
  const SKIP_TOTAL=/^TOTAL\s+[\d$]/i;
  const META=/Invoice Number|Invoice Date|Customer ID|Customer PO|Account Number|Unit ?Price|Page:|Remit To|Bill To|Due Date|VENDOR ID|ACCOUNTING STRING|DEPARTMENT POINT/i;
  const NUM=/[\d][\d,]*\.\d+/g;
  const numCount=s=>(s.match(NUM)||[]).length;
  const hasAlpha=s=>/[A-Za-z]/.test(s);
  const skippable=s=>SKIP.test(s)||SKIP_TOTAL.test(s)||META.test(s);

  // Repair OCR row splits: merge an adjacent description-only fragment with a numbers-only fragment into one row.
  const L=lines.slice();
  for(let i=0;i<L.length-1;i++){
    const a=L[i], b=L[i+1];
    if(skippable(a)||skippable(b)) continue;
    const aN=numCount(a), bN=numCount(b);
    if(hasAlpha(a)&&aN===0 && bN>=2&&!hasAlpha(b)){ L[i]=a+' '+b; L.splice(i+1,1); i--; }       // desc then numbers
    else if(aN>=2&&!hasAlpha(a) && hasAlpha(b)&&bN===0){ L[i]=b+' '+a; L.splice(i+1,1); i--; }   // numbers then desc
  }

  const items=[];
  for(const t of L){
    if(skippable(t)) continue;
    const ms=[...t.matchAll(NUM)];
    if(ms.length<2) continue;                            // need at least unit + amount
    const take=ms.length>=3?3:2;                         // 3 cols = qty/unit/amount; 2 cols = unit/amount (OCR often drops qty)
    const used=ms.slice(-take);
    // description = everything before the first of the trailing number group (tolerates |, $, : separators)
    const desc=t.slice(0, used[0].index).replace(/[|$:#]+/g,' ').replace(/\s+/g,' ').trim();
    if(!desc || !hasAlpha(desc)) continue;               // require a real (alphabetic) description
    const v=used.map(m=>parseFloat(m[0].replace(/,/g,'')));
    let qty, unit, amount, qtyInferred=false;
    if(take===3){ qty=v[0]; unit=v[1]; amount=v[2]; }
    else {                                               // qty column missing → infer qty = amount / unit
      unit=v[0]; amount=v[1];
      const q = unit>0 ? amount/unit : 1;
      qty = Math.abs(q-Math.round(q))<0.02 ? Math.round(q) : Math.round(q*100)/100;
      qtyInferred=true;
    }
    items.push({desc, qty, unit, amount, qtyInferred});
  }
  return {invno, invdate, duedate, custid, po, items};
}

/* Robustly read a File into an ArrayBuffer.
   file.arrayBuffer() can throw NotReadableError ("...permission problems that have occurred after a
   reference to a file was acquired") when the file is a cloud-sync placeholder (OneDrive / SharePoint /
   Dropbox "Files On-Demand"), lives on a network/synced drive, or was moved/locked between selection and
   read. That stale-reference race is easy to hit here because files are read ONE AT A TIME *after* the
   slow OCR of earlier files — by the time a later file's turn comes, the reference picked at selection
   time can have gone stale. So we: retry, fall back to FileReader (a different read path that also nudges
   on-demand files to hydrate), and back off to give cloud files time to download. */
function readViaFileReader(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=()=>reject(fr.error||new Error('FileReader read failed'));
    try{ fr.readAsArrayBuffer(file); }catch(e){ reject(e); }
  });
}
async function readFileBytes(file, onProg){
  const delays=[0,250,750,1500,3000];   // ~5.5s of retries — lets on-demand files hydrate
  let lastErr;
  for(let attempt=0;attempt<delays.length;attempt++){
    if(delays[attempt]){ onProg&&onProg(`Re-reading file (attempt ${attempt+1})…`); await new Promise(r=>setTimeout(r,delays[attempt])); }
    try{ const b=await file.arrayBuffer(); if(b&&b.byteLength) return b; }catch(e){ lastErr=e; }
    try{ const b=await readViaFileReader(file); if(b&&b.byteLength) return b; }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('file is empty or unreadable');
}

/* Parse one file and ALWAYS return a diagnostic object:
   { ok, code, detail, info, sample, inv? }  — `code` is a stable error code the user can relay back. */
async function parseFile(file, onProg){
  const kb=(file.size/1024).toFixed(0);
  const info=`${file.name} · type:${file.type||'unknown'} · ${kb} KB`;
  const isImg = /^image\//i.test(file.type) || /\.(png|jpe?g|gif|webp|tiff?|bmp|heic)$/i.test(file.name);

  let buf;
  try{ buf=await readFileBytes(file, onProg); }
  catch(e){ return {ok:false, code:'E06_READ_FAILED', info,
    detail:'Browser could not read the file after several retries: '+((e&&e.message)||e)+
      '. This almost always means the file is a cloud placeholder (OneDrive / SharePoint / Dropbox "Files On-Demand") or sits on a network/synced drive, so its bytes are not actually on this PC yet. Fix: in File Explorer right-click the file(s) → "Always keep on this device" (or open the folder so they download to a solid green check), then re-select them. Copying the PDFs into a plain local folder (e.g. the Desktop) and uploading from there also resolves it.'}; }

  let lines=[], charCount=0, pages=1, mode='text';

  if(isImg){
    // ----- IMAGE → OCR -----
    if(!window.Tesseract) return {ok:false, code:'E08_OCR_NOT_LOADED', info,
      detail:'Image upload needs the OCR engine (Tesseract.js), which did not load — likely no internet access to the CDN. Reconnect and reload, or enter the invoice manually.'};
    mode='ocr';
    try{
      const canvas=await imageFileToCanvas(file);
      onProg && onProg('OCR image…');
      let r=await ocrLines(canvas, null, p=>onProg&&onProg(`OCR image ${Math.round(p*100)}%`));
      if(extractInvoice(r.lines,file).items.length===0){           // sparse-text retry (single-row tables)
        onProg && onProg('OCR image (sparse pass)…');
        const r2=await ocrLines(canvas, 11, p=>onProg&&onProg(`OCR image sparse ${Math.round(p*100)}%`));
        if(extractInvoice(r2.lines,file).items.length>0) r=r2;
      }
      lines=r.lines; charCount=r.chars;
    }catch(e){ return {ok:false, code:'E09_OCR_FAILED', info, detail:'OCR failed on the image: '+(e&&e.message||e)}; }
  } else {
    // ----- PDF -----
    if(!window.pdfjsLib) return {ok:false, code:'E01_ENGINE_NOT_LOADED', info,
      detail:'The PDF engine (pdf.js) did not load — usually no internet access to the CDN when the page opened. Reconnect and reload the page, or enter manually.'};
    const head=String.fromCharCode.apply(null, new Uint8Array(buf.slice(0,5)));
    if(head.indexOf('%PDF')<0){
      let kind='unknown'; const b=new Uint8Array(buf.slice(0,4));
      if(b[0]===0x89&&b[1]===0x50) kind='PNG image'; else if(b[0]===0xFF&&b[1]===0xD8) kind='JPEG image';
      else if(b[0]===0x50&&b[1]===0x4B) kind='ZIP/Office file (xlsx/docx)';
      return {ok:false, code:'E07_NOT_A_PDF', info,
        detail:`File does not start with "%PDF" (looks like: ${kind}). Header bytes: "${head.replace(/[^\x20-\x7e]/g,'.')}".`};
    }
    let pdf;
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      pdf=await pdfjsLib.getDocument({data:buf}).promise;
    }catch(e){ return {ok:false, code:'E02_OPEN_FAILED', info,
      detail:'pdf.js could not open the file: '+(e&&e.message||e)+'. It may be encrypted/password-protected or corrupt.'}; }
    pages=pdf.numPages;

    // 1) Try the embedded text layer
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const tc=await page.getTextContent();
      const rows={};
      tc.items.forEach(it=>{ if(!it.str.trim()) return; charCount+=it.str.length;
        const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push({x:it.transform[4], s:it.str}); });
      Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
        const text=rows[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
        if(text) lines.push(text);
      });
    }

    // 2) No text layer → OCR each rendered page (scanned PDF)
    if(charCount < 15){
      if(!window.Tesseract) return {ok:false, code:'E03_NO_TEXT_LAYER', info:`${info} · pages:${pages} · textChars:${charCount}`,
        detail:`Opened ${pages} page(s) with no text layer (scanned PDF) and the OCR engine (Tesseract.js) is not loaded — likely no internet to the CDN. Reconnect and reload to enable OCR.`};
      mode='ocr';
      const ocrAllPages=async(psm)=>{
        let L=[], ch=0;
        for(let p=1;p<=pdf.numPages;p++){
          onProg && onProg(`OCR page ${p}/${pages}${psm?' (sparse)':''}…`);
          const canvas=await pdfPageToCanvas(await pdf.getPage(p), 3);
          const r=await ocrLines(canvas, psm, pr=>onProg&&onProg(`OCR page ${p}/${pages} ${Math.round(pr*100)}%`));
          r.lines.forEach(l=>L.push(l)); ch+=r.chars;
        }
        return {lines:L, chars:ch};
      };
      let r=await ocrAllPages(null);
      if(extractInvoice(r.lines,file).items.length===0){           // sparse-text retry (single-row tables)
        const r2=await ocrAllPages(11);
        if(extractInvoice(r2.lines,file).items.length>0) r=r2;
      }
      lines=r.lines; charCount=r.chars;
    }
  }

  const full=lines.join('\n');
  const sample=full.slice(0,400).replace(/\n/g,' ⏎ ').replace(/\s+/g,' ').trim();
  const pinfo=`${info} · pages:${pages} · ${mode==='ocr'?'OCR':'text'}Chars:${charCount}`;

  if(charCount < 5)
    return {ok:false, code:'E03_NO_TEXT_LAYER', info:pinfo,
      detail:`No readable text found even after ${mode==='ocr'?'OCR':'text extraction'}. The page images may be too low-resolution or blank.`};

  const {invno,invdate,duedate,custid,po,items}=extractInvoice(lines, file);
  const ocrNote = mode==='ocr' ? ' ⚠ via OCR — verify numbers in the expanded row' : '';

  if(!invno && items.length===0)
    return {ok:false, code:'E04_LAYOUT_UNRECOGNIZED', info:pinfo, sample,
      detail:`Text was ${mode==='ocr'?'OCR-read':'extracted'} but no invoice number OR line items matched the expected Meduit layout. Send me the SAMPLE text below and I will tune the parser.`};

  if(items.length===0)
    return {ok:false, code:'E05_NO_LINE_ITEMS', info:pinfo, sample,
      detail:`Found invoice #${invno} but matched 0 line items. The qty / unit / amount columns may be split across lines${mode==='ocr'?' (OCR can scramble columns)':''}. Send me the SAMPLE and I will adjust.`};

  return {ok:true, code:'OK', info:pinfo, sample,
    detail:`Parsed ${items.length} line item(s)`+(invno?` for invoice #${invno}`:' (no invoice # found — used filename)')+ocrNote,
    inv:{ id:(invno||file.name)+'_'+invoices.length, vendor:'Meduit Health Services',
      invno: invno||file.name.replace(/\.(pdf|png|jpe?g|tiff?|webp)$/i,''), invdate, duedate, custid, po,
      service:'', tax:0, ocr:(mode==='ocr'), sourceFile:file.name, uploadedAt:nowStamp(), lines:items }};
}

async function parsePdfs(files){
  const st=$('#pdfStatus'); const diags=[]; let added=0;
  for(let i=0;i<files.length;i++){
    st.textContent=`Parsing ${i+1} of ${files.length}…`;
    let d;
    try{ d=await parseFile(files[i], msg=>{ st.textContent=`File ${i+1}/${files.length}: ${msg}`; }); }
    catch(e){ d={ok:false, code:'E99_UNEXPECTED', info:files[i].name, detail:'Unexpected error: '+(e&&e.message||e)}; console.error(e); }
    if(d.ok){ invoices.push(d.inv); added++; }
    diags.push(d);
  }
  const fails=diags.filter(d=>!d.ok);
  st.textContent=`Added ${added}${fails.length?` · ${fails.length} failed (see code${fails.length>1?'s':''} below)`:''}.`;
  renderDiagnostics(fails);                 // only show codes when something is wrong
  if(added){ render(); ExcelSync.autoSync(); }
  if(added && !fails.length) toast('Added '+added+' invoice(s)');
  else if(added) toast(`Added ${added}, ${fails.length} failed`);
  else toast('No invoices extracted — see the error code(s) below');
}

/* =====================================================================
   Folder Sync — remember a folder (File System Access API) and OCR its
   new invoice files on demand. Handle + processed-file history are kept
   per this file's path (MED_NS) so multiple copies stay independent.
   ===================================================================== */
(function(){
  var FS_OK = (typeof window.showDirectoryPicker === 'function');
  var SYNC_DIR = null;
  var IDB_DB = 'meduit-sync:' + MED_NS, IDB_STORE = 'kv', IDB_KEY = 'dirHandle';
  var SYNCED_KEY = 'meduit_synced_v1:' + MED_NS;     // signatures of files already processed
  var FILE_RE = /\.(pdf|png|jpe?g|gif|webp|bmp|tiff?)$/i;

  function idbOpen(){ return new Promise(function(res,rej){ try{
    var r=indexedDB.open(IDB_DB,1);
    r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  }catch(e){ rej(e); } }); }
  function idbSet(k,v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v,k);
    tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }); }
  function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(IDB_STORE,'readonly'); var rq=tx.objectStore(IDB_STORE).get(k);
    rq.onsuccess=function(){res(rq.result);}; rq.onerror=function(){rej(rq.error);}; }); }); }

  function loadSynced(){ try{ return new Set(JSON.parse(localStorage.getItem(SYNCED_KEY)||'[]')); }catch(e){ return new Set(); } }
  function saveSynced(set){ try{ localStorage.setItem(SYNCED_KEY, JSON.stringify([...set])); }catch(e){} }
  function sig(file){ return file.name+'|'+file.size+'|'+file.lastModified; }
  function syncStatus(msg){ var el=$('#syncStatus'); if(el) el.textContent=msg; }
  function showFolder(name){ var el=$('#syncFolderName'); if(el) el.textContent = name?('Folder: '+name):'';
    var h=$('#headerSyncName'); if(h) h.textContent = name?('📁 '+name):''; }

  // Ask the browser to keep this site's storage so the remembered folder isn't evicted on
  // restart. localStorage data survives, but a folder handle can only live in IndexedDB,
  // which the browser treats as "best-effort" for a local file:// page unless we request
  // persistence — that's why the saved folder otherwise disappears after a reboot.
  function ensurePersistentStorage(){
    try{
      if(navigator.storage && navigator.storage.persist){
        (navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false))
          .then(function(p){ if(!p) navigator.storage.persist(); }).catch(function(){});
      }
    }catch(e){}
  }

  async function ensurePerm(handle){
    if(!handle || !handle.queryPermission) return true;
    var opts={mode:'read'};
    if(await handle.queryPermission(opts)==='granted') return true;
    return (await handle.requestPermission(opts))==='granted';
  }
  async function listFiles(dir){
    var out=[];
    for await(var entry of dir.values()){
      if(entry.kind==='file' && FILE_RE.test(entry.name)){
        try{ out.push(await entry.getFile()); }catch(e){}
      }
    }
    return out.sort(function(a,b){return a.name.localeCompare(b.name);});
  }
  async function chooseFolder(){
    if(!FS_OK){ syncStatus('This browser can’t open folders — use Chrome or Edge, or use the file picker above.'); return; }
    try{
      var dir=await window.showDirectoryPicker({mode:'read'});
      SYNC_DIR=dir; await idbSet(IDB_KEY,dir).catch(function(){});
      showFolder(dir.name);
      await runSync();
    }catch(e){ if(e&&e.name!=='AbortError'){ console.error(e); syncStatus('Could not open folder: '+(e.message||e.name)); } }
  }
  async function runSync(){
    if(!FS_OK){ syncStatus('This browser can’t open folders — use Chrome or Edge.'); return; }
    if(!SYNC_DIR){ return chooseFolder(); }            // first run → pick a folder
    if(!(await ensurePerm(SYNC_DIR))){ syncStatus('Permission to read the folder was denied.'); return; }
    syncStatus('Reading folder…');
    var files;
    try{ files=await listFiles(SYNC_DIR); }
    catch(e){ console.error(e); syncStatus('Could not read the folder: '+(e.message||e.name)); return; }
    var done=loadSynced();
    var fresh=files.filter(function(f){ return !done.has(sig(f)); });
    var skipped=files.length-fresh.length;
    if(!files.length){ syncStatus('No PDF/image files found in “'+SYNC_DIR.name+'”.'); return; }
    if(!fresh.length){ syncStatus('No new files — '+skipped+' already synced from “'+SYNC_DIR.name+'”.'); return; }
    syncStatus('Found '+fresh.length+' new file(s)'+(skipped?(' ('+skipped+' already synced)'):'')+' — OCR running…');
    var before=invoices.length;
    await parsePdfs(fresh);                              // reuse the existing OCR + parse pipeline
    fresh.forEach(function(f){ done.add(sig(f)); }); saveSynced(done);
    save();                                              // persist imported invoices
    var added=invoices.length-before;
    syncStatus('Synced “'+SYNC_DIR.name+'”: '+added+' invoice(s) added from '+fresh.length+' new file(s)'+(skipped?(', '+skipped+' skipped'):'')+'.');
  }
  function forgetHistory(){ saveSynced(new Set()); syncStatus('Sync history cleared — the next sync will re-process every file in the folder.'); }

  // wire buttons
  var sB=$('#syncFolderBtn'), cB=$('#chooseFolderBtn'), fB=$('#forgetSyncBtn'), hB=$('#headerSyncBtn');
  if(sB) sB.addEventListener('click', runSync);
  if(cB) cB.addEventListener('click', chooseFolder);
  if(fB) fB.addEventListener('click', forgetHistory);
  if(hB) hB.addEventListener('click', runSync);   // header Sync button → same one-click sync

  ensurePersistentStorage();   // keep the remembered folder from being evicted on restart

  // restore a previously chosen folder for this file
  if(!FS_OK){
    syncStatus('Folder sync needs Chrome or Edge. You can still use the file picker above.');
    if(cB) cB.disabled=true; if(sB) sB.disabled=true; if(hB) hB.disabled=true;
  } else {
    idbGet(IDB_KEY).then(function(h){ if(h){ SYNC_DIR=h; showFolder(h.name); syncStatus('Folder “'+h.name+'” remembered — click Sync to pull new files.'); } })
      .catch(function(){});
  }
})();

/* ============================================================ EXCEL SYNC
   Link a shared .xlsx (File System Access API) and mirror the uploaded
   invoices into an "Upload Log" sheet so a supervisor can open the workbook
   and see which files came in and their status. Writes in place on
   Chrome/Edge; downloads an updated copy everywhere else. Rows from other
   validator tools sharing the same workbook are preserved. */
/* ===== Excel bridge — delegates all workbook I/O to the combined-suite shell =====
   The shell (parent window) owns ONE shared .xlsx handle. This shim exposes the
   same ExcelSync interface the app already expects, but forwards link/sync to the
   parent and registers this app's log rows + rule sheets with the shell. */
const ExcelSync = (function(){
  function P(){ try{ return (window.parent && window.parent!==window && window.parent.RMSExcel) ? window.parent.RMSExcel : null; }catch(e){ return null; } }
  function el(id){ return document.getElementById(id); }
  function setStatus(msg){ var e=el('xsyncStatus'); if(e) e.textContent=msg; }
  function setName(txt){ var e=el('xsyncName'); if(e) e.textContent=txt; }
  function setAutoBox(v){ var e=el('xsyncAuto'); if(e) e.checked=!!v; }
  function setLinkLabel(txt){ var e=el('xsyncLinkBtn'); if(e) e.textContent=txt; }

  var API = {
    rulesProvider: null,   /* function(){ return [{name, aoa, cols}] } */
    rulesImporter: null,   /* function(sheetsByName){ ...; return changed } */
    _cfg: null,
    init: function(config){
      API._cfg = Object.assign({toolName:'Tool'}, config||{});
      var lb=el('xsyncLinkBtn');   if(lb) lb.addEventListener('click', function(){ var q=P(); if(q) q.link(); });
      var sb=el('xsyncNowBtn');    if(sb) sb.addEventListener('click', function(){ var q=P(); if(q) q.syncAll(); });
      var ub=el('xsyncUnlinkBtn'); if(ub) ub.addEventListener('click', function(){ var q=P(); if(q) q.unlink(); });
      var au=el('xsyncAuto');      if(au) au.addEventListener('change', function(){ var q=P(); if(q) q.setAuto(au.checked); });
      var p=P();
      if(p){
        p.register({
          toolName: API._cfg.toolName,
          getRows: API._cfg.getRows || function(){ return []; },
          getRulesSheets: function(){ return API.rulesProvider ? (API.rulesProvider()||[]) : []; },
          importRules: function(sheets){ return API.rulesImporter ? API.rulesImporter(sheets) : false; },
          ui: { status:setStatus, name:setName, auto:setAutoBox, linkLabel:setLinkLabel }
        });
      } else {
        setStatus('Open the combined suite file to enable shared-Excel sync.');
      }
    },
    autoSync: function(){ var q=P(); if(q) q.autoSync(); },
    sync:     function(){ var q=P(); if(q) q.syncAll(); },
    link:     function(){ var q=P(); if(q) q.link(); },
    unlink:   function(){ var q=P(); if(q) q.unlink(); },
    /* helpers shared by the per-app rule importers */
    findSheet: function(sheets, name){
      if(!sheets) return null;
      var nn=String(name).trim().toLowerCase();
      var keys=Object.keys(sheets);
      for(var i=0;i<keys.length;i++){ if(String(keys[i]).trim().toLowerCase()===nn) return sheets[keys[i]]; }
      return null;
    },
    rowsToObjs: function(aoa, cols){
      var out=[];
      if(!aoa || aoa.length<2) return out;
      for(var r=1;r<aoa.length;r++){
        var row=aoa[r]||[];
        if(row.every(function(c){ return c==null || String(c).trim()===''; })) continue;
        var o={};
        for(var c=0;c<cols.length;c++){ var v=row[c]; o[cols[c]] = (v==null?'':v); }
        out.push(o);
      }
      return out;
    }
  };
  return API;
})();

/* ===== Rules <-> Excel wiring (Meduit rate matrix) ===== */
(function(){
  var M_COLS=['id','cat','sub','desc','uom','rate','tmin','tmax','eff','active','match','notes'];
  ExcelSync.rulesProvider = function(){
    var aoa=[M_COLS].concat(matrix.map(function(r){
      return M_COLS.map(function(c){ return r[c]==null?'':r[c]; });
    }));
    return [ { name:'Meduit Rate Matrix', aoa:aoa, cols:[{wch:20},{wch:16},{wch:16},{wch:44},{wch:14},{wch:10},{wch:10},{wch:10},{wch:12},{wch:8},{wch:44},{wch:40}] } ];
  };
  ExcelSync.rulesImporter = function(sheets){
    var m=ExcelSync.findSheet(sheets,'Meduit Rate Matrix');
    if(!m || m.length<2) return false;
    matrix = ExcelSync.rowsToObjs(m,M_COLS).map(function(o){
      return { id:String(o.id||''), cat:String(o.cat||''), sub:String(o.sub||''), desc:String(o.desc||''),
        uom:String(o.uom||''), rate:Number(o.rate)||0,
        tmin:(o.tmin===''||o.tmin==null)?null:Number(o.tmin), tmax:(o.tmax===''||o.tmax==null)?null:Number(o.tmax),
        eff:String(o.eff||''), active:String(o.active||'Yes'), match:String(o.match||''), notes:String(o.notes||'') };
    });
    save(); if(typeof renderMatrix==='function') renderMatrix(); if(typeof render==='function') render();
    return true;
  };
})();
</script>

<script>
/* ============================================================================
   RMSExcel — the combined suite owns ONE shared .xlsx workbook.
   Each embedded validator (in its iframe) registers with this object and
   contributes (a) log rows for a shared "Upload Log" sheet and (b) its own
   rule sheet(s). Link the workbook once here and everything flows into it.
   In Chrome/Edge the file is updated in place; elsewhere an updated copy is
   downloaded. Rules can also be pushed back OUT of the workbook into the apps.
   ============================================================================ */
window.RMSExcel = (function(){
  var IDB_DB='rms-suite-excel', IDB_STORE='kv', IDB_KEY='fileHandle', AUTO_KEY='rms_suite_autosync';
  var LOG_SHEET='Upload Log';
  var LOG_HEADERS=['Tool','File / Source','Invoice #','Date','Amount','Status','Issues / Notes','Uploaded','Last Updated'];
  var FS_OK=(typeof window.showSaveFilePicker==='function');
  var DEFAULT_NAME='Invoice_Validation_Suite.xlsx';
  var HANDLE=null, autoOn=true, busy=false, autoTimer=null;
  var apps={};   /* toolName -> {getRows, getRulesSheets, importRules, ui} */
  try{ autoOn=localStorage.getItem(AUTO_KEY)!=='0'; }catch(e){}

  /* ---------- IndexedDB (persist the file handle) ---------- */
  function idbOpen(){ return new Promise(function(res,rej){ try{ var r=indexedDB.open(IDB_DB,1);
    r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }catch(e){ rej(e); } }); }
  function idbSet(k,v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v,k);
    tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }); }
  function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(IDB_STORE,'readonly'); var rq=tx.objectStore(IDB_STORE).get(k);
    rq.onsuccess=function(){res(rq.result);}; rq.onerror=function(){rej(rq.error);}; }); }); }
  function idbDel(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(k);
    tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }); }

  /* ---------- helpers ---------- */
  function stamp(d){ d=d||new Date(); var p=function(n){return String(n).padStart(2,'0');};
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  function norm(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }
  function bar(id){ return document.getElementById(id); }
  function downloadBytes(bytes,filename){
    var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
  }
  function ensurePerm(handle){ if(!handle||!handle.queryPermission) return Promise.resolve(true);
    var opts={mode:'readwrite'};
    return Promise.resolve(handle.queryPermission(opts)).then(function(p){
      if(p==='granted') return true;
      return Promise.resolve(handle.requestPermission(opts)).then(function(p2){ return p2==='granted'; });
    }).catch(function(){ return false; }); }

  /* ---------- shell + child UI ---------- */
  function barStatus(msg){ var e=bar('shellSyncStatus'); if(e) e.textContent=msg; broadcast('status',msg); }
  function refreshBar(){
    var linked=!!HANDLE;
    var n=bar('shellSyncName'); if(n) n.textContent = linked?('Linked: '+HANDLE.name):(FS_OK?'No workbook linked':'Download mode (this browser can’t link a file in place)');
    var a=bar('shellSyncAuto'); if(a) a.checked=autoOn;
    var lb=bar('shellSyncLink'); if(lb) lb.textContent=linked?'Re-link workbook':'Link Excel workbook';
    broadcast('name', linked?('Linked: '+HANDLE.name):'No workbook linked');
    broadcast('auto', autoOn);
    broadcast('linkLabel', linked?'Re-link workbook':'Link Excel workbook');
  }
  function broadcast(kind,val){ Object.keys(apps).forEach(function(k){ var c=apps[k];
    if(c&&c.ui&&c.ui[kind]){ try{ c.ui[kind](val); }catch(e){} } }); }

  function register(cfg){ if(!cfg||!cfg.toolName) return; apps[cfg.toolName]=cfg;
    if(cfg.ui){ var linked=!!HANDLE;
      if(cfg.ui.auto) cfg.ui.auto(autoOn);
      if(cfg.ui.name) cfg.ui.name(linked?('Linked: '+HANDLE.name):'No workbook linked');
      if(cfg.ui.linkLabel) cfg.ui.linkLabel(linked?'Re-link workbook':'Link Excel workbook');
    } }

  function collectRows(){ var rows=[]; Object.keys(apps).forEach(function(k){
    try{ (apps[k].getRows()||[]).forEach(function(r){ rows.push(r); }); }catch(e){} }); return rows; }
  function collectRuleSheets(){ var out=[]; Object.keys(apps).forEach(function(k){
    try{ (apps[k].getRulesSheets()||[]).forEach(function(s){ if(s&&s.name&&s.aoa) out.push(s); }); }catch(e){} }); return out; }

  /* ---------- workbook mutation ---------- */
  function findHeaderIdx(aoa){ var wanted=LOG_HEADERS.map(norm);
    for(var i=0;i<Math.min(aoa.length,10);i++){ var row=(aoa[i]||[]).map(norm); var hit=0;
      wanted.forEach(function(w){ if(row.indexOf(w)>=0)hit++; }); if(hit>=3) return i; } return -1; }

  function mutateLog(wb, rows){
    var sName=(wb.SheetNames||[]).filter(function(n){return norm(n)===norm(LOG_SHEET);})[0];
    var aoa=sName?XLSX.utils.sheet_to_json(wb.Sheets[sName],{header:1,raw:true,defval:null}):null;
    var headers=LOG_HEADERS.slice(), keep=[], prevUploaded={};
    var known={}; Object.keys(apps).forEach(function(k){ known[norm(k)]=true; });
    if(aoa){ var hr=findHeaderIdx(aoa);
      if(hr>=0){ headers=aoa[hr].map(function(h){return String(h==null?'':h).trim();});
        var col=function(name){ var nn=norm(name); for(var i=0;i<headers.length;i++) if(norm(headers[i])===nn) return i; return -1; };
        var cTool=col('Tool'), cInv=col('Invoice #'), cFile=col('File / Source'), cUp=col('Uploaded');
        for(var i=hr+1;i<aoa.length;i++){ var r=aoa[i]||[]; if(r.every(function(c){return c==null||String(c).trim()==='';})) continue;
          var tool=cTool>=0?String(r[cTool]==null?'':r[cTool]):'';
          var key=norm(tool)+'||'+norm(cInv>=0?r[cInv]:'')+'||'+norm(cFile>=0?r[cFile]:'');
          if(cUp>=0&&r[cUp]!=null&&String(r[cUp]).trim()!=='') prevUploaded[key]=r[cUp];
          if(!known[norm(tool)]) keep.push(r.slice()); } } }   /* preserve rows from tools not currently loaded */
    var out=[['Invoice Upload & Validation Log — synced automatically from the validation suite'], LOG_HEADERS.slice()];
    keep.forEach(function(r){ out.push(LOG_HEADERS.map(function(h){ var ci=headers.findIndex(function(x){return norm(x)===norm(h);}); return ci>=0?(r[ci]==null?null:r[ci]):null; })); });
    (rows||[]).forEach(function(o){
      var key=norm(o['Tool'])+'||'+norm(o['Invoice #'])+'||'+norm(o['File / Source']);
      if((o['Uploaded']==null||o['Uploaded']==='')&&prevUploaded[key]!=null) o['Uploaded']=prevUploaded[key];
      if(o['Uploaded']==null||o['Uploaded']==='') o['Uploaded']=stamp();
      o['Last Updated']=stamp();
      out.push(LOG_HEADERS.map(function(h){ return o[h]==null?null:o[h]; })); });
    var ws=XLSX.utils.aoa_to_sheet(out,{cellDates:true});
    ws['!cols']=[{wch:16},{wch:32},{wch:14},{wch:12},{wch:14},{wch:10},{wch:48},{wch:18},{wch:18}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:LOG_HEADERS.length-1}}];
    if(sName) wb.Sheets[sName]=ws; else XLSX.utils.book_append_sheet(wb,ws,LOG_SHEET);
  }

  function writeRuleSheets(wb, sheets){
    sheets.forEach(function(s){
      var ws=XLSX.utils.aoa_to_sheet(s.aoa&&s.aoa.length?s.aoa:[['(empty)']]);
      if(s.cols) ws['!cols']=s.cols;
      var name=String(s.name).slice(0,31);
      var existing=(wb.SheetNames||[]).filter(function(n){return norm(n)===norm(name);})[0];
      if(existing){ wb.Sheets[existing]=ws; } else { XLSX.utils.book_append_sheet(wb,ws,name); }
    });
  }

  function commit(){
    if(typeof XLSX==='undefined'){ return Promise.resolve({mode:'error',msg:'the Excel library (SheetJS) did not load — check your connection'}); }
    var rows=collectRows(), ruleSheets=collectRuleSheets();
    function build(buf){
      var wb=(buf&&buf.byteLength)?XLSX.read(buf,{type:'array',cellDates:true}):XLSX.utils.book_new();
      mutateLog(wb,rows); writeRuleSheets(wb,ruleSheets);
      return XLSX.write(wb,{bookType:'xlsx',type:'array',cellDates:true});
    }
    if(!HANDLE){ downloadBytes(build(null),DEFAULT_NAME); return Promise.resolve({mode:'download',fileName:DEFAULT_NAME,n:rows.length}); }
    var canWrite=false;
    return ensurePerm(HANDLE).then(function(ok){ canWrite=ok;
      return HANDLE.getFile().then(function(f){return f.arrayBuffer();}).catch(function(){return null;}); })
      .then(function(buf){
        var out=build(buf);
        if(!canWrite){ downloadBytes(out,HANDLE.name||DEFAULT_NAME); return {mode:'download',fileName:HANDLE.name||DEFAULT_NAME,n:rows.length}; }
        return HANDLE.createWritable().then(function(w){ return w.write(out).then(function(){ return w.close(); }); })
          .then(function(){ return {mode:'inplace',fileName:HANDLE.name,n:rows.length}; })
          .catch(function(e){ console.warn('in-place write failed — downloading',e); downloadBytes(out,HANDLE.name||DEFAULT_NAME); return {mode:'download',fileName:HANDLE.name||DEFAULT_NAME,n:rows.length}; });
      });
  }

  function syncAll(){ if(busy) return Promise.resolve(); busy=true; barStatus('Syncing to Excel…');
    return commit().then(function(res){ res=res||{};
      if(res.mode==='inplace') barStatus('✅ Synced '+res.n+' record(s) + rule tables into “'+res.fileName+'” at '+stamp()+'.');
      else if(res.mode==='download') barStatus('⬇️ Downloaded “'+res.fileName+'” ('+res.n+' record(s) + rule tables) — save it into your shared folder, replacing the old copy.');
      else barStatus('Could not sync: '+(res.msg||'unknown error')+'.');
    }).catch(function(e){ console.error(e); barStatus('Sync failed: '+((e&&e.message)||e)); })
      .then(function(){ busy=false; }); }

  function autoSync(){ if(!autoOn || !HANDLE) return; clearTimeout(autoTimer);
    autoTimer=setTimeout(function(){ if(autoOn && HANDLE) syncAll(); }, 600); }

  function link(){
    if(!FS_OK){ barStatus('This browser can’t link a file in place — use Chrome or Edge. “Sync all now” downloads an updated workbook instead.'); return syncAll(); }
    return Promise.resolve(window.showSaveFilePicker({suggestedName:DEFAULT_NAME,
        types:[{description:'Excel workbook',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]}))
      .then(function(handle){ HANDLE=handle; return idbSet(IDB_KEY,handle).catch(function(){}).then(function(){ refreshBar(); barStatus('Linked “'+handle.name+'”. Syncing…'); return syncAll(); }); })
      .catch(function(e){ if(e&&e.name!=='AbortError'){ console.error(e); barStatus('Could not link workbook: '+((e&&e.message)||e.name)); } });
  }
  function unlink(){ HANDLE=null; idbDel(IDB_KEY).catch(function(){}); refreshBar(); barStatus('Workbook unlinked. “Sync all now” will download a file until you link again.'); }

  function loadRulesFromWorkbook(){
    if(typeof XLSX==='undefined'){ barStatus('The Excel library did not load — check your connection.'); return; }
    if(!HANDLE){ barStatus('Link a workbook first, then use “Load rules from workbook”.'); return; }
    barStatus('Reading rules from the workbook…');
    ensurePerm(HANDLE).then(function(){ return HANDLE.getFile(); }).then(function(f){ return f.arrayBuffer(); })
      .then(function(buf){
        var wb=XLSX.read(buf,{type:'array'});
        var sheets={};
        (wb.SheetNames||[]).forEach(function(n){ sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}); });
        var hits=0;
        Object.keys(apps).forEach(function(k){ try{ if(apps[k].importRules(sheets)) hits++; }catch(e){ console.warn(e); } });
        barStatus(hits?('✅ Loaded rules from the workbook into '+hits+' tab(s). Tables refreshed.'):'No matching rule sheets found in the workbook.');
      })
      .catch(function(e){ console.error(e); barStatus('Could not read rules: '+((e&&e.message)||e)); });
  }

  function setAuto(v){ autoOn=!!v; try{ localStorage.setItem(AUTO_KEY,autoOn?'1':'0'); }catch(e){} refreshBar(); }
  function getAuto(){ return autoOn; }

  function initBar(){
    var lb=bar('shellSyncLink');   if(lb) lb.addEventListener('click',link);
    var sb=bar('shellSyncNow');    if(sb) sb.addEventListener('click',syncAll);
    var rb=bar('shellLoadRules');  if(rb) rb.addEventListener('click',loadRulesFromWorkbook);
    var ub=bar('shellSyncUnlink'); if(ub) ub.addEventListener('click',unlink);
    var au=bar('shellSyncAuto');   if(au) au.addEventListener('change',function(){ setAuto(au.checked); });
    refreshBar();
    if(!FS_OK) barStatus('Tip: open this file in Chrome or Edge to link a workbook that updates in place. Other browsers download an updated copy on each sync.');
    idbGet(IDB_KEY).then(function(h){ if(h){ HANDLE=h; refreshBar(); barStatus('Workbook “'+h.name+'” remembered — click “Sync all now” (or upload/validate an invoice) to push the latest data.'); } }).catch(function(){});
  }

  return { register:register, link:link, unlink:unlink, syncAll:syncAll, autoSync:autoSync,
           setAuto:setAuto, getAuto:getAuto, loadRulesFromWorkbook:loadRulesFromWorkbook, initBar:initBar };
})();

</script>
<script>

(function(){
  /* Build one isolated iframe per app from its <template>. Everything runs in
     the same origin, so each app keeps its own CSS/JS/localStorage with zero
     collisions, and can still call parent.RMSExcel for shared-workbook sync. */
  var frames = document.getElementById('frames');
  var byApp = {};
  Array.prototype.forEach.call(document.querySelectorAll('template.app-src'), function(tpl){
    var id = tpl.getAttribute('data-app');
    var f = document.createElement('iframe');
    f.className = 'appframe';
    f.setAttribute('data-app', id);
    f.setAttribute('title', id + ' validator');
    f.setAttribute('allow', 'clipboard-read; clipboard-write');
    f.srcdoc = '<!DOCTYPE html>' + tpl.innerHTML;
    frames.appendChild(f);
    byApp[id] = f;
  });
  function show(id){
    Array.prototype.forEach.call(document.querySelectorAll('#suiteTabs button'), function(b){
      b.classList.toggle('active', b.getAttribute('data-app') === id);
    });
    Object.keys(byApp).forEach(function(k){ byApp[k].classList.toggle('active', k === id); });
  }
  document.querySelectorAll('#suiteTabs button').forEach(function(b){
    b.addEventListener('click', function(){ show(b.getAttribute('data-app')); });
  });
  var first = document.querySelector('#suiteTabs button');
  if (first) show(first.getAttribute('data-app'));

  if (window.RMSExcel && window.RMSExcel.initBar) window.RMSExcel.initBar();
})();

</script>
