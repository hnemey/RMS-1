/* ============================================================ INVOICE UPSERT */
function nowStamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function upsert(p){
  const ex=invoices.find(i=>i.invno===p.invno && p.invno);
  const inv={id:'inv_'+(p.invno||Math.random().toString(36).slice(2)),vendor:p.vendor,invno:p.invno,date:p.date,amount:p.amount,lineItems:p.lineItems,notes:ex?ex.notes:'',
    sourceFile:p.sourceFile||(ex&&ex.sourceFile)||'', uploadedAt:(ex&&ex.uploadedAt)?ex.uploadedAt:nowStamp()};
  if(ex) Object.assign(ex,inv); else invoices.push(inv);
  return inv;
}
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* ============================================================ PDF / IMAGE INGESTION (pdf.js + OCR)
   Reads the embedded text layer; falls back to OCR (Tesseract.js) for scanned PDFs / images.
   Returns rows of {x,s} reconstructed spatially, then extracts Waystar header fields + line items. */
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function mdyToISO(s){ const m=s&&s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/); if(!m)return ''; let y=m[3]; if(y.length===2)y='20'+y; return `${y}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`; }

async function ocrCanvas(canvas,psm,onProg){
  if(!window.Tesseract) throw new Error('Tesseract.js not loaded (no internet to OCR CDN)');
  const opts={logger:m=>{ if(m.status==='recognizing text'&&onProg) onProg(Math.round(m.progress*100)); }};
  if(psm) opts.tessedit_pageseg_mode=String(psm);
  const {data}=await Tesseract.recognize(canvas,'eng',opts);
  const words=(data.words||[]).filter(w=>w&&w.text&&w.text.trim()&&w.bbox);
  let rows=[];
  if(words.length){
    const ws=words.map(w=>({x:w.bbox.x0,yc:(w.bbox.y0+w.bbox.y1)/2,h:Math.max(1,w.bbox.y1-w.bbox.y0),s:w.text})).sort((a,b)=>a.yc-b.yc);
    const hs=ws.map(w=>w.h).sort((a,b)=>a-b); const medH=hs.length?hs[Math.floor(hs.length/2)]:12; const tol=Math.max(6,medH*0.6);
    for(const w of ws){ const last=rows[rows.length-1];
      if(last && Math.abs(w.yc-last.yc)<=tol){ last.cells.push({x:w.x,s:w.s}); last.yc=(last.yc*last.cells.length+w.yc)/(last.cells.length+1); }
      else rows.push({yc:w.yc,cells:[{x:w.x,s:w.s}]}); }
  } else { (data.text||'').split('\n').forEach(t=>{ t=t.replace(/\s+/g,' ').trim(); if(t) rows.push({cells:[{x:0,s:t}]}); }); }
  rows.forEach(r=>r.cells.sort((a,b)=>a.x-b.x));
  return {rows,chars:(data.text||'').replace(/\s/g,'').length};
}
async function pdfPageCanvas(page,scale){ const vp=page.getViewport({scale:scale||3}); const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height); await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; return c; }
function imageToCanvas(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); URL.revokeObjectURL(url); res(c); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('could not decode image')); }; img.src=url; }); }

/* Build {x,s} rows from a PDF text layer (grouped by y). */
function textLayerRows(tc,vp){
  const map={}; let chars=0;
  tc.items.forEach(it=>{ if(!it.str.trim())return; chars+=it.str.length; const y=Math.round(vp.height-it.transform[5]); (map[y]=map[y]||[]).push({x:it.transform[4],s:it.str.trim()}); });
  const rows=Object.keys(map).map(Number).sort((a,b)=>a-b).map(y=>({cells:map[y].sort((a,b)=>a.x-b.x)}));
  return {rows,chars};
}

/* Extract Waystar fields + line items from reconstructed rows (cell-based, x-aware). */
const isNumCell=s=>/^\(?-?\$?-?[\d,]*\.?\d+\)?%?$/.test(String(s).trim()) && /\d/.test(s);
const isMoneyCell=s=>/\.\d{1,2}$/.test(String(s).replace(/[)$,%]/g,'').trim());
function extractFromRows(rows){
  let invno='',date='',amount='';
  // ---- Waystar 4-col header table: align values to header columns by x ----
  for(let i=0;i<rows.length-1;i++){
    const hc=rows[i].cells, hs=hc.map(c=>c.s).join(' ').toLowerCase();
    if(/invoice\s*#/.test(hs)&&/invoice\s*date/.test(hs)&&/invoice\s*amount/.test(hs)){
      const colX=l=>{ const c=hc.find(c=>c.s.toLowerCase().includes(l)); return c?c.x:null; };
      const ix=colX('invoice #')??colX('invoice')??null, dx=colX('date'), ax=colX('amount');
      const vrow=rows[i+1].cells, near=tx=>{ if(tx==null)return null; let best=null,d=1e9; vrow.forEach(v=>{const dd=Math.abs(v.x-tx); if(dd<d){d=dd;best=v;}}); return best; };
      const iv=near(ix), dv=near(dx), av=near(ax);
      if(iv && /^\d{5,9}$/.test(iv.s.trim())) invno=iv.s.trim();
      if(dv){ const dm=dv.s.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/); if(dm) date=mdyToISO(dm[0]); }
      if(av){ const am=av.s.match(/[\d,]+\.\d{2}/); if(am) amount=am[0].replace(/,/g,''); }
      break;
    }
  }
  // ---- fallback header fields from flat text ----
  const flat=rows.map(r=>r.cells.map(c=>c.s).join(' ')).join('\n');
  if(!invno){ const m=flat.match(/invoice\s*#\s*[:#]?\s*(\d{5,9})/i); if(m) invno=m[1]; }
  if(!date){ const m=flat.match(/invoice\s*date\s*[:#]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i)||flat.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/); if(m) date=mdyToISO(m[1]); }
  if(!amount){ const m=flat.match(/invoice\s*amount\s*\$?\s*([\d,]+\.\d{2})/i)||flat.match(/amount\s*due\s*\$?\s*([\d,]+\.\d{2})/i); if(m) amount=m[1].replace(/,/g,''); }

  // ---- locate the line-item table header (Description / Qty / Price|Rate / Total|Amount) ----
  let hdr=-1, qtyX=null, priceX=null, totalX=null;
  for(let i=0;i<rows.length;i++){
    const t=rows[i].cells.map(c=>c.s.toLowerCase()).join(' ');
    if(t.includes('description')&&(t.includes('qty')||t.includes('quantity'))&&(t.includes('total')||t.includes('amount'))){
      hdr=i; rows[i].cells.forEach(c=>{ const s=c.s.toLowerCase();
        if(s.includes('qty')||s.includes('quantity')) qtyX=c.x;
        else if(s.includes('price')||s.includes('rate')||s.includes('unit')) priceX=c.x;
        else if(s.includes('total')||s.includes('amount')) totalX=c.x; });
      break;
    }
  }

  const items=[];
  const pushRow=(cells)=>{
    // split numeric trailing cells (qty/price/total) from description cells
    const numIdx=cells.map((c,idx)=>isNumCell(c.s)?idx:-1).filter(idx=>idx>=0);
    if(numIdx.length<2) return;
    const lastNum=cells[numIdx[numIdx.length-1]].s;
    if(!isMoneyCell(lastNum)) return;                 // total must look monetary -> filters page #, PO, etc.
    const take=numIdx.length>=3?3:2;
    const use=numIdx.slice(-take);
    const total=num(cells[use[take-1]].s), price=num(cells[use[take-2]].s);
    let qty = take===3 ? num(cells[use[0]].s) : (price?r2(total/price):1);
    let desc=cells.filter((c,idx)=>!use.includes(idx)).map(c=>c.s).join(' ').replace(/[|]+/g,' ').replace(/\s+/g,' ').trim();
    if(!desc||!/[a-z]/i.test(desc)) return;
    items.push({description:desc,qty,price,total});
  };

  if(hdr>=0 && qtyX!=null && totalX!=null){
    for(let i=hdr+1;i<rows.length;i++){
      try{
      const cells=rows[i].cells; if(!cells||!cells.length) continue;
      const rowText=cells.map(c=>c.s).join(' ');
      if(/^\s*$/.test(rowText)) continue;
      if(/sub\s*total|^total\b/i.test(rowText) && !matchService(rowText)) continue;
      // column-bucket: description = cells left of qty column
      const descCells=cells.filter(c=>c.x < qtyX-15);
      const tailCells=cells.filter(c=>c.x >= qtyX-15);
      if(!descCells.length){ pushRow(cells); continue; }   // no clean split -> heuristic
      const numIdx=tailCells.map((c,idx)=>isNumCell(c.s)?idx:-1).filter(i2=>i2>=0);
      if(numIdx.length<2 || !isMoneyCell(tailCells[numIdx[numIdx.length-1]].s)) continue;
      const take=numIdx.length>=3?3:2, use=numIdx.slice(-take);
      const total=num(tailCells[use[take-1]].s), price=num(tailCells[use[take-2]].s);
      let qty=take===3?num(tailCells[use[0]].s):(price?r2(total/price):1);
      const desc=descCells.map(c=>c.s).join(' ').replace(/[|]+/g,' ').replace(/\s+/g,' ').trim();
      if(!desc||!/[a-z]/i.test(desc)) continue;
      items.push({description:desc,qty,price,total});
      }catch(e){ /* skip any malformed row */ }
    }
  } else {
    // no header found (e.g. OCR) -> per-row trailing-number heuristic
    rows.forEach(r=>{ try{ const txt=(r.cells||[]).map(c=>c.s).join(' '); if(matchService(txt)) pushRow(r.cells); }catch(e){} });
  }
  return {invno,date,amount,items};
}

async function parsePdfFile(file,onProg){
  const isImg=/^image\//i.test(file.type)||/\.(png|jpe?g|gif|webp|tiff?|bmp)$/i.test(file.name);
  const buf=await file.arrayBuffer();
  let rows=[],chars=0,mode='text',pages=1;
  if(isImg){
    if(!window.Tesseract) return {ok:false,code:'OCR_NOT_LOADED',detail:'Image upload needs the OCR engine (Tesseract.js) which did not load — check internet, or enter manually.'};
    mode='ocr';
    const canvas=await imageToCanvas(file);
    onProg&&onProg('OCR image…');
    let r=await ocrCanvas(canvas,null,p=>onProg&&onProg('OCR image '+p+'%'));
    if(extractFromRows(r.rows).items.length===0){ const r2=await ocrCanvas(canvas,11,p=>onProg&&onProg('OCR sparse '+p+'%')); if(extractFromRows(r2.rows).items.length) r=r2; }
    rows=r.rows; chars=r.chars;
  } else {
    if(!window.pdfjsLib) return {ok:false,code:'PDF_ENGINE',detail:'pdf.js did not load — check internet, or enter manually.'};
    const head=String.fromCharCode.apply(null,new Uint8Array(buf.slice(0,5)));
    if(head.indexOf('%PDF')<0) return {ok:false,code:'NOT_PDF',detail:'File is not a PDF.'};
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pdf; try{ pdf=await pdfjsLib.getDocument({data:buf}).promise; }catch(e){ return {ok:false,code:'PDF_OPEN',detail:'Could not open PDF (encrypted/corrupt): '+(e.message||e)}; }
    pages=pdf.numPages;
    for(let p=1;p<=pages;p++){ const page=await pdf.getPage(p); const vp=page.getViewport({scale:1}); const tl=textLayerRows(await page.getTextContent(),vp); rows=rows.concat(tl.rows); chars+=tl.chars; }
    if(chars<15){ // scanned PDF -> OCR each page
      if(!window.Tesseract) return {ok:false,code:'NO_TEXT_LAYER',detail:`Scanned PDF (${pages} page(s), no text layer) and OCR engine not loaded — check internet, or enter manually.`};
      mode='ocr'; rows=[]; chars=0;
      const run=async psm=>{ let R=[],C=0; for(let p=1;p<=pages;p++){ onProg&&onProg(`OCR page ${p}/${pages}${psm?' sparse':''}…`); const canvas=await pdfPageCanvas(await pdf.getPage(p),3); const r=await ocrCanvas(canvas,psm,pr=>onProg&&onProg(`OCR page ${p}/${pages} ${pr}%`)); R=R.concat(r.rows); C+=r.chars; } return {rows:R,chars:C}; };
      let r=await run(null); if(extractFromRows(r.rows).items.length===0){ const r2=await run(11); if(extractFromRows(r2.rows).items.length) r=r2; }
      rows=r.rows; chars=r.chars;
    }
  }
  if(chars<5) return {ok:false,code:'NO_TEXT',detail:`No readable text found (${mode}). Image may be too low-resolution.`};
  const ex=extractFromRows(rows);
  if(!ex.invno && ex.items.length===0) return {ok:false,code:'LAYOUT',detail:`Read ${chars} ${mode} chars but found no invoice # or line items matching the Waystar layout.`,sample:rows.map(r=>r.cells.map(c=>c.s).join(' ')).join(' ⏎ ').slice(0,400)};
  const amount=num(ex.amount)||r2(ex.items.reduce((s,i)=>s+num(i.total),0));
  return {ok:true,mode,code:'OK',detail:`Parsed ${ex.items.length} line item(s)`+(ex.invno?` for invoice #${ex.invno}`:'')+(mode==='ocr'?' ⚠ via OCR — verify numbers':''),
    parsed:{vendor:'Waystar',invno:ex.invno||file.name.replace(/\.[^.]+$/,''),date:ex.date,amount,lineItems:ex.items,sourceFile:file.name}};
}

async function importPdfs(files){
  const st=$('#pdfStatus'); const diags=[]; let last=null;
  for(let i=0;i<files.length;i++){
    st.textContent=`Parsing ${i+1}/${files.length}…`;
    let d; try{ d=await parsePdfFile(files[i],msg=>st.textContent=`File ${i+1}/${files.length}: ${msg}`); }
    catch(e){ d={ok:false,code:'ERR',detail:'Unexpected error: '+(e.message||e)}; console.error(e); }
    diags.push({name:files[i].name,...d});
    if(d.ok) last=d.parsed;
  }
  const okN=diags.filter(d=>d.ok).length;
  st.textContent=`Parsed ${okN}/${files.length}.`;
  renderPdfDiag(diags);
  if(files.length===1 && last){ fillForm(last); switchView('add'); toast('Parsed — review & Save'); }
  else if(okN){ diags.filter(d=>d.ok).forEach(d=>upsert(d.parsed)); render(); ExcelSync.autoSync(); switchView('invoices'); toast(`Added ${okN} invoice(s) — review in the list`); }
  else toast('No invoices parsed — see diagnostics');
}
function renderPdfDiag(diags){
  const box=$('#pdfDiag'); const fails=diags.filter(d=>!d.ok);
  if(!fails.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block';
  box.innerHTML='<b style="font-size:13px">Files needing attention</b><pre style="margin:6px 0 0;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:11.5px;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;max-height:280px;overflow:auto">'+
    esc(fails.map(d=>`[${d.code}] ${d.name}\n   ${d.detail}${d.sample?'\n   SAMPLE: '+d.sample:''}`).join('\n\n'))+'</pre>';
}

/* ============================================================ MANUAL FORM */
function addLineRow(desc='',qty='',price='',total=''){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input type="text" value="${esc(desc)}" class="li-desc"></td>
    <td><input type="number" step="any" value="${qty}" class="li-qty num"></td>
    <td><input type="number" step="any" value="${price}" class="li-price num"></td>
    <td><input type="number" step="any" value="${total}" class="li-total num"></td>
    <td><button class="x">✕</button></td>`;
  tr.querySelector('.x').addEventListener('click',()=>tr.remove());
  const q=tr.querySelector('.li-qty'),p=tr.querySelector('.li-price'),t=tr.querySelector('.li-total');
  function auto(){ if(t.value===''&&q.value&&p.value) t.value=r2(q.value*p.value); }
  q.addEventListener('blur',auto); p.addEventListener('blur',auto);
  $('#liBody').appendChild(tr);
}
function fillForm(p){ $('#f_vendor').value=p.vendor||'Waystar'; $('#f_invno').value=p.invno||''; $('#f_invdate').value=p.date||''; $('#f_amount').value=p.amount||'';
  $('#liBody').innerHTML=''; (p.lineItems&&p.lineItems.length?p.lineItems:[{}]).forEach(l=>addLineRow(l.description||'',l.qty||'',l.price||'',l.total||'')); }
function clearForm(){ ['f_invno','f_amount'].forEach(id=>$('#'+id).value=''); $('#f_invdate').value=''; $('#liBody').innerHTML=''; addLineRow(); }
function saveManual(){
  const invno=$('#f_invno').value.trim(); if(!invno){ toast('Invoice # required'); return; }
  const lineItems=[...document.querySelectorAll('#liBody tr')].map(tr=>({
    description:tr.querySelector('.li-desc').value.trim(),
    qty:num(tr.querySelector('.li-qty').value), price:num(tr.querySelector('.li-price').value),
    total:num(tr.querySelector('.li-total').value)||r2(num(tr.querySelector('.li-qty').value)*num(tr.querySelector('.li-price').value)),
  })).filter(l=>l.description);
  const amount=num($('#f_amount').value)||lineItems.reduce((s,i)=>s+i.total,0);
  upsert({vendor:$('#f_vendor').value.trim()||'Waystar',invno,date:$('#f_invdate').value,amount,lineItems});
  render(); ExcelSync.autoSync(); clearForm(); toast('Saved invoice '+invno); switchView('invoices');
}

/* ============================================================ EXPORTS (xlsx) */
function stamp(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function exportListXlsx(){
  if(!invoices.length){ toast('No invoices'); return; }
  const wb=XLSX.utils.book_new();
  const data=[['Invoice Tracking Report'],[],['Vendor','Invoice #','Invoice Date','Invoice Amount','Status','Expected Credit','Fail Reason','Notes','Fiscal Year']];
  [...invoices].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).forEach(i=>{ const r=resultOf(i);
    data.push([i.vendor,i.invno,i.date,num(i.amount),r.status.toUpperCase(),r.totalCredit,r.reasons.join('; '),i.notes||'',i.date?fyLabel(fyOf(i.date)):'']); });
  data.push([],['FY-to-Date Totals (Oct 1 – Sep 30)'],['Fiscal Year','Invoices','Total Cost','Expected Credits','Pass Rate']);
  [...new Set(invoices.map(i=>fyOf(i.date)).filter(v=>v!=null))].sort((a,b)=>b-a).forEach(y=>{
    const f=invoices.filter(i=>fyOf(i.date)===y); const t=f.reduce((s,i)=>s+num(i.amount),0);
    const cr=f.reduce((s,i)=>s+resultOf(i).totalCredit,0); const ps=f.filter(i=>resultOf(i).status==='pass').length;
    data.push([fyLabel(y),f.length,t,cr,(f.length?Math.round(ps/f.length*100):0)+'%']); });
  const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:20},{wch:12},{wch:13},{wch:15},{wch:9},{wch:15},{wch:55},{wch:30},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'Invoice Tracking'); XLSX.writeFile(wb,`Invoice_Tracking_${stamp()}.xlsx`); toast('Exported tracking list');
}
function exportInvoiceXlsx(inv){
  const r=resultOf(inv); const wb=XLSX.utils.book_new();
  const rows=[[`Validation — ${inv.vendor} — Invoice #${inv.invno} — ${inv.date||''}`],
    [`Status: ${r.status.toUpperCase()}   Invoice Amount: ${money(num(inv.amount))}   Expected Credit: ${money(r.totalCredit)}`],[],
    ['Description','Qty','Charged Unit Price','Correct Unit Price','Charged Amount','Correct Amount','Expected Credit','Line Result','Issue']];
  r.lines.forEach(l=>rows.push([l.desc,l.qty,l.chargedUnit,l.correctUnit==null?'':l.correctUnit,l.charged,l.correctAmt==null?'':l.correctAmt,l.credit||'',l.status.toUpperCase(),l.errors.join('; ')]));
  rows.push([],['TOTALS','','','',r.chargedTotal,r.correctTotal,r.totalCredit,'','']);
  if(inv.notes) rows.push([],['Notes',inv.notes]);
  const ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:48},{wch:10},{wch:16},{wch:16},{wch:14},{wch:14},{wch:14},{wch:10},{wch:60}];
  XLSX.utils.book_append_sheet(wb,ws,'Validation'); XLSX.writeFile(wb,`Validation_${inv.invno}_${stamp()}.xlsx`); toast('Exported invoice '+inv.invno);
}
function exportSavMonthXlsx(){
  const inv=invoices.find(i=>i.id===$('#savSelect').value); if(!inv){ toast('Select an invoice'); return; }
  const rows=calcSavings(inv); if(!rows.length){ toast('No comparable services'); return; }
  const tc=r2(rows.reduce((s,x)=>s+x.currCost,0)),tp=r2(rows.reduce((s,x)=>s+x.prevCost,0));
  const data=[[`Cost Savings — ${inv.vendor} — Invoice #${inv.invno} — ${inv.date||''}`],[],
    ['Service','Txn Volume','Current Net Cost','Prev Monthly Fee','Prev Tier','Prev Overage Rate','Prev Expected Cost','Savings (Prev−Curr)'],
    ...rows.map(x=>[x.label,x.vol,x.currCost,x.prevMonthly,x.prevTier,x.prevOverage,x.prevCost,x.savings]),
    [],['TOTAL','',tc,'','','',tp,r2(tp-tc)]];
  const wb=XLSX.utils.book_new(); const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:32},{wch:12},{wch:16},{wch:16},{wch:12},{wch:16},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws,'Monthly Savings'); XLSX.writeFile(wb,`Cost_Savings_${inv.invno}_${stamp()}.xlsx`); toast('Exported monthly savings');
}
function exportSavHistXlsx(){
  if(!invoices.length){ toast('No invoices'); return; }
  let run=0; const data=[['Historical Cost Savings'],[],['Date','Invoice #','Vendor','Current Cost','Est. Previous Cost','Monthly Savings','Running Savings']];
  [...invoices].sort((a,b)=>new Date(a.date||0)-new Date(b.date||0)).forEach(inv=>{ const sr=calcSavings(inv);
    const c=r2(sr.reduce((s,x)=>s+x.currCost,0)),p=r2(sr.reduce((s,x)=>s+x.prevCost,0)); run=r2(run+(p-c)); data.push([inv.date,inv.invno,inv.vendor,c,p,r2(p-c),run]); });
  const wb=XLSX.utils.book_new(); const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:13},{wch:12},{wch:20},{wch:16},{wch:18},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws,'Savings History'); XLSX.writeFile(wb,`Cost_Savings_History_${stamp()}.xlsx`); toast('Exported savings history');
}

/* ============================================================ VIEW SWITCH + WIRING */
function switchView(v){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));
  if(v==='savings'){ populateSavSelect(); renderSavMonthly(); renderSavHistory(); }
  if(v==='matrix') renderMatrix();
  if(v==='dashboard') renderDashboard();
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
$('#search').addEventListener('input',renderInvoiceList);
$('#filterStatus').addEventListener('change',renderInvoiceList);
$('#fyFilter').addEventListener('change',()=>{ renderFYBar(); renderInvoiceList(); });
$('#revalBtn').addEventListener('click',()=>{ invalidate(); render(); toast('Re-validated all invoices'); });
$('#exportListBtn').addEventListener('click',exportListXlsx);
$('#savSelect').addEventListener('change',renderSavMonthly);
$('#exportSavMonthBtn').addEventListener('click',exportSavMonthXlsx);
$('#exportSavHistBtn').addEventListener('click',exportSavHistXlsx);
$('#matrixSearch').addEventListener('input',renderMatrix);
$('#addRateBtn').addEventListener('click',()=>{ ensureEdit(); rates.prices.push({id:'NEW_'+(rates.prices.length+1),label:'New service',group:'Other',type:'per_unit',price:0,match:''}); save(); renderMatrix(); });
$('#resetMatrixBtn').addEventListener('click',()=>{ if(confirm('Reset rate table to defaults?')){ rates={}; save(); renderMatrix(); render(); toast('Reset to defaults'); } });
$('#pdfDrop').addEventListener('click',()=>$('#pdfInput').click());
$('#pdfDrop').addEventListener('dragover',e=>{e.preventDefault();$('#pdfDrop').classList.add('over');});
$('#pdfDrop').addEventListener('dragleave',()=>$('#pdfDrop').classList.remove('over'));
$('#pdfDrop').addEventListener('drop',e=>{e.preventDefault();$('#pdfDrop').classList.remove('over'); if(e.dataTransfer.files.length) importPdfs([...e.dataTransfer.files]);});
$('#pdfInput').addEventListener('change',e=>{ if(e.target.files.length) importPdfs([...e.target.files]); e.target.value=''; });
$('#addLineBtn').addEventListener('click',()=>addLineRow());
$('#saveInvoiceBtn').addEventListener('click',saveManual);
$('#clearFormBtn').addEventListener('click',clearForm);
$('#importJsonBtn').addEventListener('click',()=>{ try{ const arr=JSON.parse($('#jsonBox').value); if(!Array.isArray(arr))throw 0;
  arr.forEach((o,k)=>{ if(!o.id)o.id='inv_'+(o.invno||k); }); invoices=invoices.concat(arr); render(); toast('Imported '+arr.length); }catch(e){ toast('Invalid JSON'); } });
$('#dumpJsonBtn').addEventListener('click',()=>{ $('#jsonBox').value=JSON.stringify(invoices.map(({_res,...o})=>o),null,2); });

/* ============================================================ EXCEL SYNC
   Link a shared .xlsx (File System Access API) and mirror the uploaded
   invoices into an "Upload Log" sheet so a supervisor can open the workbook
   and see which files came in and their status. Writes in place on
   Chrome/Edge; downloads an updated copy everywhere else. Rows from other
   validator tools sharing the same workbook are preserved. */
/* ===== Excel bridge — delegates all workbook I/O to the combined-suite shell =====
   The shell (parent window) owns ONE shared .xlsx handle. This shim exposes the
   same ExcelSync interface the app already expects, but forwards link/sync to the
   parent and registers this app's log rows + rule sheets with the shell. */
const ExcelSync = (function(){
  function P(){ try{ return (window.parent && window.parent!==window && window.parent.RMSExcel) ? window.parent.RMSExcel : null; }catch(e){ return null; } }
  function el(id){ return document.getElementById(id); }
  function setStatus(msg){ var e=el('xsyncStatus'); if(e) e.textContent=msg; }
  function setName(txt){ var e=el('xsyncName'); if(e) e.textContent=txt; }
  function setAutoBox(v){ var e=el('xsyncAuto'); if(e) e.checked=!!v; }
  function setLinkLabel(txt){ var e=el('xsyncLinkBtn'); if(e) e.textContent=txt; }

  var API = {
    rulesProvider: null,   /* function(){ return [{name, aoa, cols}] } */
    rulesImporter: null,   /* function(sheetsByName){ ...; return changed } */
    _cfg: null,
    init: function(config){
      API._cfg = Object.assign({toolName:'Tool'}, config||{});
      var lb=el('xsyncLinkBtn');   if(lb) lb.addEventListener('click', function(){ var q=P(); if(q) q.link(); });
      var sb=el('xsyncNowBtn');    if(sb) sb.addEventListener('click', function(){ var q=P(); if(q) q.syncAll(); });
      var ub=el('xsyncUnlinkBtn'); if(ub) ub.addEventListener('click', function(){ var q=P(); if(q) q.unlink(); });
      var au=el('xsyncAuto');      if(au) au.addEventListener('change', function(){ var q=P(); if(q) q.setAuto(au.checked); });
      var p=P();
      if(p){
        p.register({
          toolName: API._cfg.toolName,
          getRows: API._cfg.getRows || function(){ return []; },
          getRulesSheets: function(){ return API.rulesProvider ? (API.rulesProvider()||[]) : []; },
          importRules: function(sheets){ return API.rulesImporter ? API.rulesImporter(sheets) : false; },
          ui: { status:setStatus, name:setName, auto:setAutoBox, linkLabel:setLinkLabel }
        });
      } else {
        setStatus('Open the combined suite file to enable shared-Excel sync.');
      }
    },
    autoSync: function(){ var q=P(); if(q) q.autoSync(); },
    sync:     function(){ var q=P(); if(q) q.syncAll(); },
    link:     function(){ var q=P(); if(q) q.link(); },
    unlink:   function(){ var q=P(); if(q) q.unlink(); },
    /* helpers shared by the per-app rule importers */
    findSheet: function(sheets, name){
      if(!sheets) return null;
      var nn=String(name).trim().toLowerCase();
      var keys=Object.keys(sheets);
      for(var i=0;i<keys.length;i++){ if(String(keys[i]).trim().toLowerCase()===nn) return sheets[keys[i]]; }
      return null;
    },
    rowsToObjs: function(aoa, cols){
      var out=[];
      if(!aoa || aoa.length<2) return out;
      for(var r=1;r<aoa.length;r++){
        var row=aoa[r]||[];
        if(row.every(function(c){ return c==null || String(c).trim()===''; })) continue;
        var o={};
        for(var c=0;c<cols.length;c++){ var v=row[c]; o[cols[c]] = (v==null?'':v); }
        out.push(o);
      }
      return out;
    }
  };
  return API;
})();

/* ---------- Init ---------- */
addLineRow(); render();
ExcelSync.init({
  toolName:'Waystar Recon',
  defaultFileName:'Invoice_Tracking_Log.xlsx',
  getRows:function(){ return invoices.map(function(inv){ var r=resultOf(inv); return {
    'Tool':'Waystar Recon',
    'File / Source':inv.sourceFile||inv.invno||'',
    'Invoice #':inv.invno,
    'Date':inv.date||'',
    'Amount':num(inv.amount),
    'Status':r.status.toUpperCase(),
    'Issues / Notes':r.reasons.join('; ')||(inv.notes||''),
    'Uploaded':inv.uploadedAt||''
  }; }); }
});

/* ===== Rules <-> Excel wiring (Waystar) ===== */
(function(){
  var RT_COLS=['id','label','group','type','price','match'];
  var SV_COLS=['id','label','volumeFrom','pattern','current_monthlyFee','current_tier','current_overage','previous_monthlyFee','previous_tier','previous_overage'];
  ExcelSync.rulesProvider = function(){
    var prices=getPrices(), sav=getSavings();
    var rt=[RT_COLS].concat(prices.map(function(p){ return [p.id,p.label,p.group,p.type,p.price,p.match||'']; }));
    var sv=[SV_COLS].concat(sav.map(function(s){ return [s.id,s.label,s.volumeFrom==null?'':s.volumeFrom,s.pattern,
      s.current.monthlyFee,s.current.tier,s.current.overage,s.previous.monthlyFee,s.previous.tier,s.previous.overage]; }));
    return [
      { name:'Waystar Rate Table', aoa:rt, cols:[{wch:16},{wch:42},{wch:14},{wch:14},{wch:12},{wch:60}] },
      { name:'Waystar Savings Model', aoa:sv, cols:[{wch:14},{wch:28},{wch:14},{wch:14},{wch:16},{wch:12},{wch:14},{wch:16},{wch:12},{wch:16}] }
    ];
  };
  ExcelSync.rulesImporter = function(sheets){
    var changed=false;
    var rt=ExcelSync.findSheet(sheets,'Waystar Rate Table');
    if(rt && rt.length>1){
      ensureEdit();
      rates.prices=ExcelSync.rowsToObjs(rt,RT_COLS).map(function(o){ return {id:String(o.id||''),label:String(o.label||''),group:String(o.group||''),type:String(o.type||''),price:Number(o.price)||0,match:String(o.match||'')}; });
      changed=true;
    }
    var sv=ExcelSync.findSheet(sheets,'Waystar Savings Model');
    if(sv && sv.length>1){
      ensureEdit();
      rates.savings=ExcelSync.rowsToObjs(sv,SV_COLS).map(function(o){ return {id:String(o.id||''),label:String(o.label||''),
        volumeFrom:(o.volumeFrom===''||o.volumeFrom==null)?null:String(o.volumeFrom),pattern:String(o.pattern||'overage'),
        current:{monthlyFee:Number(o.current_monthlyFee)||0,tier:Number(o.current_tier)||0,overage:Number(o.current_overage)||0},
        previous:{monthlyFee:Number(o.previous_monthlyFee)||0,tier:Number(o.previous_tier)||0,overage:Number(o.previous_overage)||0}}; });
      changed=true;
    }
    if(changed){ save(); if(typeof render==='function') render(); if(typeof renderMatrix==='function') renderMatrix(); }
    return changed;
  };
})();
</script>
</body>
</html>

</template>

<template class="app-src" data-app="ternium">
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ternium Invoice Validator</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --muted:       #898781;
    --hairline:    #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent:      #475569;
    --good:        #0ca30c;
    --good-text:   #006300;
    --warning:     #b97b00;
    --serious:     #b34f24;
    --critical:    #d03b3b;
    --critical-bg: rgba(208,59,59,0.07);
    --warning-bg:  rgba(250,178,25,0.10);
    --good-bg:     rgba(12,163,12,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
  header h1 { font-size: 20px; margin: 0 0 2px; }
  header h1 span { color: var(--accent); }
  header p { margin: 0 0 22px; color: var(--ink-2); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
  }

  /* Drop zone */
  #drop {
    border: 2px dashed var(--hairline); border-radius: 10px;
    padding: 44px 20px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop.hover { border-color: var(--accent); background: rgba(71,85,105,0.06); }
  #drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
  #drop span { color: var(--ink-2); }
  #drop .note { display:block; margin-top: 10px; font-size: 12px; color: var(--muted); }

  /* Fee schedule config */
  .fee-config h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .fee-config table { border-collapse: collapse; }
  .fee-config td, .fee-config th { padding: 4px 18px 4px 0; text-align: left; font-weight: 400; color: var(--ink-2); }
  .fee-config th { font-weight: 600; color: var(--ink); font-size: 13px; }
  .fee-config input {
    width: 64px; padding: 4px 6px; border: 1px solid var(--hairline); border-radius: 6px;
    background: var(--page); color: var(--ink); font: inherit; text-align: right;
  }

  /* Progress */
  #progress .bar-track { height: 8px; border-radius: 4px; background: var(--hairline); overflow: hidden; margin: 10px 0 8px; }
  #progress .bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 4px; transition: width .25s; }
  #progress #status-line { color: var(--ink-2); }
  #progress .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* Banner */
  .banner { border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; border: 1px solid var(--border); font-size: 15px; }
  .banner.ok   { background: var(--good-bg); }
  .banner.bad  { background: var(--critical-bg); }
  .banner.warn { background: var(--warning-bg); }
  .banner .big { font-weight: 700; }

  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .tile .value { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .tile .sub   { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .tile.hero .value { color: var(--accent); font-size: 30px; }
  .delta-bad  { color: var(--critical); font-weight: 600; }
  .delta-good { color: var(--good-text); font-weight: 600; }

  /* Reconciliation list */
  .recon { list-style: none; padding: 0; margin: 0; }
  .recon li { padding: 6px 0; border-bottom: 1px solid var(--hairline); display: flex; gap: 10px; align-items: baseline; }
  .recon li:last-child { border-bottom: none; }
  .recon .mark { font-weight: 700; width: 18px; flex: none; text-align: center; }
  .recon .mark.ok { color: var(--good-text); }
  .recon .mark.bad { color: var(--critical); }
  .recon .mark.warn { color: var(--warning); }
  .recon .what { color: var(--ink-2); }

  /* Controls row */
  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 10px; }
  .controls label { color: var(--ink-2); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .controls .spacer { flex: 1; }
  button.btn {
    font: inherit; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn:hover { filter: brightness(1.05); }

  /* Table */
  .table-scroll { overflow: auto; max-height: 620px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.data th, table.data td { padding: 6px 10px; white-space: nowrap; }
  table.data thead th {
    position: sticky; top: 0; background: var(--surface); z-index: 1;
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); border-bottom: 1px solid var(--hairline);
  }
  table.data td { border-bottom: 1px solid var(--hairline); }
  table.data tr:last-child td { border-bottom: none; }
  table.data .num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data thead th.num { text-align: right; }
  tr.row-bad  td { background: var(--critical-bg); }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
  .chip.ok   { color: var(--good-text); }
  .chip.bad  { color: var(--critical); }

  details.log { margin-top: 14px; color: var(--ink-2); }
  details.log summary { cursor: pointer; color: var(--muted); }
  details.log pre { white-space: pre-wrap; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }

  #fatal { color: var(--critical); font-weight: 600; }
  [hidden] { display: none !important; }

  /* Tabs / views */
  .nav { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 22px; flex-wrap: wrap; }
  .nav button { background: none; border: none; padding: 12px 16px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }

  input,select,textarea{accent-color:#475569}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Ternium</span> Invoice Validator</h1>
    <p>Import a Ternium RCM invoice PDF &mdash; the tool OCRs the transactional detail, re-computes every line (fee = collections &times; rate), cross-foots the totals against the invoice, and flags any line billed at a non-standard rate.</p>
  </header>

  <div class="nav">

    <input type="file" id="file-input" accept="application/pdf" hidden>
  </div>

  <div class="card fee-config">
    <h2>Fee-rate audit settings (edit to re-validate instantly)</h2>
    <table>

        <th>Standard contract rate</th>
        <td><input type="number" step="0.01" min="0" max="99" value="8" id="std-rate"> %</td>
        <td style="text-align:left"><label style="font-weight:600;cursor:pointer"><input type="checkbox" id="auto-rate" checked> Auto-detect from invoice (use the most common rate)</label></td>
      </tr>
    </table>
    <p class="note" style="margin:8px 0 0">Every line is re-checked against its own printed rate (fee = collections &times; rate). Lines billed at anything other than the standard rate are flagged for review.</p>
  </div>

  <div class="card" id="progress" hidden>
    <div id="status-line">Starting&hellip;</div>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <div class="hint" id="page-log"></div>

  </div>

  <div id="results" hidden>
    <div class="banner" id="banner"></div>

    <div class="tiles">
      <div class="tile hero">
        <div class="label">Total collected</div>

        <div class="sub" id="t-collected-sub"></div>

      <div class="tile">

      <div class="tile">
        <div class="label">Fees at standard rate</div>
        <div class="value" id="t-expected">&ndash;</div>
        <div class="sub" id="t-expected-sub"></div>
      </div>
      <div class="tile">
        <div class="label">Fee-rate discrepancies</div>
        <div class="value" id="t-errors">&ndash;</div>
        <div class="sub" id="t-errors-sub"></div>

    <div class="card">

  </section>

  <section class="view" id="view-dashboard">
    <div class="banner ok" style="background:var(--good-bg)">
      <span class="big">Team dashboard.</span> A running log of every invoice validated on this machine, plus a one-time link to a shared Excel workbook so your supervisor can see which files came in and how they validated.
    </div>

    <div class="tiles" id="dashTiles"></div>

    <div class="card">
      <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px">📊 Sync to Excel — for your supervisor</h2>
      <p style="margin:0 0 12px;color:var(--ink-2)">Link a shared Excel workbook once. Every validated invoice writes/updates a row in an <b>Upload Log</b> sheet so your supervisor can open the file and see what's been processed. In Chrome/Edge the file updates <b>in place</b>; other browsers download an updated copy to drop in your shared folder. All three validators can safely share one workbook.</p>
      <div class="sync-row">
        <button class="btn primary" id="xsyncLinkBtn">Link Excel workbook</button>
        <button class="btn" id="xsyncNowBtn">Sync now</button>
        <button class="btn" id="xsyncUnlinkBtn">Unlink</button>

        <span class="spacer" style="flex:1"></span>
